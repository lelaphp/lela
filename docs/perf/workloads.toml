[pages]
first_read = 4329
about = "the four pages of the WordPress bench, each served by the counting build from a copy of the rig as #4329 served them"
role = "bench"
warm = 3
ini = ["memory_limit=512M", "opcache.enable=1", "opcache.enable_cli=1", "opcache.jit=off"]
page = [
  { name = "front", path = "/" },
  { name = "post", path = "/?p=1" },
  { name = "search", path = "/?s=hello" },
  { name = "login", path = "/wp-login.php" },
]

