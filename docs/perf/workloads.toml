# The workloads (measurement protocol §11; #4335 ruled it, #4344 built it):
# every program under docs/perf/workloads/, and the programs the dispatch
# census counts that live elsewhere, each declared once. `xtask bench`, `xtask
# dispatch-census` and `xtask trace-dump` reach a program only through its row
# here, by xtask/src/workloads.rs, and §11's table is rendered from it.
#
# One `[[workload]]` per program. `stem` names it: its file is
# docs/perf/workloads/<stem>.php, unless `pinned` names a file of the pinned
# php-src or `code` gives it whole, run as a witness's snippet is, with `<?php`
# on the line above it. `first_read` is the ticket that first read it and
# `about` what it is. `role` is one of
#   kernel   one of the seven kernels the tier's gates are measured on
#   bench    a program the bench's bars run beside the kernels
#   shape    a program written to the opline mix of real pages
#   probe    a program that holds one mechanism of the loop to a count or a bar
#   native   a program whose time is spent in an extension's natives
# A kernel's and the bench's counts vote in IN_THE_LOOP's criterion
# (crates/php_engine/build/arms.rs); a shape's, a probe's and a native's do
# not, as #4364 amended #4335's ruling, and `Role::votes` in
# xtask/src/workloads.rs is where that is decided. A role is a person's to
# give: a workload added later votes only once a person gives it a role that
# votes. `exit` is the status each of its runs ends on, 0 where it states
# none. Each `profile` is one run, its `name` and the `args` after the
# program's path; a workload that lists none runs once, with none.
#
# `[pages]` declares the bench's pages, which `xtask dispatch-census` counts
# beside the programs (#4364, #4367). The site that serves them is kept off
# the repository: the variable XTASK_RIG names a description of it on this
# machine, outside the repository (xtask/src/dispatch_census/pages.rs says
# what it holds), and where none is described each page's reading is a skip
# that says so. Each page is served by the counting build's built-in server
# of its own, under `-n` and each of `ini`, over a fresh copy of the rig's
# database: `warm` requests of the page first, then one counted, scoped
# `pages/<name>`, which answers 200 or is out of the vote.

