# The divergence registry (harness-design.md §4.3). One row per accepted
# difference from the oracle, keyed by a witness hash, a phpt path, a
# compile-identity path, an extension's name or a trace site. The oracle
# module's `compare` consults it on every comparison; a person writes the
# reason; `compare` and the fuzzer may add a row with status `open` and an
# empty reason, and `done` fails while an open row touches the scope. A row's
# kind is the lane that reads it and its cause whether it is parity debt: the
# day-30 target, seams.toml's `[divergence] target`, counts the rows whose cause
# is debt, and each other cause is counted on its own line (#2460). A by-design
# row's reason cites the design section or ADR that chose it, and an
# oracle-build row names in `retires` what it retires at (`divergence-reason`).
# The Markdown rendering is `xtask status --section divergence`.
#
# kind: witness | phpt | runner | compile | crosscheck | trace
# cause: debt (where absent) | php-ub | by-design | oracle-build
# retires: oracle-rebuild | pin | fixture | platform
# status: open | accepted | fixed

[[divergence]]
id = "trace:entry-counter-typed-recv"
kind = "trace"
cause = "by-design"
reason = "php's entry counter sits on opline zero for a function with typed parameters, before the RECV that may throw (zend_jit_setup_hot_trace_counters, zend_jit_trace.c:8983-9001 at 8.5.9), so php counts a call whose RECV throws; Site::Entry is raised after the prologue ran without raising, so a throwing RECV is never inside a recording, and such a call is not a root here (third-engine-design.md §5.6, ledger 9)."
status = "accepted"
since = "2026-09-07"

[[divergence]]
id = "witness:cf4528199e0939351d4a51853e4aa2ab27c7b12e"
kind = "witness"
reason = "memory_get_usage() at a request's first line is held to opcache's regime, the model the unit cache copies (§5.13, §6.3): what php allocates there whatever it compiles is on mm at php's sizes, the compiler's arena and the run-time caches it carves among it (#2863), and the main script's compile, like an include's, costs what opcache's lookup allocates. Under the recipe's php -n php compiles them into the request's heap, so a witness under it reads php's usage and peak short by that compile, and a memory_limit fatal falls on another allocation at another requested size (#2854). gc_mem_caches() at a program's first line gives back fewer pages by the same cause: the runs php frees there held the compile's temporaries, which this engine keeps off mm. What is held meanwhile is the delta a single allocation makes, which both engines answer the same way (#174)."
status = "accepted"
since = "2026-09-13"

[[divergence]]
id = "trace:heap-openbsd-stack-base"
kind = "trace"
cause = "php-ub"
reason = "On OpenBSD php raises no stack-limit Error; this engine raises php's Error at the limit, as php does on its other platforms. Site: php_heap::call_stack::platform::pthread_bounds on OpenBSD (#299, #343)."
status = "accepted"
since = "2026-09-18"

[[divergence]]
id = "compile:file-update-protection"
kind = "compile"
cause = "by-design"
status = "accepted"
since = "2026-09-18"
reason = "php's opcache does not cache a file modified within opcache.file_update_protection (2s by default). This engine honours the window for every request through opcache's admission (Admission::Held { protection }, #1228; bug65559.phpt meets it), but the dump site compiles through the cache with no request and so no window, and dumps; the recipe pins the entry to zero, so no lane reads the difference (#374, #402; compile identity, third-engine-design.md §6.1). Site: php_engine::engine::dump_before_optimizer."

[[divergence]]
id = "trace:rope-storage"
kind = "trace"
status = "fixed"
since = "2026-09-18"
reason = "ROPE_INIT/ROPE_ADD keep the pieces as one packed array in the reserved stretch's first slot where php packs two zend_string pointers per zval (zend_vm_def.h ROPE_* at 8.5.9), so memory_get_usage() read from a piece's __toString while the rope is open differs from php's by the array's allocation; the rope's result and every other observable are php's (#355, #368). Site: php_engine::handlers::rope_init."
covers = ["witness:4ae80a483111455490751b442ce7da2fb3f0714b", "witness:f0bd64581431518fee86bd089efc85b44484a22e", "witness:ff76c1b529a9aa7700c48cbaad6cceea8e383356"]

[[divergence]]
id = "trace:dl-no-loader"
kind = "trace"
cause = "by-design"
status = "accepted"
since = "2026-09-26"
reason = "This engine links its extensions at build and has no loader, by design (third-engine-design.md §7.1: no dl() and no zend_module_entry ABI). So dl() for a bare name under enable_dl=1 answers as php built without HAVE_LIBDL does, in php's own wording for that build: \"Cannot dynamically load %s - dynamic modules are not supported\". The oracle tries extension_dir/name and name.so through dlopen and warns with both paths and the host's dlerror text. Both return false, and nothing there is a behaviour a program could rely on: the oracle's text is host dyld output. Ruled by Mitchell on #890 (2026-09-26). Site: php_engine::api::request::Extensions::dl, which sapi/cli and sapi/cgi name in their additional_functions (#1348, #1495)."

[[divergence]]
id = "trace:immutable-literal-arrays"
kind = "trace"
cause = "by-design"
status = "accepted"
since = "2026-09-26"
reason = "This engine's unit literals are immutable and shared, opcache's model: its literal arrays, settled by Mitchell on #917 (2026-10-01), and the strings its declarations hold, an attribute's argument, a backed enum case's value and a static initialiser, on #1472 (2026-10-02; §5.2, revision 64), which ends the interim #770 set (2026-09-26; third-engine-design.md §5.3, revision 62). Under the recipe (php -n) php refcounts its literals per request, so every observable of a literal's refcount differs from it and agrees with the oracle under opcache: among them a copy released leaving a GC root there and none here (gc_status()['roots'], gc_collect_cycles counts), debug_zval_dump refcounts (interned against refcount(N)), memory_get_usage over a copied literal, phpdbg's watch report of a literal's old value (Old value: the literal here, Old value inaccessible or destroyed under the recipe; #1454), and memory_get_usage() over a string held only in a constant array that a native interns at run time (zend_string_init_interned, mysqlnd's column names), which publication interned as opcache's persist does and php -n does not (#2443), and memory_get_usage() over a class constant's or an enum case's first read, whose constant expression php -n frees as it evaluates it and a published unit keeps (#2495; opcache also separates an immutable class's constant table at that first update, zend_separate_class_constants_table, which a class of a published unit does not). Production php runs opcache, under which the two agree but for that separation. A witness that pins those names [regime.immutable-literals] and agrees exactly; the phpt tests that observe it are phpt:immutable-literals' covers (#1158, #1485). Site: php_heap immutable arrays, php_unit literal tables."

