id = "phpt:keg-libgd"
kind = "phpt"
cause = "oracle-build"
retires = "platform"
reason = "On this machine the pinned oracle misses each of these tests and the engine prints the oracle's bytes: their expectations are php's bundled libgd's, where php and this engine both link the keg's libgd 2.3.3 over FreeType 2.15.0, as #1573 ruled ext/gd onto. Six pin text boxes the bundled libgd computes otherwise (imageftbbox and imagettftext corners: bug43073, bug48732, bug48732-mb, bug48801, bug48801-mb, bug53504). Four pin the bundled libgd's interpolation and rotation: libgd 2.3.3's gdImageSetInterpolationMethod refuses IMG_BICUBIC and IMG_BICUBIC_FIXED, so imagegetinterpolation answers the old method and imagescale under IMG_BICUBIC answers false (imageinterpolation_basic, imagescale_preserve_ratio, bug79676), and imagerotate sizes its result by 2.3.3's rule (bug73272, 137x137 for 135x136). bug65148 is not met by the oracle under the keg's libgd, and the engine prints 2.3.3's 42x24 for 40x23. One pins the bundled libgd's GD2 reader (createfromstring-overflow), which the keg's libgd, built without GD2, refuses with its own warning before it reads a chunk. A test leaves this row when the keg's libgd meets it; the runner's control reads the oracle's verdict on each at every run."
