[[divergence]]
id = "trace:kernel-operands-as-they-stood"
kind = "trace"
cause = "by-design"
reason = "php reads each operand through its zval, so a handler that a conversion reaches and that writes a variable operand changes what php's operation sees, the type its TypeError names and whether it warns: `$GLOBALS[\"v\"] = 0` from the handler of `\"1x\" + $v` reads int(1) in php and int(78) here, and a handler that unsets $v makes php's `+` the TypeError `Unsupported operand types: string + null` where the engine reads 78. Concat is of this class too: `$a = [1]; $b = str_repeat(\"b\", 3); $a = $a . $b;` under a handler that unsets both reads `Array` in php and `Arraybbb` here. A kernel takes its operands as copied views and does not re-read their places, so one kernel serves the dispatch loop, `api`'s natives and the tier alike (third-engine-design.md §5.8); re-reading the place takes a signature change on every kernel or a hidden channel on the request. Since 9cf7e47cf, `operands` and `concat_operands` hold the right operand across the left's conversion, so a handler reads its refcount one higher than php's, and the destructor of a right operand the handler gives up runs once the operation is done, where php's runs in the handler. Site: php_engine's ops::operands and ops::concat_operands. Ruled by Mitchell on #4158 (2026-11-05)."
status = "accepted"
since = "2026-11-07"
covers = ["trace:crates/php_engine/src/ops/mod.rs::tests::a_right_operand_reads_one_more_owner_in_the_handler_and_is_destroyed_past_the_operation", "trace:crates/php_engine/src/tests/given_up.rs::a_right_operand_a_handler_gave_up_is_read_past_the_left"]

