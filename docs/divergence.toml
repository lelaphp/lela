[[divergence]]
id = "crosscheck:pcre"
kind = "crosscheck"
cause = "oracle-build"
retires = "oracle-rebuild"
reason = "PCRE_VERSION_MAJOR and PCRE_VERSION_MINOR are @cvalue PCRE2_MAJOR and PCRE2_MINOR, the pcre2.h a build was compiled against: the oracle was built against pcre2 10.47 and the keg has moved on, so the oracle's minor is 47 and this engine's, read at build from the keg's pcre2.h, is 48; both processes load the keg's 10.48 library, and PCRE_VERSION, the library's, agrees. Every class, function and other constant of the rendering is the oracle's. The two agree again when the oracle is rebuilt against the installed library (#2254). Accepted by Mitchell on #1978 (2026-10-07), option 1: the same rule as #1958 and #1974 for the other header macros; keeping the oracle's values was rejected, as it states a fact about another binary and goes silently wrong on an oracle bump."
status = "fixed"
since = "2026-10-07"

[[divergence]]
id = "crosscheck:pdo"
kind = "crosscheck"
cause = "by-design"
reason = "pdo_dblib, pdo_odbc and pdo_pgsql are outside parity by Mitchell's ruling on #1167, and their MINITs are what add PDO's 18 DBLIB_*, ODBC_* and PGSQL_* class constants in the oracle's build; this engine's bundle carries none of the three, so its PDO lists 97 constants where the oracle's lists 115. Registering the constants without the drivers would be wrong, as php adds them only with the driver. Every other line of the rendering is the oracle's. Accepted by Mitchell on #2266 (2026-10-09). By design since #2981 (Mitchell, 2026-10-23): it follows from third-engine-design.md §12, whose [parity] out puts the three drivers outside parity (#1167), and the engine can retire it only by carrying them."
status = "accepted"
since = "2026-10-09"

