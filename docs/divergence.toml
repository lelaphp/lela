id = "trace:posix-spawnp-relative-path-under-cwd"
kind = "trace"
cause = "oracle-build"
retires = "platform"
reason = "Darwin's posix_spawnp reports failure after starting a child found through a relative PATH entry under a `$cwd`; the engine returns the process. With `PATH=:/nowhere` and the parent in `/`, `proc_open(['x'], [1 => ['pipe', 'w']], $pipes, $dir)` for an executable `x` in `$dir` warns `posix_spawn() failed: No such file or directory` and returns false on the pinned oracle, the child already running; php 8.5.12 on Linux (the official php:8.5.12-cli image, glibc 2.41), whose proc_open takes the same posix_spawnp arm (Z/ext/standard/proc_open.c:1420), starts it and returns the process, as the engine does (#4177). The difference exists because on_path searches itself, so the row never retires on a Darwin pin; copying Darwin would return false over a live child. Site: ext/standard's proc_open, on_path (ext/standard/src/proc_open.rs). Ruled by Mitchell on #4140 (2026-11-05)."
status = "accepted"
since = "2026-11-07"

