[[divergence]]
id = "phpt:platform"
kind = "phpt"
cause = "oracle-build"
retires = "platform"
reason = "On this machine the pinned oracle misses each of these tests and the engine prints the oracle's bytes: what the expectation holds is another platform's, and not the engine's to meet. The six of ext/iconv pin glibc's iconv, where php and this engine both link macOS's /usr/lib/libiconv.2.dylib (ICONV_IMPL libiconv, ICONV_VERSION 1.11), as principle 3 binds the engine to. mcast_ipv6_send sets IPV6_MULTICAST_IF to interface 0, which Darwin refuses with EINVAL where Linux takes it as the default interface (ext/sockets/multicast.c:350-360 passes the index through). A test leaves this row when the pin or the platform moves and the oracle meets it again; the runner's control reads the oracle's verdict on each at every run."
status = "accepted"
since = "2026-09-29"
covers = [
    "phpt:php-src/ext/iconv/tests/bug52211.phpt",
    "phpt:php-src/ext/iconv/tests/iconv_mime_encode.phpt",
    "phpt:php-src/ext/iconv/tests/iconv_strpos.phpt",
    "phpt:php-src/ext/iconv/tests/iconv_strrpos.phpt",
    "phpt:php-src/ext/iconv/tests/iconv_substr.phpt",
    "phpt:php-src/ext/iconv/tests/translit-utf8.phpt",
    "phpt:php-src/ext/sockets/tests/mcast_ipv6_send.phpt",
]

