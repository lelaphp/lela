[[divergence]]
id = "phpt:php-src/ext/standard/tests/file/realpath_bug77484.phpt"
kind = "phpt"
cause = "by-design"
reason = "This engine keeps a request's working directory as php's ZTS build does, a virtual cwd per request (VIRTUAL_DIR, Zend/zend_virtual_cwd.h:53, :271-282), since requests share one process's threads (principle 4, design §5.14). After the test removes the directory it changed into, getcwd() answers the virtual path and realpath('.') false, as virtual_getcwd and virtual_realpath do; the NTS oracle asks the kernel (zend_virtual_cwd.h:330, :341) and answers false and \".\". php skips the test on every ZTS build for this difference (realpath_bug77484.phpt:8-11, \"TODO eliminate difference in TS build\"). Site: php_engine::virtual_cwd."
status = "accepted"
since = "2026-09-29"

[[divergence]]
id = "trace:opcache-use-cwd"
kind = "trace"
reason = "opcache.use_cwd=0 (PHP_INI_SYSTEM) has php key a relative include by the path as written alone, so two directories' config.php share one cached script, the collision php's documentation warns of. This engine always keys a relative path with the working directory, the include_path and the including file's directory, as php's default use_cwd=1 does: the key is made before the one question the cache asks opcache. No test in php-src sets use_cwd. Site: php_engine::api::request::unit_cache::Request::written_key."
status = "accepted"
since = "2026-09-30"

[[divergence]]
id = "phpt:php-src/sapi/phpdbg/tests/watch_006.phpt"
kind = "phpt"
cause = "by-design"
reason = "php's watchpoints are per address and checked per protected page (phpdbg_watch.c's mprotect over each watched zval's page): a write to any slot sharing a page with a watched slot makes phpdbg compare that watch's backup, so watch_006 expects a break on $b at `$c = [1];`, a line that writes neither $b nor what it references. The report depends on memory layout, and php-src marks the test xfail for flaws in its watchpoints. This engine compares watches between steps with no page protection (#1308, jit-design.md §2.4, as trace:phpdbg-watch-page-fault cites), so it reports a watch only where the watched value changes. Site: sapi/phpdbg's watch list."
status = "accepted"
since = "2026-10-01"

[[divergence]]
id = "phpt:php-src/sapi/phpdbg/tests/phpdbg_oplog_001.phpt"
kind = "phpt"
reason = "php runs a function's RECV* prologue from its executor loop, starting at opline zero unless every argument was passed and no parameter is typed (i_init_func_execute_data, Zend/zend_execute.c:4426-4437), so phpdbg's oplog counts A::b's RECV_INIT on line 4 for $a->b() and not for $a->b('ha'). This engine runs the prologue inside the call's activation, before Site::Entry (third-engine-design.md §5.6), so that a RECV that throws is never inside a recording (jit-design.md §4.1, trace:entry-counter-typed-recv); no tier, a debugging tier included, is ever at a RECV* opline. Only an oplog or a step over oplines sees it: the expectation's `[4] => int(1)` is absent here, and every other count is php's once the comparison handlers branch as ZEND_VM_SMART_BRANCH does (§5.8). Ruled by Mitchell on #1385 (2026-10-01). Site: php_engine::exec::parameter_prologue."
status = "accepted"
since = "2026-10-01"

[[divergence]]
id = "trace:ini-extension-no-loader"
kind = "trace"
cause = "by-design"
reason = "An extension= or zend_extension= line runs php's path building for its kind after startup, where php runs it (main/main.c:2352; php_load_extension, ext/standard/dl.c:110-170; php_load_zend_extension_cb), and warns php's \"Unable to load dynamic library '%s' (tried: %s (%s), %s (%s))\" naming the paths it built. This engine links its extensions at build and has no loader (third-engine-design.md §7.1, trace:dl-no-loader), so every load fails, a bundled extension's name included, as php's does for a static module with no shared object, and each path's parenthesis reads \"dynamic modules are not supported\" where the oracle carries the host's dlerror text, which is host dyld output. Ruled by Mitchell on #1176 (2026-10-01). Site: php_engine's startup, where the collected lines are loaded."
status = "accepted"
since = "2026-10-01"

[[divergence]]
id = "trace:oracle-extensions-not-carried"
kind = "trace"
cause = "by-design"
reason = "php's pinned build carries extensions this engine's bundle does not, so whatever reads the loaded set answers with fewer: phpdbg's clean counts of classes, functions and constants, php -m, get_loaded_extensions() and extension_loaded(). Seven are outside parity by Mitchell's ruling on #1167 (third-engine-design.md §1, §12, as phpt:ruled-out-extensions cites): pgsql, pdo_pgsql, ldap, snmp, odbc, pdo_odbc and pdo_dblib. Ruled by Mitchell on #1451 (2026-10-01), its lists kept by #1577. Site: php_bundle, the enabled set."
status = "accepted"
since = "2026-10-01"


[[divergence]]
id = "trace:phpdbg-watch-page-fault"
kind = "trace"
cause = "by-design"
reason = "php's phpdbg compares a watch when a write faults the page its zval shares (phpdbg_watch.c's mprotect handler), so a write to another variable on that page can report a watch whose value nothing wrote: [Breaking on watchpoint $a], Old value inaccessible or destroyed, and the value unchanged. This host compares watches between steps (#1308, jit-design.md §2.4) and reports only values that changed. watch_006.phpt is accepted for the same cause. Ruled by Mitchell on #1475 (2026-10-02). Site: sapi/phpdbg's watch list."
status = "accepted"
since = "2026-10-02"


[[divergence]]
id = "trace:phpdbg-watch-recursive-teardown"
kind = "trace"
reason = "At a run's end php's phpdbg reports some removals of recursive array watches and drops others (3 of 26 measured sequences): phpdbg_watch.c dissociates a recursive root and mutates hti->watches while it walks it, so which removals reach the report depends on that walk. This host reports every watch removed, in the order php's teardown frees what each stands on (#1453). Ruled by Mitchell on #1476 (2026-10-02); retire with a pin that reports every removal. Site: sapi/phpdbg's watch list."
status = "accepted"
since = "2026-10-02"


[[divergence]]
id = "trace:dba-ndbm-null-handle"
kind = "trace"
cause = "php-ub"
reason = "php's dba_open_ndbm stores the null DBM* dbm_open answers when it refuses, and reports the open as a success (ext/dba/dba_ndbm.c), so dba_open() answers a Dba\\Connection and the next operation, or the close at shutdown, calls the library on null and segfaults. This engine answers the same Connection, holds the null as no handle, answers false from every operation on it and closes nothing: php's output up to its crash, without the crash. Ruled by Mitchell on #1524 (2026-10-02). Site: ext/dba's ndbm handler."
status = "accepted"
since = "2026-10-02"


[[divergence]]
id = "trace:phpdbg-packed-breakpoint-tables"
kind = "trace"
reason = "Under php, info break prints no list after a file breakpoint on a line below 8, a function, method or file opline breakpoint at an odd opline below 8 is never resolved or listed, and r after b foo#1 prints nothing more. This engine lists, resolves and stops at every breakpoint it was given. Ruled by Mitchell on #1554 (2026-10-02) and on #2149 (2026-10-06). Site: sapi/phpdbg's Breakpoints."
status = "accepted"
since = "2026-10-02"


