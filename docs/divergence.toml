[[divergence]]
id = "crosscheck:openssl"
kind = "crosscheck"
cause = "oracle-build"
retires = "oracle-rebuild"
reason = "OPENSSL_VERSION_TEXT and OPENSSL_VERSION_NUMBER are the headers a build was compiled against: the oracle's are OpenSSL 4.0.3's, the headers Homebrew built the 8.5.12_1 bottle against, and this engine's are 4.1.0's, the libcrypto both processes load. Every class, function and other constant of the rendering is the oracle's. The two agree again when the oracle is rebuilt against the installed library. Accepted by Mitchell (2026-11-16)."
status = "accepted"
since = "2026-11-16"

[[divergence]]
