[[divergence]]
id = "trace:stack-floor-refusal"
kind = "trace"
cause = "php-ub"
reason = "php faults with SIGSEGV when a walk nests past the thread's end without asking a stack limit: a walk php leaves unguarded (print_r, var_export, array_merge_recursive, unserialize, define()'s constant arrays, filter's and mbstring's walks over arrays among them), and any walk under zend.max_allowed_stack_size=-1, which sets none. This engine serves requests on threads of one process (principle 3), where a fault ends every request in it, so such a walk also asks the floor, the thread's end less zend.reserved_stack_size, and raises zend_call_stack_size_error's Error there; call_stack_end's and call_stack_refuses's callers are the sites. A nest php takes whole is taken whole here; only the one php cannot survive differs. Accepted by Mitchell on #1217 (2026-09-28); restated on #3433 (2026-10-25) for php 8.5.12, which guards zend_hash_compare, var_dump's and debug_zval_dump's rows, count_recursive, array_walk_recursive, array_replace_recursive and compact; amended on #4097 (2026-11-04) to name call_stack_refuses, debug_zval_dump's row guard since #4084."
status = "accepted"
since = "2026-09-28"

[[divergence]]
id = "phpt:php-src/ext/opcache/tests/gh9164.phpt"
kind = "phpt"
cause = "by-design"
reason = "php's opcache keeps what it compiles in one segment mapped MAP_SHARED before any fork (shared_alloc_mmap.c:126, ZCSG at ZendAccelerator.h:301, both at 8.5.9), so a file a pcntl_fork child compiles is in the parent's opcache_get_status()['scripts']. This engine's unit cache is the process's own memory, shared by the requests on its threads and by no other process (third-engine-design.md §5.14, §6.3, principle 4); fork(2) gives the child a copy, so what the child compiles after the fork stays the child's, and the parent prints the test's \"File not cached\" and compiles the file itself. What the parent held before the fork the child holds too, as in php. php with the cache off prints the same two lines. pcntl is built for the php binary alone, one request per process (revision 35), so no server host reaches the difference. Site: php_engine::unit_cache::UnitCache."
status = "accepted"
since = "2026-09-28"

[[divergence]]
id = "phpt:zend-optimizer"
kind = "phpt"
cause = "by-design"
reason = "php's opcache runs Zend/Optimizer over what it compiles, and these tests pin what it leaves: 60 print the op arrays after the optimizer or its DFA pass, under opcache.opt_debug_level 0x20000, 0x200000 or 0x400000, and optimize_static_002.phpt shows getStaticVariables() without the reference php's DCE elides, and ignored_opcodes.phpt shows no observer call for a function whose body returns a literal, which php's zend_try_inline_call replaces with the literal (Z/Zend/Optimizer/optimize_func_calls.c:79). This engine runs no optimizer on an executed op array (third-engine-design.md §6.1, §12, revision 44): what executes is what the compiler emits and compile-identity holds, php's op arrays before zend_optimize_script, so 0x10000 is the one dump bit that prints anything, and optimize_static_002 prints &int(42) as php does with its optimizer off. An optimizer, if one is ever built, is a port of Zend/Optimizer held to php's 0x20000 dump on its own. Ruled by Mitchell on #1220 (2026-09-28)."
status = "accepted"
since = "2026-09-28"
