[[divergence]]
id = "trace:string-offset-shared-mid-write"
kind = "trace"
reason = "php separates the string once, before the offset's warnings, and writes through whatever owners it has after the handler ran, so a variable the handler assigned from it changes too. This engine separates again after the handlers, keeping every shared string immutable (principle 3). No pinned phpt observes it. Accepted by Mitchell on #1009 (2026-09-27)."
status = "accepted"
since = "2026-09-27"

