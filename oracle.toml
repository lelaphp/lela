# The pinned oracle. The only statement of the oracle's version, digest and
# invocation recipe (design §8, harness §4.3). Every design document cites this
# file and states no version. Bumping it is a person's act with its own review,
# never a side effect of a green run; the nightly `oracle drift` lane re-runs the
# witnesses against this binary and fails when php's own bytes move.
#
# Read by `xtask`'s oracle module and nothing else. The module asserts the digest
# before every run and refuses the whole run on a mismatch.

[oracle]
version = "8.5.12"
# The Homebrew formula the keg is poured from (#4383, ruled on #4373): `php`
# while that is Homebrew's formula of this line, and `php@8.5` once Homebrew
# moves `php` to 8.6, whose keg is `Cellar/php@8.5/<version>`.
# `scripts/ci/pinned-php.sh` pours it, and xtask refuses a pin whose paths
# below stand in another formula's keg.
formula = "php"
# The keg path, not `/opt/homebrew/bin/php`: the bare name is a symlink the
# package manager re-points on upgrade (Dax's oracle.toml records it moving
# 8.5.9 → 8.5.10 mid-run on 2026-09-01). The digest is the identity; the path is
# where to find it on this machine.
path = "/opt/homebrew/Cellar/php/8.5.12_1/bin/php"
md5 = "e68f73bdb7e8b06932559d9c0fd5c26e"
# opcache is compiled into this build (`php -n -m` lists it; no `zend_extension`
# line is needed or accepted). The tier regimes below rely on that.

[closure]
# The Homebrew kegs the pinned binaries load, each at its version as Homebrew
# names it (`pkg_version`): the oracle is php and this closure, held as one
# (Mitchell on #2654, 2026-10-11). Every keg `php`, `php-cgi`, `php-fpm` and
# `phpdbg` load, walked through their load commands, and the receipt's other
# runtime kegs, `ca-certificates` among them for the trust store curl and
# OpenSSL read; frozen as the Cellar stood on 2026-11-15, each `brew pin`ned.
# `xtask` refuses a run whose binaries load a keg at another version or one
# this table does not name (#2657); `scripts/ci/pinned-php.sh` pours and pins
# each on a runner.
aom = "3.15.3"
apr = "1.7.6"
apr-util = "1.6.6"
argon2 = "20190702_1"
autoconf = "2.73"
brotli = "1.2.1"
ca-certificates = "2026-11-05"
curl = "8.23.0"
dav1d = "1.5.4"
fontconfig = "2.18.3"
freetds = "1.5.21"
freetype = "2.15.0"
gd = "2.3.3_6"
gettext = "1.0"
giflib = "6.1.3"
gmp = "6.3.0"
"icu4c@79" = "79.1"
jpeg-turbo = "3.2.1"
json-c = "0.19"
krb5 = "1.22.3"
libavif = "1.4.2"
libnghttp2 = "1.71.0"
libnghttp3 = "1.19.0"
libngtcp2 = "1.26.0"
libpng = "1.6.59"
libpq = "18.7"
libpsl = "0.23.3"
libsodium = "1.0.22"
libssh2 = "1.11.1_7"
libtiff = "4.7.2"
libtool = "2.6.2"
libunistring = "1.5"
libvmaf = "3.2.1"
libzip = "1.12.1"
lz4 = "1.11.1"
m4 = "1.4.21"
net-snmp = "5.9.5.2_2"
oniguruma = "6.9.10"
openldap = "2.7.2"
"openssl@4" = "4.1.0"
pcre2 = "10.49"
readline = "8.3.6"
sqlite = "3.54.1"
tidy-html5 = "5.8.0"
unixodbc = "2.3.14"
webp = "1.6.0"
xz = "5.8.4"
zstd = "1.5.7_1"

[source]
# The php-src tree at the same tag: the stubs `xtask crosscheck` reads, the phpt
# corpus, `Zend/zend_vm_def.h` for `ops.toml`, and every `Z/path:line` citation
# from this revision on. Design revisions before 8 cite 8.5.7 line numbers.
tag = "php-8.5.12"
commit = "136e049a"
phpt_files = 22280    # `find . -name '*.phpt' | wc -l` at the tag

[recipe]
# The witness regime (design §8): the snippet runs as `witness.php` with `<?php`
# on line 1 and the code on line 2, so php's own error text matches.
script_name = "witness.php"
preamble = "<?php\n"
# php's own `run-tests.php` regime: `-n` and upstream's `$ini_overwrites`
# (run-tests.php:269-308 at the tag, 38 entries) passed as `-d`, exactly as
# `settings2params` renders them. `xtask phpt` adds a test's `--INI--` section
# after these; `xtask witness` passes these and nothing else.
args = ["-n"]
ini = [
    "output_handler=",
    "open_basedir=",
    "disable_functions=",
    "output_buffering=Off",
    "error_reporting=30719",
    "fatal_error_backtraces=Off",
    "display_errors=1",
    "display_startup_errors=1",
    "log_errors=0",
    "html_errors=0",
    "track_errors=0",
    "report_zend_debug=0",
    "docref_root=",
    "docref_ext=.html",
    "error_prepend_string=",
    "error_append_string=",
    "auto_prepend_file=",
    "auto_append_file=",
    "ignore_repeated_errors=0",
    "precision=14",
    "serialize_precision=-1",
    "memory_limit=128M",
    "opcache.fast_shutdown=0",
    "opcache.file_update_protection=0",
    "opcache.revalidate_freq=0",
    "opcache.jit_hot_loop=1",
    "opcache.jit_hot_func=1",
    "opcache.jit_hot_return=1",
    "opcache.jit_hot_side_exit=1",
    "opcache.jit_max_root_traces=100000",
    "opcache.jit_max_side_traces=100000",
    "opcache.jit_max_exit_counters=100000",
    "opcache.protect_memory=1",
    "zend.assertions=1",
    "zend.exception_ignore_args=0",
    "zend.exception_string_param_max_len=15",
    "short_open_tag=0",
    "date.timezone=UTC",
]
# The process environment is cleared and rebuilt from this table, so nothing on
# the developer's shell (`SSH_*`, a `PHPRC`, a locale) reaches the oracle.
# `run-tests.php` deletes the `SSH_*` variables and exports the executable's
# path; the CGI-only variables it sets are the CGI adapter's, not the recipe's.
env_clear = true
[recipe.env]
TEST_PHP_EXECUTABLE = "/opt/homebrew/Cellar/php/8.5.12_1/bin/php"
TZ = "UTC"
LANG = "C"
LC_ALL = "C"
# A child the test spawns without -n or -c searches for a php.ini as php_init_config
# does (main/php_ini.c:409-560 at the tag): PHPRC names a file, so the machine's
# own php.ini (the Homebrew keg's, for the oracle) is never read and both binaries
# answer as upstream's CI, which has none; -n and -c are unaffected (#1176).
PHPRC = "/dev/null"
# The MySQL server of ci/mysql/compose.yaml (#1345): both suites' other defaults (root, an empty
# password, the test database, port 3306) are what the service sets; 127.0.0.1 because
# mysqlnd reads localhost as the unix socket, which the container does not expose.
MYSQL_TEST_HOST = "127.0.0.1"
PDO_MYSQL_TEST_DSN = "mysql:host=127.0.0.1;dbname=test"
# config.inc defaults PDO_MYSQL_TEST_HOST to localhost, which mysqlnd reads as the unix socket the
# container does not expose; upstream's CI names the host beside a TCP DSN (#1928)
PDO_MYSQL_TEST_HOST = "127.0.0.1"
# ext/pdo_mysql/tests/common.phpt hands the redirected ext/pdo tests PDO_MYSQL_TEST_USER once the
# DSN is set, and config.inc defaults pdo_mysql's own tests to root; the redirect is given the
# same user, or ext/pdo's shared tests connect as the empty one and skip (#1392).
PDO_MYSQL_TEST_USER = "root"
# A home and a temporary directory of the run's own, as upstream's runner passes a real HOME
# (#1705, #1927): `{RUN}` is a directory the harness lays down for each run and removes after,
# HOME holding an empty `.php_history`, so `php -a` (sapi/cli/tests/017.phpt) keeps its history
# there and never in the user's home, and TMPDIR is what `sys_get_temp_dir()` answers.
HOME = "{RUN}/home"
TMPDIR = "{RUN}/tmp"

[recipe.limits]
# `run-tests.php:1187`: 60 s per test, 300 under valgrind. A witness's `wall=`
# is disclosure, not a limit.
timeout_s = 60

[recipe.normalise]
# `run-tests.php:2528`: `preg_replace("/\r\n/", "\n", trim($out))`. The trim set
# is PHP's `trim()` default. The scratch directory the snippet ran in is
# replaced by the token below in both streams before comparison, so a witness
# that prints a path is stable across machines; `%s` and the other EXPECTF
# wildcards are the phpt runner's and are translated by the code it owns.
crlf_to_lf = true
trim = " \t\n\r\u0000\u000B"
scratch_token = "%SCRATCH%"
# `php --re`'s first line carries the module's load number, `extension #10`,
# which is the oracle's build order and never the bundle's (#317). The digits
# after `extension #` are replaced by the token below in both streams before
# comparison, so a rendering differs only where the extension does.
extension_number_token = "%N%"

# The compiled tier's regimes (design §8, jit-design §7). The oracle under
# `tracing` is the reference for `TRACE start/stop` dumps and for `force` and
# `exit-fuzz`; under `off` it is the same binary with the tier disabled, the
# control for the A/A drift bound. Both are `-d` overrides added after `ini`.
[regime.jit-tracing]
ini = ["opcache.enable_cli=1", "opcache.jit=tracing", "opcache.jit_buffer_size=64M"]
[regime.jit-off]
ini = ["opcache.enable_cli=1", "opcache.jit=off"]
[regime.jit-inline]
# The trace-dump diff (jit-design §4.1): `TRACE start` (1<<12), `TRACE stop`
# (1<<13), compiled (1<<14), exit (1<<15), abort (1<<16), blacklist (1<<17)
# from `ext/opcache/jit/zend_jit.h:67-72` at the tag; 0x3F000 = 258048. The
# engine's `inline` mode is the synchronous compile so the dump is
# deterministic; php compiles synchronously always.
ini = ["opcache.enable_cli=1", "opcache.jit=tracing", "opcache.jit_buffer_size=64M", "opcache.optimization_level=0", "opcache.jit_debug=258048"]
[regime.jit-force]
# The tier's force lane on the witnesses (jit-design §7): php ignores the engine-only jit.mode.
ini = ["opcache.enable_cli=1", "opcache.jit=tracing", "opcache.jit_buffer_size=64M", "jit.mode=force"]
[regime.jit-exit-fuzz]
# The tier's exit-fuzz lane on the witnesses (jit-design §4.6, §7): php ignores the engine-only jit.mode.
ini = ["opcache.enable_cli=1", "opcache.jit=tracing", "opcache.jit_buffer_size=64M", "jit.mode=exit-fuzz"]
[regime.jit-small-buffer]
# A code buffer that fills: php rounds 16K to the page, and the engine's
# arena holds the same (#3112). The trace-dump bits of jit-inline (jit-design §4.1).
ini = ["opcache.enable_cli=1", "opcache.jit=tracing", "opcache.jit_buffer_size=16K", "opcache.optimization_level=0", "opcache.jit_debug=258048"]
[regime.jit-ssa]
# php's function-level analysis as the tracing JIT builds it, on a trace's
# first pass through an op array (zend_jit_trace_build_ssa,
# ext/opcache/jit/zend_jit_trace.c:567; ADR-0015): jit-inline's TRACE bits
# 0x3F000 plus ZEND_JIT_DEBUG_SSA (1<<1, zend_jit.h:55) = 258050. The
# optimizer is off so php analyses the op arrays the engine executes,
# the compiler's before zend_optimize_script (design §6.1, revision 44).
ini = ["opcache.enable_cli=1", "opcache.jit=tracing", "opcache.jit_buffer_size=64M", "opcache.optimization_level=0", "opcache.jit_debug=258050"]

[regime.short-tags]
# `short_open_tag` is `PHP_INI_SYSTEM|PHP_INI_PERDIR` (`Z/main/main.c:820`), so
# no snippet can turn it on from inside; the recipe pins it off, as upstream's
# `$ini_overwrites` does, and a witness for what `<?` opens with it on names
# this regime (#610).
ini = ["short_open_tag=1"]

[regime.dump]
# design §6.1: php prints its op arrays before the optimizer runs. The
# compile-identity lane passes `-l` beside these, which compiles a file
# without running it, so a corpus file's own bytes never reach the dump.
ini = ["opcache.enable_cli=1", "opcache.opt_debug_level=0x10000"]

[regime.no-assertions]
# `zend.assertions` moves to -1 only at startup (OnUpdateAssertions refuses it
# at runtime), so what php compiles with assertions off, no ASSERT_CHECK and no
# evaluation of the argument, is pinned by a witness that names this regime
# (#864, for #705).
ini = ["zend.assertions=-1"]

[regime.small-stack]
# `zend.max_allowed_stack_size` is `PHP_INI_SYSTEM`, so no snippet can lower it;
# a witness of the engine's stack-limit paths (var_dump's `nesting level too
# deep` first, #1080) names this regime to reach them with a small input.
ini = ["zend.max_allowed_stack_size=256K"]

[regime.phar-writable]
# `phar.readonly` is `PHP_INI_ALL` but refuses to go from on to off at
# runtime, so no snippet can write a phar-format archive under the recipe;
# a witness of phar's writer names this regime (#1107).
ini = ["phar.readonly=0"]

[regime.filter-default]
# `filter.default` is PHP_INI_SYSTEM|PHP_INI_PERDIR, and setting it raises
# php's startup deprecation, which no snippet can reach from inside (#901, for
# #744 and #895).
ini = ["filter.default=int"]

[regime.session-startup]
# ext/session's two startup deprecations: `session.use_only_cookies=0` and
# `session.use_trans_sid=1` are read at startup and warn in `PHP Startup`
# (#901, for #895). The other startup-only session entries change behaviour
# for the whole request and stay held by their phpt tests.
ini = ["session.use_only_cookies=0", "session.use_trans_sid=1"]

[regime.immutable-literals]
# opcache makes a unit's literal arrays immutable, as this engine's units are
# by design (principle 3). A witness that pins GC roots or refcounts over a
# copied literal names this regime, so it agrees exactly. Under the plain
# recipe it differs, and a divergence row covers that (#770, settled on #917).
ini = ["opcache.enable_cli=1"]

[regime.extended-info]
# php's -e (ZEND_COMPILE_EXTENDED_INFO), which no ini setting reaches (#1780)
args = ["-e"]

[regime.ffi-preload]
# opcache.preload is PHP_INI_SYSTEM: a witness of a preloaded caller (#1614) names this regime.
ini = ["opcache.enable=1", "opcache.preload={workspace}/ext/ffi/tests/preload.php"]

[regime.cgi-fix-pathinfo-off]
# php-cgi reads `cgi.fix_pathinfo` from the engine's ini at startup, so a
# php.ini's value changes how it splits SCRIPT_FILENAME and PATH_INFO; a
# request fence witnessing that host reads its ini, not the `-d` list alone,
# names this regime (#1693, settled on #2268).
ini = ["cgi.fix_pathinfo=0"]

[variant.zend-test]
# The pinned tag with the main oracle's configure line plus --enable-zend-test (#1782),
# built by scripts/oracle-build.py (#1889) to the fixed prefix; image is the base
# image's manifest digest the Linux build reproduces from (#1948); closure is the
# digest of the [closure] the macOS build was made against (#2935)
flags = ["--enable-zend-test"]
darwin-arm64 = { path = "/opt/dax-php/oracle/zend-test/bin/php", md5 = "8bf43b8ab6c2e19e23e845d3cf9cc491", closure = "sha256:b0b0b17ba38b0f465dd9bfa37e693fe7f2df30592acbc10c57bfc2f816a175f4" }
linux-x86_64 = { path = "/opt/dax-php/oracle/zend-test/bin/php", md5 = "12f5bd0b1ea2f2f3555640f974e8429a", image = "sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794" }
linux-aarch64 = { path = "/opt/dax-php/oracle/zend-test/bin/php", md5 = "e02dd6c14fc0d045384be0b477b78a5d", image = "sha256:3ad1c71aa6b7e477f7aa91445a5442fbb163742849393b511661a88081c3d7a2" }

[sapi]
# The oracle's other hosts, from the keg and build `[oracle]` pins: parity is
# every test the oracle runs (design §1), and upstream's run-tests.php runs
# sapi/cgi, sapi/fpm and sapi/phpdbg with the binaries it finds beside `php`
# (get_binary, run-tests.php:1003-1019; php-fpm by FPM\Tester::findExecutable,
# sapi/fpm/tests/tester.inc:226-257, at the tag). Each is asserted by its digest
# as `php` is, before the first program that runs it.
cgi = { path = "/opt/homebrew/Cellar/php/8.5.12_1/bin/php-cgi", md5 = "947ff470d102fd1237cecfcd0cf36abd" }
fpm = { path = "/opt/homebrew/Cellar/php/8.5.12_1/sbin/php-fpm", md5 = "35cc9608f3d316dd75e2705446d2ab1e" }
phpdbg = { path = "/opt/homebrew/Cellar/php/8.5.12_1/bin/phpdbg", md5 = "bb005316f2cd8dc5b992d745b96fcb79" }

[fastcgi]
# The HTTP-to-FastCGI mapping `[sapi] fpm` is driven under, so the pinned
# php-fpm is the oracle for what PHP code sees under a host php does not
# ship (research/production-server.r2.md §5.4; Mitchell, 2026-10-09, on
# #2334). Under FPM the web server, not php, fills the CGI variables (RFC 3875
# §4.1): this is nginx's stock conf/fastcgi_params, the mapping most php-fpm
# deployments see, copied verbatim at the release tag below and held to its
# md5, and SCRIPT_FILENAME as nginx sets it in conf/fastcgi.conf at the same
# tag, which is this file with that one parameter first. nginx then passes
# every request header as HTTP_<NAME> (`fastcgi_pass_request_headers on`, its
# default). What crosses the wire is held to the RFCs, not to this oracle: a
# difference there is a `wire:<suite>/<case>` row of the registry. Stage 1's
# RFC 9112 case corpus is sapi/makala's own tests (#2340) and pins nothing
# here; h2spec is pinned beside the oracle at stage 2. Read by
# `oracle::Pin::fastcgi` as one typed value.
nginx = "1.30.5"
source = "https://github.com/nginx/nginx/blob/release-1.30.5/conf/fastcgi_params"
md5 = "4729c30112ca3071f4650479707993ad"
script_filename = "$document_root$fastcgi_script_name"
# The path past the program (Mitchell on #2637, 2026-10-10): nginx's
# documented `fastcgi_split_path_info` with this pattern, so
# $fastcgi_script_name is the path as far as the first `.php` with a `/`
# after it and $fastcgi_path_info the rest, and `PATH_INFO` sent as
# Debian's snippets/fastcgi-php.conf sends it, before the lines of
# fastcgi.conf. `oracle::Pin::fastcgi` reads both.
split_path_info = '^(.+?\.php)(/.*)$'
path_info = "$fastcgi_path_info"
# PATH_TRANSLATED (Mitchell on #2650, 2026-10-11): RFC 3875 §4.1.6's, the
# document root and the path past the program, sent after PATH_INFO and
# only where $fastcgi_path_info is not empty, so a request with no path
# past the program carries none. nginx's one-line `fastcgi_param
# PATH_TRANSLATED $document_root$fastcgi_path_info;` would send the bare
# root on every such request, which the RFC forbids, so this is a key of
# its own and not a line of `params`. php-fpm passes on the value it is
# handed for a program found as named (fpm_main.c, init_request_info).
# `oracle::Pin::fastcgi` reads it.
path_translated = "$document_root$fastcgi_path_info"
params = '''

fastcgi_param  QUERY_STRING       $query_string;
fastcgi_param  REQUEST_METHOD     $request_method;
fastcgi_param  CONTENT_TYPE       $content_type;
fastcgi_param  CONTENT_LENGTH     $content_length;

fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
fastcgi_param  REQUEST_URI        $request_uri;
fastcgi_param  DOCUMENT_URI       $document_uri;
fastcgi_param  DOCUMENT_ROOT      $document_root;
fastcgi_param  SERVER_PROTOCOL    $server_protocol;
fastcgi_param  REQUEST_SCHEME     $scheme;
fastcgi_param  HTTPS              $https if_not_empty;

fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;

fastcgi_param  REMOTE_ADDR        $remote_addr;
fastcgi_param  REMOTE_PORT        $remote_port;
fastcgi_param  SERVER_ADDR        $server_addr;
fastcgi_param  SERVER_PORT        $server_port;
fastcgi_param  SERVER_NAME        $server_name;

# PHP only, required if PHP was built with --enable-force-cgi-redirect
fastcgi_param  REDIRECT_STATUS    200;
'''
