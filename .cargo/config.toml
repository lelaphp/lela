# `cargo xtask <instrument>`: the harness by name from any directory of the
# workspace. The computed regions (harness-design.md §5, §4.3) run it this way.
[alias]
xtask = "run --quiet --package xtask --"

# Every profile passes LLVM's --cgp-max-address-users-to-scan=1000, so
# CodeGenPrepare folds a request field's address into each access of
# `serve_frame`'s loop, `ldr x8, [x19, #C]`, where at LLVM's default of
# 100 users a field the loop reaches more often stays one address the
# register allocator holds or spills (design §10 Profiles; #3372, #3345).
# `cfg(all())` holds for every target, and cargo joins a `--config` line's
# array for the same key to this one, which is how the harness adds a cfg
# (`xtask/src/oracle/profile.rs`, `scripts/ci/tailcall.sh`); a `RUSTFLAGS`
# variable replaces the table instead, and php_engine's build.rs refuses a
# release-like build it leaves without the option.
[target.'cfg(all())']
rustflags = ["-C", "llvm-args=--cgp-max-address-users-to-scan=1000"]

# expect-test finds the file a snapshot lives in from the outermost ancestor
# that has a Cargo.toml, which in a worktree laid under the checkout, as
# `.claude/worktrees/` held them before revision 56, is the clone's root and
# not the worktree's; the variable names the root
# cargo itself was invoked in (`relative = true`), so `UPDATE_EXPECT=1`
# writes the fixture beside the test that failed. A session `xtask track
# work` spawns inherits the clone's value from the cargo that ran the
# harness, so the config's wins (`force = true`).
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true, force = true }

# Every build in the workspace asks php_engine's build.rs to refuse a
# release-like build whose rustflags lack the LLVM option above, where one
# from outside it is warned (design §10 Profiles, #3372); not forced, so
# `PHP_ENGINE_FOLD=warn` builds one unfolded on purpose.
PHP_ENGINE_FOLD = "refuse"

# pcre2-sys finds libpcre2-8 through pkg-config, which on a Mac is
# Homebrew's `pcre2` keg, the library the oracle links (design §7.2, #624,
# #717), and builds the source it bundles, a release of its own, only when
# that misses; ext/pcre's build.rs fails the build on the miss instead.
# The keg's archive is linked, not its dylib: the SDK ships a
# `libpcre2-8.tbd`, and its libxml2 puts `-L /usr/lib` ahead of the keg on
# the link line (#1510), where `-lpcre2-8` would find the SDK's library;
# set, pkg-config's `--static` makes the link the keg's `libpcre2-8.a`,
# held inside pcre2-sys's rlib, whatever the order. A host whose
# libpcre2-8 has no archive links its shared library.
LIBPCRE2_8_STATIC = { value = "1", force = true }

# libsqlite3-sys finds libsqlite3 through pkg-config, which on a Mac finds
# the SDK's library first, where the oracle links Homebrew's `sqlite` keg
# (design §7.2, #624, #1510); named, the directory's `pkgconfig/` is the
# one the crate probes, so the engine links the keg's library, its version
# and its compile options the oracle's. A host without the directory falls
# through to its own pkg-config search. The keg's archive is linked, not
# its dylib: the SDK's libxml2 puts `-L /usr/lib` ahead of the keg on the
# link line, where `-lsqlite3` would find the SDK's library, which has no
# `sqlite3_load_extension`; `SQLITE3_STATIC` makes the link the keg's
# `libsqlite3.a`, held inside libsqlite3-sys's rlib, whatever the order.
SQLITE3_LIB_DIR = { value = "/opt/homebrew/opt/sqlite/lib", force = true }
SQLITE3_STATIC = { value = "1", force = true }

# openssl-sys looks for Homebrew's `openssl@4` before `openssl@3` on an
# Apple silicon Mac and links the first it finds; the oracle, php 8.5.12,
# links `openssl@4`, as the keg's libcurl does (design §7.2, #1108,
# #3381); named for that target alone, the variable binds ext/openssl to
# the major version the oracle has, whatever else the Cellar holds, and
# a Linux host still finds its OpenSSL 3 through pkg-config.
AARCH64_APPLE_DARWIN_OPENSSL_DIR = { value = "/opt/homebrew/opt/openssl@4", force = true }

# curl-sys links whatever `-l curl` finds on an Apple target, the SDK's
# libcurl, where the oracle links Homebrew's keg (design §7.2, #1324);
# named for that target alone, ext/curl's build.rs puts the keg's
# directory ahead of the SDK's and fails the build where it names none
# (#1332), and a Linux host still finds its libcurl through pkg-config.
AARCH64_APPLE_DARWIN_CURL_LIB_DIR = { value = "/opt/homebrew/opt/curl/lib", force = true }

# Unnamed, rustc links for macOS 11.0 on aarch64-apple-darwin, and ld64
# then writes the rebase and bind opcodes of LC_DYLD_INFO_ONLY, which dyld
# applies at launch, so every page of a host's __DATA_CONST is dirty in
# every process; the oracle, php 8.5.12's keg, is linked for macOS 15.0
# with LC_DYLD_CHAINED_FIXUPS, which the kernel applies as each page comes
# in, and its __DATA_CONST stays clean (design §7.2, #3356). Named, it is
# the oracle's `minos` (`otool -l`, LC_BUILD_VERSION), the macOS rustc
# compiles every crate's objects and links every host and test binary
# for, and the one a `cc` build script compiles its C for (lexbor,
# libmbfl, timelib, uriparser, the shims), which it otherwise built for
# the installed SDK's own version; the keg archives linked in,
# libpcre2-8.a, libsqlite3.a and libtidy's, are built for 15.0, so ld no
# longer warns that an object is newer than the link. Cargo hands it to
# every build script, rustc run and `cargo run` or test process, the
# harness's own among them; what the harness runs under the oracle's
# recipe, a witness's or a phpt test's php, starts from the environment
# the recipe clears and states (`oracle.toml`, `[recipe.env]`), so no
# test sees it. Another platform's target reads no such variable.
# `xtask api-check` holds it to the pinned php's minos in each host's
# reading, so it moves with the oracle.
MACOSX_DEPLOYMENT_TARGET = { value = "15.0", force = true }
