# The workspace of a job, before its first cargo step. Every job runs on a
# hosted runner, a fresh machine whose checkout is clean and whose target/
# is empty, so nothing is cleaned here and no earlier run's reading is in
# the store: what is left to lay is the toolchain rust-toolchain.toml
# names, installed where rustup has not yet (rustup 1.28 or later), unless
# the job builds no Rust.
name: workspace
description: Install the pinned toolchain
inputs:
  toolchain:
    description: Whether the job builds Rust, and so installs the pinned toolchain
    default: "true"
runs:
  using: composite
  steps:
    - name: the pinned toolchain
      if: inputs.toolchain == 'true'
      shell: bash
      run: rustup toolchain install
