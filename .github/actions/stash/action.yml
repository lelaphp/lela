# What one job of a run hands a later one: a store, the parity section, the
# phpt runs a job kept. A hand-off is an artifact of the run, put under a
# name by one job and laid down by a later one, and this action is the one
# place a workflow reaches the artifact actions through, so every hand-off
# is named, kept and laid down the same way. GitHub counts artifact storage
# against the account over its billing month, which is why each `put` says
# how long it is kept and none is kept longer than its reader needs. A step
# names `put` or `get`, never both.
name: stash
description: Keep a file or directory for a later job of this run, or lay down what an earlier job kept
inputs:
  put:
    description: The name to keep `path` under
    default: ""
  get:
    description: The names to lay at `path`, separated by spaces; several without `merge` are each laid under `path/<name>`
    default: ""
  path:
    description: What `put` keeps, a file or a directory, or where `get` lays what it got
    required: true
  exclude:
    description: Paths under `path` that `put` leaves out, one a line
    default: ""
  retention-days:
    description: How long `put` keeps it
    default: "7"
  merge:
    description: Whether `get` lays every name at `path` itself
    default: "false"
  optional:
    description: Whether `get` goes on past a name this run kept none of
    default: "false"
runs:
  using: composite
  steps:
    # Each name its own artifact, the excluded paths `!` lines, several
    # names one pattern.
    - name: the artifact's paths and pattern
      id: artifact
      shell: bash
      env:
        GET: ${{ inputs.get }}
        STASHED: ${{ inputs.path }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        {
          echo 'paths<<PATHS'
          echo "$STASHED"
          while IFS= read -r line; do [ -z "$line" ] || echo "!${STASHED%/}/$line"; done <<<"$EXCLUDE"
          echo PATHS
          read -ra names <<<"$GET"
          if [ ${#names[@]} -gt 1 ]; then
            echo "pattern={$(IFS=,; echo "${names[*]}")}"
          else
            echo "pattern=${names[0]:-}"
          fi
        } >> "$GITHUB_OUTPUT"
    - if: inputs.put != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.put }}
        path: ${{ steps.artifact.outputs.paths }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}
    # A pattern downloads nothing where it matches nothing, so `optional`
    # is a pattern even for one name; one name otherwise must be there.
    - if: inputs.get != '' && inputs.optional != 'true' && !contains(inputs.get, ' ')
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.get }}
        path: ${{ inputs.path }}
    - if: inputs.get != '' && (inputs.optional == 'true' || contains(inputs.get, ' '))
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ steps.artifact.outputs.pattern }}
        merge-multiple: ${{ inputs.merge == 'true' || !contains(inputs.get, ' ') }}
        path: ${{ inputs.path }}
