# actionlint's configuration: the custom labels of the two self-hosted
# runners every job runs on (#2253), which actionlint cannot know.
# `self-hosted`, `linux` and `macos` are its own. scripts/ci/runner.sh gives
# each machine its label and scripts/ci/wizard.sh registers it.
self-hosted-runner:
  labels:
    - dax-build # the Hetzner Linux server: build, clippy, tests, the bench
    - dax-oracle # the Mac mini: the pinned php's lanes
