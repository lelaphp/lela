# The lanes that measure main beyond harness.yml's per-commit run. The
# `oracle` job runs beside every harness run of a push to main, nightly and
# by hand; `soak`, `tailcall`, `deny` and `red-nightly` run nightly
# and by hand with `full`. Every job measures main.
# - `oracle`, on a macOS 15 image (Blacksmith's 12-core
#   `blacksmith-12vcpu-macos-15` while the repository is private,
#   GitHub's `macos-15` once it is public), after a push only once the
#   repository is public: the phpt lane and the witnesses
#   need the pinned php, a macOS keg (oracle.toml), poured each job byte
#   for byte from homebrew-core's bottle of the pinned version, beside
#   the MySQL server of ci/mysql/compose.yaml, started from Homebrew since
#   the Mac has no Docker. After a push it runs the per-commit lane and
#   `Zend/tests`; nightly, the whole corpus (`--full`, the nightly lane,
#   which is CI's). It stashes the runs it keeps, which `xtask phpt
#   --against` fetches (#2362);
# - `soak`, on the Linux runner: makala under many clients (#2350);
# - `tailcall`, on a Mac of its own after the oracle job, whose kept
#   targets it is handed: the threaded dispatch's corpus (#2970);
# - `deny`, on the Linux runner: `cargo deny` over the dependency graph,
#   the advisories and crates.io as the only source (#4372);
# - `packages`, on a Mac of its own: the test suites of the Composer
#   packages data/packages.toml pins, under the pinned php and under Lela,
#   beside the services of ci/packages/compose.yaml (lelaphp/lela#32);
# - `red-nightly`: a red `soak`, `tailcall` or `deny` filed on the tracker
#   after two nightlies in a row (#2980).
#
# No bench runs here: every declared bar runs by hand in bench.yml, on a
# hosted runner and as provisional, as Mitchell ruled on 2026-11-19.
#
# This workflow was the dashboard's, whose three other jobs built its site
# from these jobs' stores and put it on Cloudflare. Mitchell ruled the site
# out (Round 4, Q9; Round 5, Q2 (b)), and #4243 took those three jobs out,
# renamed the file and kept the rest, so no job here reads `dashboard/` or
# a Cloudflare secret, and a store stashed below is read by no later job of
# this workflow.
#
# Every job runs on a hosted runner, a fresh machine each job, as
# harness.yml's do. The Linux jobs take theirs from LELA_BUILD_RUNNER:
# unset, GitHub's `ubuntu-26.04`; set, the labels it lists
# (scripts/ci/README.md). The Mac's jobs, `oracle` and `tailcall`, run on
# a macOS 15 image (Blacksmith's 12-core `blacksmith-12vcpu-macos-15` while
# the repository is private, GitHub's `macos-15` once it is public), as
# Mitchell ruled on 2026-11-19, and read no
# variable: .github/actions/oracle-runner lays the tools on each and the
# pinned-php action pours the keg, and nothing one job leaves is the next
# one's but what it stashes.
name: nightly
on:
  workflow_run:
    workflows: [harness]
    types: [requested]
    # A push to any other branch is not main's.
    branches: [main]
  schedule:
    - cron: "23 2 * * *" # the nightly lane
  workflow_dispatch:
    inputs:
      full:
        description: Run the nightly lanes, the whole corpus in the oracle job and the soak
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  oracle:
    name: phpt and witnesses under the pinned oracle
    # After a push, not run while the repository is private, as harness.yml's
    # oracle job is not (Mitchell, 2026-11-19): nightly and by hand it runs
    # either way, since the whole corpus and `tailcall` after it run in CI
    # alone.
    if: ${{ github.event_name != 'workflow_run' || !github.event.repository.private }}
    runs-on: ${{ github.event.repository.private && 'blacksmith-12vcpu-macos-15' || 'macos-15' }}
    # GitHub ends a hosted job at 360 minutes. After a push the trial of
    # 2026-11-17 measured this job's lanes at about 170 on the hosted Mac:
    # the witnesses 94 with the build they start, the control 31, the
    # per-commit lane 27, `Zend/tests` 6 and `tests/` 3. The whole corpus
    # of a night has not run there yet.
    timeout-minutes: 360
    # Every correctness lane of this job runs `release-da`, release's
    # optimisation with debug assertions and overflow checks, without thin
    # LTO or a single codegen unit (harness-design.md §7, revision 82;
    # #1994): the harness, which serves every witness through the engine
    # linked into it and builds a `process` fence's host in its own
    # profile, the engine's binaries below, and the tree's test. So what
    # `cfg(debug_assertions)` guards runs over the whole corpus; the bench
    # lane and the shipped binaries stay plain release, and
    # `xtask/src/oracle/profile.rs` holds each cargo line here to the
    # profile it names. Measured on the dev machine (2026-10-05, M-series,
    # 12 cores shared with other builds): php_compile's 417 witnesses took
    # 19.2 s under the `dev` build `cargo xtask` makes and 4.7 s under
    # `release-da`, at a load average of 30 to 42 (the 324 s this comment
    # cited for one of them before was 7 s by 8ad5b0bd); `Zend/tests` at
    # `--jobs 3` took 67 to 76 s under release and 75 to 90 s under
    # `release-da`, three runs each at a load of 11 to 19, about 1.16x, and
    # the per-commit lane 527 s and 634 s, one run each, about 1.20x; every
    # subset met the same tests under both, before #1980's guard and gate.
    # xtask turns every extension's feature on and the hosts their own, so
    # the two builds share the third-party crates and each compiles the
    # engine's: 2 min 0 s for the hosts and 2 min 12 s for xtask after
    # them at `-j 4`, where release built the hosts in 3 min 31 s.
    # One instrument runs at a time here, so it is given the whole machine:
    # unless XTASK_SEATS is set, xtask divides the cores among three seats
    # (xtask/src/seat.rs), which left the witness and phpt pools a third
    # of the runner.
    env:
      XTASK: cargo run --profile release-da --quiet --package xtask --
      XTASK_SEATS: 1
    # A push's run supersedes the push before it, and only that: the
    # nightly and a run by hand keep a group of their own, since the whole
    # corpus and the control are read nowhere else, and a push in the
    # morning had cancelled four of the last nine nightlies.
    concurrency:
      group: nightly-oracle-${{ github.event_name == 'workflow_run' && 'push' || github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - uses: ./.github/actions/oracle-runner
        with:
          xtask: ${{ env.XTASK }}
      # The pinned php, the install harness.yml's oracle job runs too:
      # poured from homebrew-core's bottle and held to the pin's SHA-256.
      - uses: ./.github/actions/pinned-php
        with:
          xtask: ${{ env.XTASK }}
      # Without the server `xtask phpt` refuses the mysqli and pdo_mysql
      # subsets (#1366), and their readings are refusals (#1612); a server
      # that did not start stops nothing else, since those two failing
      # readings say so.
      - uses: ./.github/actions/mysql
        continue-on-error: true
      # The pinned php-src, as harness.yml takes it, named to the harness;
      # a subset the manifest adds is checked out with no edit here (#1713).
      - name: the corpus the subsets need, named by the harness
        id: corpus
        uses: ./.github/actions/corpus
        with:
          xtask: ${{ env.XTASK }}
          promise: tree oracle
      # The oracle variants, as harness.yml's oracle job lays them (#2298):
      # the control and the lanes run a crate whose row names one under it.
      - uses: ./.github/actions/oracle-variants
        continue-on-error: true
        with:
          xtask: ${{ env.XTASK }}
      - name: the tree is at the pin's commit and holds every test the pin counts
        run: cargo test --profile release-da -p xtask --test oracle a_tree_the_variable_names_
      # The parity section under that tree: its outside list names every
      # unbuilt suite the tree holds, whether or not a reading measured it,
      # and says `"unbuilt_from": "tree"` (#1847, #1853). A section that did
      # not render stops nothing else.
      - name: the parity section, under the pinned tree
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/parity"
          $XTASK status --section parity --format json > "$RUNNER_TEMP/parity/rendering"
          mv "$RUNNER_TEMP/parity/rendering" "$RUNNER_TEMP/parity/parity.json"
      - uses: ./.github/actions/stash
        with:
          put: parity
          path: ${{ runner.temp }}/parity/parity.json
      # The lane runs the engine's own binary, and a test that needs a host
      # the host beside it: `php` for every subset, php-cgi for a
      # CGI-shaped test, php-fpm for sapi/fpm/tests and phpdbg for a
      # `--PHPDBG--` test. Since ADR-0008 each is its host's crate under
      # sapi/, and the harness names each once (xtask/src/oracle/hosts.rs),
      # rendered as `hosts` in the corpus section the corpus step wrote, so
      # the packages built are the ones it names and this file spells none
      # (#1908). A host not built is a skip for every test that needs it
      # (#1904); a rendering that names none stops the step.
      - name: the engine's binaries
        env:
          CORPUS: ${{ steps.corpus.outputs.corpus }}
        run: |
          set --
          for package in $(jq -r '.hosts[].package' "$CORPUS"); do set -- "$@" -p "$package"; done
          [ $# -gt 0 ] || { echo "::error::xtask status --section corpus names no host"; exit 1; }
          echo "the hosts the lane runs tests through: $*"
          cargo build --profile release-da "$@"
      # The targets the engine's readings are held to (#1184, #1733): the
      # control keeps the pinned php's verdicts on each subset it judged
      # whole under the pin, in the directory `xtask status --section
      # corpus` names as `targets`, under target/, and an engine's reading
      # of a subset carries `target`, `met` and `outside` only where one is
      # kept there. A kept target stands until the pin moves
      # (xtask/src/phpt/target.rs), and a hosted runner starts with no
      # target/, so each run's control keeps them afresh before the engine
      # is held to them.
      - run: $XTASK witness || true
      # The lane's subsets under the pinned php itself, before the engine's
      # lane so that its readings are held to the targets this keeps. Each
      # is a `<scope>@control` reading too, which says what php itself
      # skips (#1237). `--control`
      # runs each subset under its own oracle's pinned php, the variant a
      # crate's row names among them, so this file names no php (#1970).
      # php's verdicts move only with the pin, so after a push it runs
      # `--unkept` (#1830): each subset whose kept target stands is said and
      # not run, and one with no target under the pin, or a target that
      # predates a test the subset has now, is run and its target kept,
      # whatever the cache restored. The nightly and a full run by hand run
      # it whole.
      - name: the lane under the pinned php, its control
        env:
          WHOLE: ${{ github.event_name == 'schedule' || inputs.full }}
          TREE: ${{ steps.corpus.outputs.tree }}
        run: |
          set -- --control
          [ "$WHOLE" = true ] || set -- "$@" --unkept
          $XTASK phpt "$@" || true
          $XTASK phpt "$@" --subset Zend/tests || true
          for dir in "$TREE/tests/"*/; do
            $XTASK phpt "$@" --subset "tests/$(basename "$dir")" || true
          done
      - name: the per-commit lane
        run: $XTASK phpt || true
      - run: $XTASK phpt --subset Zend/tests || true
      # Each directory of `tests/` is its own subset, so `tests/lang` and
      # `tests/classes` are readings beside `tests/basic`, not one.
      - name: each directory of tests/
        env:
          TREE: ${{ steps.corpus.outputs.tree }}
        run: |
          for dir in "$TREE/tests/"*/; do
            $XTASK phpt --subset "tests/$(basename "$dir")" || true
          done
      # Through `$XTASK` as every lane above: `cargo xtask` built the
      # harness a second time, in `dev`, for this step alone.
      - name: the whole corpus, the nightly lane
        if: github.event_name == 'schedule' || inputs.full
        run: $XTASK phpt --full || true
      - uses: ./.github/actions/stash
        with:
          put: oracle
          path: target/harness/log/
      # The phpt runs the lanes above kept, each under the tree its
      # engine is built from (xtask/src/phpt/against.rs), stashed apart
      # from the store, so a run CI took on main serves a
      # checkout as its merge base's (#2362): `phpt --against`'s skip names
      # the line that downloads the newest `phpt-runs` and lays it
      # where the comparison looks. A hosted runner starts with no
      # target/, so this holds the trees this run measured, beside the
      # targets its control kept, which the `tailcall` job lays down.
      # Kept a month, where a hand-off is kept a week: the fetch line reads
      # the newest one from outside the run, and a quiet week is no reason
      # for it to find none.
      - uses: ./.github/actions/stash
        with:
          put: phpt-runs
          path: target/harness/phpt-runs/
          retention-days: 30

  soak:
    name: the concurrency soak
    # `xtask soak --nightly` as #2336 rules it (#2350, #2632): nightly, ten minutes, 64
    # clients, over the HTTP-served subset and the workload files of every
    # role but native (#4366), against a build with debug assertions, which arm the request leak sensor: the
    # harness builds makala in the lanes' profile, release-da. It reads the
    # pinned tree and never the oracle, so it is a Linux job, and its
    # reading counts defects rather than timing anything, so while
    # LELA_BUILD_RUNNER is set the hosted image runs it as it runs the other
    # Linux jobs (#2477). A failing reading fails the job; its store is
    # stashed either way, and a red soak is read on the tracker, where
    # `red-nightly` files it.
    if: ${{ github.event_name == 'schedule' || inputs.full }}
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - uses: ./.github/actions/platform-libraries
      - uses: ./.github/actions/corpus
        with:
          promise: tree
      - run: cargo xtask soak --nightly
      - uses: ./.github/actions/stash
        if: always()
        with:
          put: soak
          path: target/harness/log/

  tailcall:
    name: the threaded dispatch's corpus, on its dated nightly
    # The nightly half of the lane that holds `cfg(dispatch = "tailcall")`
    # (#2905), as Mitchell ruled on #2970 (harness-design.md §7, design
    # §5.8): the hosts built under the cfg in release-da on the dated
    # nightly scripts/ci/tailcall.sh pins, in a target directory of their
    # own, and `Zend/tests` and each directory of `tests/` with `--engine`
    # on that build, held to the targets the oracle job kept, which it
    # stashes with its runs and this job lays down. The match loop is what
    # ships; so the store is stashed apart as `tailcall`, and a reading of
    # the threaded build is never one of the shipped engine's.
    # It runs on a Mac, as the shipped engine's subsets do, after the
    # oracle job. A failing subset fails the job once every subset has run,
    # and `red-nightly` files a red nightly of it on the tracker. The
    # hosted Mac builds the harness and the threaded hosts from nothing,
    # which the bounds below leave room for.
    needs: oracle
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.full) }}
    runs-on: ${{ github.event.repository.private && 'blacksmith-12vcpu-macos-15' || 'macos-15' }}
    timeout-minutes: 150
    # One instrument runs at a time here, so it is given the whole machine:
    # unless XTASK_SEATS is set, xtask divides the cores among three seats
    # (xtask/src/seat.rs), which left the witness and phpt pools a third
    # of the runner.
    env:
      XTASK: cargo run --profile release-da --quiet --package xtask --
      XTASK_SEATS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - uses: ./.github/actions/oracle-runner
        with:
          xtask: ${{ env.XTASK }}
      - uses: ./.github/actions/pinned-php
        with:
          xtask: ${{ env.XTASK }}
      - name: the corpus the subsets need, named by the harness
        id: corpus
        uses: ./.github/actions/corpus
        with:
          xtask: ${{ env.XTASK }}
          promise: tree oracle
      # The targets the oracle job's control kept under the pin, with the
      # runs beside them: this job's machine is another one, so they are
      # handed to it. Without them every subset below reads that no target
      # is kept.
      - name: the targets the oracle job kept
        uses: ./.github/actions/stash
        with:
          get: phpt-runs
          path: target/harness/phpt-runs/
      # The step's own timeout is under the job's, so the step after it
      # runs whatever ended the subsets.
      - name: the threaded build's subsets
        timeout-minutes: 130
        env:
          CORPUS: ${{ steps.corpus.outputs.corpus }}
          TREE: ${{ steps.corpus.outputs.tree }}
        run: scripts/ci/tailcall.sh phpt "$CORPUS" "$TREE"
      # The runs `phpt` keeps, put back as they stood before the subsets
      # where a killed step left them set aside, so the `phpt-runs` the
      # next oracle job stashes carries no run of the threaded build.
      - name: the kept runs, as they stood
        if: always()
        run: scripts/ci/tailcall.sh restore
      - uses: ./.github/actions/stash
        if: always()
        with:
          put: tailcall
          path: target/harness/log/

  deny:
    name: the dependency graph's advisories and sources
    # `cargo deny check advisories sources` under deny.toml, as Mitchell
    # ruled on #4348 (ruling 5; #4372): a crate with a RustSec advisory, or
    # one from anywhere but crates.io, fails the job, and `red-nightly`
    # files it. `xtask worktree land` runs the same check where a merge
    # moves Cargo.lock, under main's deny.toml, on the release installed
    # here, which `xtask/src/queue/judge.rs`'s `DENY` names and its test
    # holds this line to: an older one cannot read the database's CVSS 4.0
    # scores. It reads neither the oracle nor the corpus, so while
    # LELA_BUILD_RUNNER is set the hosted image runs it as it runs the other
    # Linux jobs (#2477).
    if: ${{ github.event_name == 'schedule' || inputs.full }}
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check advisories sources

  packages:
    name: the packages lane, Composer packages' suites under the oracle and Lela
    # `xtask packages` (spec lelaphp/lela#32): each package data/packages.toml
    # pins, fetched at its commit and held to its digests, its development
    # dependencies installed from its lock, its suite run once under the
    # pinned php and once under Lela; one reading per package and one of the
    # whole. Its readings bind nothing (R12), so a failing one fails no job
    # and `red-nightly` reads none; the store is stashed either way. It runs
    # on a Mac since the oracle is a macOS keg, as the oracle job does, and
    # the Mac image has no Docker, so the three services ci/packages/
    # compose.yaml declares (R11) are started from Homebrew at the
    # addresses of ci/packages/services.env, the one file that keeps them,
    # which `xtask packages` hands every install and suite. It needs the
    # network for the pinned sources and their development dependencies.
    if: ${{ github.event_name == 'schedule' || inputs.full }}
    runs-on: ${{ github.event.repository.private && 'blacksmith-12vcpu-macos-15' || 'macos-15' }}
    # How long 500 packages take has not been measured yet; a step limit
    # of 30 minutes per install or suite is the instrument's own.
    timeout-minutes: 360
    env:
      XTASK: cargo run --profile release-da --quiet --package xtask --
      XTASK_SEATS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - uses: ./.github/actions/oracle-runner
        with:
          xtask: ${{ env.XTASK }}
      - uses: ./.github/actions/pinned-php
        with:
          xtask: ${{ env.XTASK }}
      # Composer at one release, held to the SHA-256 getcomposer.org
      # publishes for it, and run under the pinned php, which the
      # instrument does; Homebrew's formula would bring a php of its own.
      - name: Composer 2.11.2
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf -o "$RUNNER_TEMP/bin/composer" https://getcomposer.org/download/2.11.2/composer.phar
          echo "dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028  $RUNNER_TEMP/bin/composer" | shasum -a 256 -c
          chmod +x "$RUNNER_TEMP/bin/composer"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The services of ci/packages/compose.yaml, each from Homebrew on a
      # data directory of the job's own and at the address services.env
      # gives it; MySQL as .github/actions/mysql starts it, root with an
      # empty password. A service that does not answer stops the job, since
      # every suite that needs it would read as Lela's miss.
      - name: MySQL, PostgreSQL and Redis at ci/packages/services.env's addresses
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          set -a; . ci/packages/services.env; set +a
          brew install mysql@8.4 postgresql@17 redis
          my="$(brew --prefix mysql@8.4)/bin" pg="$(brew --prefix postgresql@17)/bin"
          rm -rf "$RUNNER_TEMP/mysql" "$RUNNER_TEMP/postgres"
          "$my/mysqld" --no-defaults --initialize-insecure --datadir="$RUNNER_TEMP/mysql"
          nohup "$my/mysqld" --no-defaults --datadir="$RUNNER_TEMP/mysql" --bind-address="$MYSQL_HOST" \
            --port="$MYSQL_PORT" --socket="$RUNNER_TEMP/mysql.sock" --mysqlx=OFF --skip-log-bin \
            > "$RUNNER_TEMP/mysqld.log" 2>&1 &
          "$pg/initdb" -D "$RUNNER_TEMP/postgres" -U "$POSTGRES_USER" --auth=trust > /dev/null
          "$pg/pg_ctl" -D "$RUNNER_TEMP/postgres" -l "$RUNNER_TEMP/postgres.log" \
            -o "-h $POSTGRES_HOST -p $POSTGRES_PORT -k $RUNNER_TEMP" start
          "$(brew --prefix redis)/bin/redis-server" --bind "$REDIS_HOST" --port "$REDIS_PORT" --daemonize yes \
            --logfile "$RUNNER_TEMP/redis.log"
          # compose.yaml's healthchecks: each pinged every 2 s, 60 times.
          answers() {
            "$my/mysqladmin" ping --protocol=tcp -h "$MYSQL_HOST" -P "$MYSQL_PORT" -uroot --silent 2>/dev/null &&
              "$pg/pg_isready" -q -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" &&
              "$(brew --prefix redis)/bin/redis-cli" -h "$REDIS_HOST" -p "$REDIS_PORT" ping > /dev/null 2>&1
          }
          for _ in $(seq 60); do answers && break; sleep 2; done
          answers || { cat "$RUNNER_TEMP"/*.log; echo "::error::a service of ci/packages/compose.yaml did not answer"; exit 1; }
          "$my/mysql" --socket="$RUNNER_TEMP/mysql.sock" -uroot -e "
            CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
            CREATE DATABASE IF NOT EXISTS \`$MYSQL_DATABASE\`;"
          "$pg/psql" -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -q \
            -c "ALTER USER \"$POSTGRES_USER\" PASSWORD '$POSTGRES_PASSWORD'" -c "CREATE DATABASE \"$POSTGRES_DB\""
      - name: Lela's binary
        run: cargo build --profile release-da -p php_sapi_cli
      - name: the packages lane, the whole list
        run: $XTASK packages || true
      - uses: ./.github/actions/stash
        if: always()
        with:
          put: packages
          path: target/harness/log/

  # A red nightly filed (#2980), as harness.yml's `red-main` files a red
  # main (#1156): `soak` and `tailcall` fail no per-commit run, so their
  # verdicts are read on the tracker. For each, two red nightlies in a row
  # file one `ci:red-<job>` ticket; a third comments on it; a green one
  # comments that the job is green again and leaves the ticket for its
  # builder to close through `xtask ticket close`. A run in which the job
  # was skipped (`tailcall` while LELA_BUILD_RUNNER is set) files nothing and
  # is passed over as the nightly before, and a run by hand off another
  # branch is not main's and files nothing. scripts/ci/red.sh says how, and
  # `DRY_RUN=1` prints what it would write. The checkout is this run's own
  # commit, whose workflow named the jobs the script reads back by name.
  red-nightly:
    name: a red nightly, filed
    needs: [soak, tailcall, deny]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.full) }}
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    permissions:
      actions: read
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        job: [soak, tailcall, deny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A filing that fails is the step's warning and never the run's
      # failure, as red-main's is. The job's own result is red where it
      # failed or was cancelled: this job does not run in a cancelled run,
      # so a cancelled job here is one that ran out of its time, a soak that
      # hung among them. A skipped job files nothing.
      - name: two red nightlies in a row, one ticket
        if: ${{ needs[matrix.job].result != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RED: ${{ needs[matrix.job].result != 'success' }}
          JOB: ${{ matrix.job }}
        run: scripts/ci/red.sh nightly "$JOB"
