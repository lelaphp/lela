# The bench on a hosted runner, by hand, as Mitchell ruled on 2026-11-19:
# G4's bars, the engine's and the tier's, and makala's where the machine
# has a php-fpm to set it against, measured on the runner the repository
# variable LELA_BUILD_RUNNER names and offered as provisional, never as a
# number a gate rests on. A hosted runner shares its host: in the trial of
# 2026-11-18 one build read against itself ran up to 5% apart in a row's
# median, and its median for one program moved by 7 to 35% within 22
# minutes, against G1's bound of 2% a row. So `xtask bench --machine
# hosted` measures each bar between two runs of its A/A control, which say
# what the machine did meanwhile, and refuses any label but smoke and
# provisional (docs/perf/measurement-protocol.md §7, §8). A number that
# decides a gate is taken on a machine held for the bench.
#
# One job, since a hosted runner hands nothing to the next:
# - With `baseline` on it first builds php 8.5.12 and its php-fpm from the
#   pinned tag, with the main oracle's configure line, through
#   scripts/oracle-build.py and ci/oracle/Dockerfile. It is a performance
#   baseline and not an oracle: the one-oracle rule is unchanged. The
#   build lands at target/oracle/linux-x86_64/main/, `php` beside
#   `pin.toml`, its table, and `runtime.txt`, the packages whose libraries
#   it links, which the job installs and holds with `ldd` before a bar
#   runs. `g4-code`, `oracle-jit` and `oracle-jit-aa` take that `php` as
#   the pinned one, held to the SHA-256 its `pin.toml` records, and
#   refuse, naming the path and the digest, where it is absent or another.
#   The job's summary carries both binaries' SHA-256 and the tables the pin
#   would carry, which it also keeps; landing them in the pin is a
#   person's, through `xtask steer`.
# - With `baseline` off nothing is built from the tag, and the bars that
#   run the pinned php refuse: the way to measure one bar that needs none
#   of it, named with `bar`.
# - Then, with `bench` on, `xtask bench --machine hosted --label provisional`: every seat
#   held, each bar measured only below a 1-minute load of 2, waited for,
#   its reading naming the load, how long it waited, the machine
#   (processor, cores, kernel) and the reservation `note` gives. A bar
#   file in the repository is measured with `from`, alone and with no
#   control around it.
#
# A bench number is a claim a person signs off beside its A/A control
# (harness §4.2, §11): the job states the measurement, and fails only
# where a bar refused the run (protocol §1).
name: bench
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Build php 8.5.12 and its php-fpm from the pinned tag first
        type: boolean
        default: true
      bench:
        description: Run the bench after the baseline
        type: boolean
        default: true
      bar:
        description: Only this bar, by name, between two runs of its A/A control; empty runs every declared bar
        default: ""
      from:
        description: A bar file in the repository, by its path, in place of the declared bars
        default: ""
      reps:
        description: Measured reps per arm, after the protocol's discarded warm-up
        default: "12"
      note:
        description: The written reservation the provisional label owes
        default: "measured on a hosted runner, which shares its host; each bar stands between two runs of its A/A control"
concurrency:
  group: bench
  cancel-in-progress: false
# bash with pipefail, so a step that tees what it prints fails as it does.
defaults:
  run:
    shell: bash
jobs:
  bench:
    name: the bench, each bar between two runs of its A/A control
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      XTASK: cargo run --release --quiet --package xtask --
      BAR: ${{ inputs.bar }}
      FROM: ${{ inputs.from }}
      REPS: ${{ inputs.reps }}
      NOTE: ${{ inputs.note }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # As harness.yml's instruments' job: a hosted image comes nearly
      # full, and the arms' builds each take a target directory of their
      # own.
      - name: room for target/ on a hosted image
        run: |
          free=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc 0-9)
          echo "$free GiB free"
          if [ "$free" -lt 40 ] && [ -d /opt/hostedtoolcache ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/google-cloud-sdk /opt/az
            df -h "$GITHUB_WORKSPACE"
          fi
      - uses: ./.github/actions/workspace
      # The platform libraries the arms' builds link, from the one list
      # the action reads (design §7.2).
      - uses: ./.github/actions/platform-libraries
      # The pinned php-src, checked out at the tag the harness names; the
      # recipe archives the pinned commit out of it, whatever is sparse.
      - uses: ./.github/actions/corpus
        if: ${{ inputs.baseline }}
        id: corpus
        with:
          promise: tree
      # The build's whole output is the log's: it printed 1405k in one
      # run, and GitHub refuses a step summary over 1024k.
      - name: php 8.5.12 and its php-fpm, from the pinned tag
        if: ${{ inputs.baseline }}
        id: build
        env:
          TREE: ${{ steps.corpus.outputs.tree }}
        run: |
          python3 scripts/oracle-build.py --tree "$TREE" build linux-x86_64 main --jobs "$(nproc)" 2>&1 | tee "$RUNNER_TEMP/baseline.txt"
      # The summary is the two SHA-256 lines and the tables the build wrote; a
      # failed build's is its last lines, cut.
      - name: the SHA-256s and the tables, as the job's summary
        if: ${{ always() && inputs.baseline && steps.build.outcome != 'skipped' }}
        env:
          BUILT: ${{ steps.build.outcome }}
        run: |
          out=target/oracle/linux-x86_64/main
          {
            echo "### php 8.5.12 and its php-fpm, built from the pinned tag"
            echo
            echo '```'
            if [ "$BUILT" = success ]; then
              sha256sum "$out/php" "$out/php-fpm"
              cat "$out/sapi.toml" "$out/pin.toml"
            else
              echo "the build did not pass; its last 40 lines, each cut at 400 bytes, and the job's log carries the rest:"
              tail -n 40 "$RUNNER_TEMP/baseline.txt" 2>/dev/null | cut -c1-400
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the tables the pin would carry, gathered for the stash
        if: ${{ inputs.baseline }}
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          cp target/oracle/linux-x86_64/main/pin.toml \
            target/oracle/linux-x86_64/main/sapi.toml \
            target/oracle/linux-x86_64/main/installed.txt \
            "$RUNNER_TEMP/baseline/"
      # Kept for a person to read, and no later job reads it: the SHA-256s and
      # the tables are in the log and the summary either way, so a refused
      # hand-off fails no job.
      - uses: ./.github/actions/stash
        if: ${{ inputs.baseline }}
        continue-on-error: true
        with:
          put: baseline
          path: ${{ runner.temp }}/baseline/
          retention-days: "90"
      # What the bench takes as the pinned php, said before it runs; the
      # bench holds it to the SHA-256 and refuses the bars that run it where
      # it is absent or another, so this step fails nothing.
      - name: the php built from the pinned tag, as the bench takes it
        run: |
          out=target/oracle/linux-x86_64/main
          sha256sum "$out/php" 2>&1 || true
          cat "$out/pin.toml" 2>&1 || true
      # The libraries that php and its php-fpm link, from the packages the
      # image that built them names, runtime.txt beside them: the image is
      # this runner's release, so its names are the runner's. The baseline
      # is built in that image and run here, and packages.txt lists only
      # what the workspace links. A library `ldd` still cannot find fails
      # the job here, before a bar runs php and refuses on it. Where no
      # php stands, the bars that run it refuse, naming the path.
      - name: the libraries the php built from the pinned tag links
        run: |
          out=target/oracle/linux-x86_64/main
          if [ ! -e "$out/php" ]; then
            echo "no php at $out; the bars that run it refuse the run, naming the path"
            exit 0
          fi
          if [ ! -s "$out/runtime.txt" ]; then
            echo "::error::$out/runtime.txt is absent: the php there was built by a recipe that did not name its runtime packages"
            exit 1
          fi
          mapfile -t packages < <(sed -e '/^$/d' "$out/runtime.txt")
          sudo sh "$GITHUB_WORKSPACE/dist/apt.sh" update
          sudo sh "$GITHUB_WORKSPACE/dist/apt.sh" install "${packages[@]}"
          ldd "$out/php" "$out/php-fpm" | tee "$RUNNER_TEMP/ldd.txt"
          if grep -F 'not found' "$RUNNER_TEMP/ldd.txt"; then
            echo "::error::a library php or php-fpm links is not found on this runner after runtime.txt's packages; the bars that run it would refuse"
            exit 1
          fi
      - name: the bench, on the hosted machine
        if: ${{ inputs.bench }}
        run: |
          ask=(--machine hosted --label provisional --note "$NOTE" --reps "$REPS")
          [ -z "$BAR" ] || ask+=(--bar "$BAR")
          [ -z "$FROM" ] || ask+=(--from "$FROM")
          $XTASK bench "${ask[@]}" | tee "$RUNNER_TEMP/bench.txt"
      - name: the readings, as the job's summary
        if: ${{ always() && inputs.bench }}
        run: |
          # The readings alone, which `xtask bench` prints on stdout, cut at
          # 512 KiB so the summary stays under GitHub's 1024k.
          readings=$RUNNER_TEMP/bench.txt
          limit=524288
          {
            echo "### xtask bench on a hosted runner, provisional: each bar between two runs of its A/A control, below a 1-minute load of 2"
            echo
            echo '```'
            if [ -s "$readings" ]; then
              head -c "$limit" "$readings"
              if [ "$(wc -c <"$readings")" -gt "$limit" ]; then
                echo
                echo "[cut at 512 KiB; the job's log carries every reading]"
              fi
            else
              echo "the bench printed nothing"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # As the baseline's: no job fails on a refused artifact, and no
      # later job reads this one.
      - uses: ./.github/actions/stash
        if: ${{ always() && inputs.bench }}
        continue-on-error: true
        with:
          put: bench
          path: target/harness/log/
          retention-days: "90"
