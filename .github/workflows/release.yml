# A release (spec #9): a person pushes the tag `v<version>` on the commit
# whose workspace manifest carries that version, and this workflow builds
# the release from that commit. The logic is dist/release.py's
# (dist/README.md); this workflow chooses the runners, grants the
# permissions and calls it.
# - `check` holds the tag to the version line of Cargo.toml's
#   `[workspace.package]`, and nothing else runs where it refuses. It
#   then hands on the build matrix `dist/release.py matrix` prints,
#   rendered from the platform table the tarballs, platforms.json and
#   install.sh are read from, so a platform is added to that table and no
#   platform is typed here.
# - `linux` and `darwin` each build the tarball of one platform of their
#   family on a runner of that platform and smoke the tarball there. The
#   runner is chosen here, by the family and the Docker platform the row
#   names: a Linux platform of linux/arm64 on LELA_BUILD_RUNNER_ARM64's
#   runner and any other on LELA_BUILD_RUNNER's, as images.yml's two
#   builds run, and a macOS one on the macOS 15 image the Mac's other jobs
#   run on, with what .github/actions/oracle-runner and pinned-php lay for
#   a build of the hosts there.
# - `images` calls images.yml, the path a commit on `main` publishes by,
#   once every tarball has passed: `github.ref_name` is the tag there, so
#   dist/publish.py pushes `<version>-<variant>`, and the bare variant only
#   for the newest release that is not a pre-release.
# - `release` creates the GitHub Release of the tag, a pre-release when
#   the version is one, and attaches what `dist/release.py publish
#   --dry-run` lists as its artifacts: the tarball of each platform of the
#   table, install.sh, platforms.json, and SHA256SUMS over the others.
# By hand (`workflow_dispatch`, from any branch), it is a dry run of the
# tag its input names: each step prints what it would make, `release` the
# release's fields and the image tags dist/publish.py would push, and
# nothing is built, pushed or created; `images` does not run. No stored
# secret is read: the token is the run's.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to dry-run, v<version>; nothing is built, pushed or created
        type: string
        required: true
permissions: {}
# One run of a tag at a time.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
jobs:
  check:
    name: the tag against the manifest's version
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dist/release.py check "$TAG"
      - name: the platforms, from the table
        id: platforms
        # One line of JSON, which a job reads with fromJSON: each family's
        # matrix, and the table's platforms for the release job's stashes.
        run: |
          matrix=$(dist/release.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  linux:
    name: the ${{ matrix.platform }} tarball
    needs: check
    strategy:
      matrix: ${{ fromJSON(needs.check.outputs.matrix).families.linux }}
    runs-on: ${{ fromJSON(matrix.docker == 'linux/arm64' && (vars.LELA_BUILD_RUNNER_ARM64 || '["ubuntu-26.04-arm"]') || (vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]')) }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # As images.yml's builds do: GitHub's image comes nearly full, and
      # the build's layers need room, so on such an image the toolchains
      # no step here uses are taken away.
      - name: room for the build on a hosted image
        if: ${{ !env.DRY_RUN }}
        run: |
          free=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc 0-9)
          echo "$free GiB free"
          if [ "$free" -lt 40 ] && [ -d /opt/hostedtoolcache ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/google-cloud-sdk /opt/az
            df -h "$GITHUB_WORKSPACE"
          fi
      - name: built and smoked
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is a flag or nothing
          dist/release.py build "$TAG" "$PLATFORM" "$RUNNER_TEMP/release" $DRY_RUN
      - name: the tarball, for the release job
        if: ${{ !env.DRY_RUN }}
        uses: ./.github/actions/stash
        with:
          put: tarball-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/*.tar.gz
          retention-days: 1
  darwin:
    name: the ${{ matrix.platform }} tarball
    needs: check
    strategy:
      matrix: ${{ fromJSON(needs.check.outputs.matrix).families.darwin }}
    runs-on: ${{ github.event.repository.private && 'blacksmith-12vcpu-macos-15' || 'macos-15' }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The toolchain, the tools and the libraries the hosts' build links
      # on a fresh Mac, as the Mac's other jobs lay them before they build.
      - uses: ./.github/actions/workspace
        if: ${{ !env.DRY_RUN }}
      - uses: ./.github/actions/oracle-runner
        if: ${{ !env.DRY_RUN }}
      - uses: ./.github/actions/pinned-php
        if: ${{ !env.DRY_RUN }}
      - name: built and smoked
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is a flag or nothing
          dist/release.py build "$TAG" "$PLATFORM" "$RUNNER_TEMP/release" $DRY_RUN
      - name: the tarball, for the release job
        if: ${{ !env.DRY_RUN }}
        uses: ./.github/actions/stash
        with:
          put: tarball-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/*.tar.gz
          retention-days: 1
  images:
    name: the images
    needs: [linux, darwin]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
  release:
    name: the GitHub Release
    needs: [check, linux, darwin, images]
    # A dry run has no images job; a real run has one that passed.
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.darwin.result == 'success' && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Every tag: the release is the latest only when no release tag names
      # a newer version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: the tarballs, one for each platform of the table
        if: ${{ !env.DRY_RUN }}
        uses: ./.github/actions/stash
        with:
          get: tarball-${{ join(fromJSON(needs.check.outputs.matrix).platforms, ' tarball-') }}
          merge: "true"
          path: ${{ runner.temp }}/release
      - name: created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is a flag or nothing
          dist/release.py publish "$TAG" "$RUNNER_TEMP/release" $DRY_RUN
