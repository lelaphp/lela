# The harness in CI (harness-design.md §7, §10 rule 4): the region files are
# held by `computed check`, which runs no loader and needs no trust grant;
# the harness's own tests hold the map, the hook wiring and the rules'
# negative controls; and per commit the instruments run over the whole
# workspace, then `done` judges the changes since the branch's track, the
# base the Stop hook took; the reading store is the only thing the run
# uploads, and the permits section is the summary. A ticket is closed by
# the session that worked it, through `xtask ticket close`, the instrument
# that reads its acceptance criteria; CI closes none (#290; CONTEXT.md,
# Ticket).
name: harness
on:
  push:
    branches: [main, "t-*"] # main and the track branches, whose base is main
  pull_request:
jobs:
  regions:
    name: computed check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install computed --locked
      - run: computed check AGENTS.md ext/AGENTS.md data/INDEX.md docs/divergence.md
  xtask:
    name: cargo test -p xtask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # reads rust-toolchain.toml; the number is stated there
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p xtask --all-targets -- -D warnings
      # `new-ext` renders ext/AGENTS.md's extensions region with `computed
      # run`, and the test that holds the template topology reads the row
      # it wrote, so the binary is the test's dependency and not only the
      # regions job's (§5).
      - run: cargo install computed --locked
      # The function-hook module (harness-design.md §1 revision 8, §6;
      # #62). Its declarations are a tracked generated file,
      # harness-plugins/types, rewritten at pre-commit by the committer's
      # own Claude Code whenever a path under harness-plugins/ is staged;
      # the build that wrote them is the header line of the committed
      # file, `// Written by Claude Code <version>.`, which `cargo test -p
      # xtask --test map` reads, so no Claude Code is installed here and
      # no pin is stated here. `tsc` holds the module to the committed
      # file; `plugin validate --strict` ran at the same pre-commit. The
      # wall-clock, measured on the dev machine (2026-09-10, M-series,
      # warm npm cache): `tsc` 0.9 s; the runner's figure, with a cold npm
      # cache, is read off the first run.
      - run: npx -y -p typescript@5.9.3 tsc -p harness-plugins
      # The pinned php-src (#37): the tree the tests that resolve a subset
      # of the real corpus read, found where the variable
      # `oracle::TREE_VARIABLE` names first and at the pin's path second
      # (#36). The name is stated in the harness alone: the step below
      # reads it off `xtask status --section oracle`, whose JSON carries
      # the two variables by name, and sets the tree under it through
      # `$GITHUB_ENV`, so this file spells neither name. The tag and the
      # commit are the pin's, read off `oracle.toml` by a parse and never
      # copied here, so a person's bump moves the checkout and the cache
      # key with it. The checkout is sparse and shallow: one commit at the
      # tag, and of the tree only `Zend/tests`, `tests`, `sapi/cli/tests`
      # and every `ext/*/tests`, the directories a `[[crate]]` row can
      # own, stated once in `CORPUS_DIRS`; cached by the pinned commit and
      # a digest of that list, so a second run restores it rather than
      # cloning again and a narrower list never restores a wider tree's
      # cache, or the reverse. What holds the tree to `[source].commit`
      # is `Source::tree()`, which refuses a checkout at another commit
      # naming both revisions; the one-test step fails the job there,
      # before the suite, and the suite reads the same tree. The promise
      # (#38): `oracle::PROMISE_VARIABLE`, read off the same section and
      # set beside the tree's variable, lists what of the pin this
      # runner has, so a test
      # that would skip for an absent tree fails instead naming both
      # places it looked; a provisioning step that breaks turns the job
      # red rather than measuring less in silence. The tree alone is
      # promised: the pinned php is a macOS keg (oracle.toml) that this
      # ubuntu runner cannot have, so the tests that spawn it skip here
      # until the pin names a binary the runner can have, which is a
      # person's.
      # The wall-clock, measured on the dev machine (2026-09-10, M-series,
      # residential link): the shallow clone 9.6 s and the sparse checkout
      # 2.4 s, 132 MB in the tree and 31 MB under `.git`, 21414 `.phpt`
      # files; with `--filter=blob:none` the clone is 1.0 s and the
      # checkout 13.3 s, so the plain shallow clone is the one taken. The
      # runner's figures, cold and from cache, are read off the first two
      # runs.
      - name: the pin's tag and commit, and the sparse set's digest
        id: pin
        env:
          CORPUS_DIRS: /Zend/tests/ /tests/ /sapi/cli/tests/ /ext/*/tests/
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import hashlib, os, tomllib
          with open("oracle.toml", "rb") as pin:
              source = tomllib.load(pin)["source"]
          dirs = hashlib.sha256(os.environ["CORPUS_DIRS"].encode()).hexdigest()[:12]
          print(f"tag={source['tag']}\ncommit={source['commit']}\ndirs={dirs}")
          EOF
      - name: the pinned php-src, from the cache
        id: corpus
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/php-src
          key: php-src-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.dirs }}
      - name: the pinned php-src, checked out sparse and shallow at the tag
        if: steps.corpus.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.pin.outputs.tag }}
          CORPUS_DIRS: /Zend/tests/ /tests/ /sapi/cli/tests/ /ext/*/tests/
        run: |
          set -f # the patterns are git's, not the shell's
          git clone --quiet --no-checkout --depth 1 --branch "$TAG" https://github.com/php/php-src.git "$RUNNER_TEMP/php-src"
          git -C "$RUNNER_TEMP/php-src" sparse-checkout set --no-cone $CORPUS_DIRS
          git -C "$RUNNER_TEMP/php-src" checkout --quiet
      - name: the tree's variable and the promise's, named by the harness and set for the steps below
        run: |
          cargo xtask status --section oracle --format json > "$RUNNER_TEMP/oracle.json"
          tree=$(jq -r .tree.variable "$RUNNER_TEMP/oracle.json")
          promise=$(jq -r .promise.variable "$RUNNER_TEMP/oracle.json")
          echo "$tree=$RUNNER_TEMP/php-src" >> "$GITHUB_ENV"
          echo "$promise=tree" >> "$GITHUB_ENV"
      - name: the tree is at the pin's commit
        run: cargo test -p xtask --test oracle a_tree_the_variable_names_is_at_the_pin
      - run: cargo test -p xtask
  per-commit:
    name: the instruments, then done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # done measures since the merge base with the track
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each instrument exits 1 on a failing reading, which fails the job;
      # the readings it wrote are uploaded either way.
      - run: cargo fmt --check
      - run: cargo xtask clippy
      # The crate's own tests as the reading `done`'s condition 1 asks
      # every touched crate for (#191): the workspace here, the touched
      # crates at pre-commit. The harness's own run a second time, after
      # the test job's, since that job promises the corpus and this one
      # writes the reading.
      - run: cargo xtask test
      - run: cargo xtask api-check
      - run: cargo xtask budget
      - run: cargo xtask unsafe-audit
      - run: cargo xtask vocab
      # The census joined to `api.lock`, per commit (§7): the inherited
      # tree is outside this repository and outside CI, so the run joins
      # the committed census and the regeneration is a maintainer's, under
      # `--tree`. The unmatched rows are the failure; the unresolved rows
      # are the number the weekly bars read.
      - run: cargo xtask port-map
      # The witness reading `done`'s condition 1 asks every touched crate
      # for (§4.5, §7: witnesses run per commit over all crates). A kernel
      # or native without a witness fails here and names the coverage
      # rule's text. The pinned php is not on this runner, so a crate with
      # nothing to run reads `skip`, not `pass` (#60), and `done` lists it
      # unmet for a touched crate until the oracle is at the pin's path
      # here; the pin is a person's. `phpt` stays out until a crate's
      # subset has a home (#18).
      - run: cargo xtask witness
      # A push is judged since the branch's track, which `done` reads off
      # the branch it stands on. A pull request's checkout is a detached
      # merge commit, on no branch and so on no track, so the base is the
      # ref the pull request targets, which is the track the Stop hook
      # took (§4.5).
      - name: done
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            cargo xtask done --base "$GITHUB_BASE_REF"
          else
            cargo xtask done
          fi
      - name: the summary
        if: always()
        run: |
          cargo xtask status --section permits > permits.md
          cat permits.md
          cat permits.md >> "$GITHUB_STEP_SUMMARY"
      - name: the reading store, the only upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness
          path: target/harness
          if-no-files-found: warn
