# The harness in CI (harness-design.md §7, §10 rule 4): the region files are
# held by `computed check`, which runs no loader and needs no trust grant;
# the harness's own tests hold the map, the hook wiring and the rules'
# negative controls; and per commit the instruments run over the whole
# workspace, then `done` judges the changes since the branch's track, the
# base the Stop hook took; the reading store is the only thing the run
# uploads, and the permits section is the summary.
name: harness
on:
  push:
    branches: [main, "t-*"] # main and the track branches, whose base is main
  pull_request:
jobs:
  regions:
    name: computed check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install computed --locked
      - run: computed check AGENTS.md ext/AGENTS.md data/INDEX.md docs/divergence.md
  xtask:
    name: cargo test -p xtask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # reads rust-toolchain.toml; the number is stated there
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p xtask --all-targets -- -D warnings
      # `new-ext` renders ext/AGENTS.md's extensions region with `computed
      # run`, and the test that holds the template topology reads the row
      # it wrote, so the binary is the test's dependency and not only the
      # regions job's (§5).
      - run: cargo install computed --locked
      - run: cargo test -p xtask
  per-commit:
    name: the instruments, then done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # done measures since the merge base with the track
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each instrument exits 1 on a failing reading, which fails the job;
      # the readings it wrote are uploaded either way.
      - run: cargo fmt --check
      - run: cargo xtask clippy
      - run: cargo xtask api-check
      - run: cargo xtask budget
      - run: cargo xtask unsafe-audit
      - run: cargo xtask vocab
      # A push is judged since the branch's track, which `done` reads off
      # the branch it stands on. A pull request's checkout is a detached
      # merge commit, on no branch and so on no track, so the base is the
      # ref the pull request targets, which is the track the Stop hook
      # took (§4.5).
      - name: done
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            cargo xtask done --base "$GITHUB_BASE_REF"
          else
            cargo xtask done
          fi
      - name: the summary
        if: always()
        run: |
          cargo xtask status --section permits > permits.md
          cat permits.md
          cat permits.md >> "$GITHUB_STEP_SUMMARY"
      - name: the reading store, the only upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness
          path: target/harness
          if-no-files-found: warn
