# The harness in CI (harness-design.md §7, §10 rule 4): the region files are
# held by `computed check`, which runs no loader and needs no trust grant;
# the harness's own tests hold the map, the hook wiring and the rules'
# negative controls; and per commit the instruments run over the whole
# workspace, then `done` judges the changes since the merge base with
# `main`, the base the Stop hook took; the reading store is the only thing the run
# uploads, and the permits section is the summary. A ticket is closed by
# the session that worked it, through `xtask ticket close`, the instrument
# that reads its acceptance criteria; CI closes none (#290; CONTEXT.md,
# Ticket).
name: harness
on:
  push:
    branches: [main] # a ticket's branch reaches CI as a pull request (ADR-0009)
  pull_request:
# A push to a pull request supersedes the run of the push before it, which
# is cancelled: a run nobody reads is minutes billed. `main`'s runs queue
# and finish.
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  regions:
    name: computed check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install computed --locked
      - run: computed check AGENTS.md ext/AGENTS.md data/INDEX.md docs/divergence.md harness-design.md
  per-commit:
    name: the instruments, then done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # done measures since the merge base with main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The platform libraries the workspace links, from the one list the
      # action reads (design §7.2; #1300).
      - uses: ./.github/actions/platform-libraries
      # The named locales a request's setlocale() asks the C library for
      # (design §5.14, revision 40; #1150), in the tests and the witnesses
      # alike: de_DE for ext/standard's two-request test, and the names
      # the witnesses under ext/ pin. ubuntu-latest generates none of
      # them. `locale-gen` builds the ones glibc lists as supported, the
      # ISO-8859 ones under their bare names, from the `locales` package
      # the image carries, with no download (13 s for the seven in an
      # ubuntu:24.04 container, 2026-09-28); `locales-all` is an
      # `apt-get update` and every locale glibc has, and still lacks
      # ja_JP.SJIS, which glibc lists as unsupported since Shift_JIS is
      # not ASCII-compatible and which `localedef -c` builds all the same.
      # `update-locale` is left out: it sets the system's default LANG,
      # which nothing here reads. A name that fails to build fails the
      # step, so no test here reads an absent locale as its skip.
      - name: the named locales the tests and the witnesses ask for
        run: |
          sudo locale-gen de_DE de_DE.UTF-8 fr_FR fr_FR.UTF-8 tr_TR is_IS is_IS.UTF-8
          sudo localedef -c --no-warnings=ascii -i ja_JP -f SHIFT_JIS ja_JP.SJIS
      # The MySQL server the witnesses marked `mysql` and the mysqli and
      # pdo_mysql suites run against, started here as on the pin machine,
      # as Mitchell ruled on #1345: `--wait` returns once its healthcheck
      # passes, and a witness or a subset that needs it is refused, not
      # skipped, where it does not answer (#1366).
      - name: the MySQL server of ci/mysql/compose.yaml
        run: docker compose -f ci/mysql/compose.yaml up -d --wait
      # Each instrument exits 1 on a failing reading, which fails the job;
      # the readings it wrote are uploaded either way.
      - run: cargo fmt --check
      - run: cargo xtask clippy
      # `new-ext` renders ext/AGENTS.md's extensions region with `computed
      # run`, and the test that holds the template topology reads the row
      # it wrote, so the binary is the test's dependency and not only the
      # regions job's (§5).
      - run: cargo install computed --locked
      # The function-hook module (harness-design.md §1 revision 8, §6;
      # #62). Its declarations are a tracked generated file,
      # harness-plugins/types, rewritten at pre-commit by the committer's
      # own Claude Code whenever a path under harness-plugins/ is staged;
      # the build that wrote them is the header line of the committed
      # file, `// Written by Claude Code <version>.`, which `cargo test -p
      # xtask --test map` reads, so no Claude Code is installed here and
      # no pin is stated here. `tsc` holds the module to the committed
      # file; `plugin validate --strict` ran at the same pre-commit. The
      # wall-clock, measured on the dev machine (2026-09-10, M-series,
      # warm npm cache): `tsc` 0.9 s; the runner's figure, with a cold npm
      # cache, is read off the first run.
      - run: npx -y -p typescript@5.9.3 tsc -p harness-plugins
      # The pinned php-src (#37): the tree the tests that resolve a subset
      # of the real corpus read, found where the variable
      # `oracle::TREE_VARIABLE` names first and at the pin's path second
      # (#36). The name is stated in the harness alone: the step below
      # reads it off `xtask status --section oracle`, whose JSON carries
      # the two variables by name, and sets the tree under it through
      # `$GITHUB_ENV`, so this file spells neither name. What is checked
      # out is `xtask status --section corpus`'s (#1713): the pin's tag,
      # the sparse patterns of the corpus's roots, the table the nightly
      # lane walks and every `[[crate]]` row's subset stands under, and
      # the cache key, the pinned commit and a digest of the patterns. So
      # a person's bump moves the checkout and the key with it, a subset
      # the manifest adds is checked out without an edit here, and a
      # changed set of patterns never restores another set's tree. The
      # checkout is sparse and shallow: one commit at the tag, the
      # patterns handed to git on stdin. What holds the tree to the pin
      # is two tests: `Source::tree()` refuses a checkout at another
      # commit naming both revisions, and the tree must hold every `.phpt`
      # `[source].phpt_files` counts, so a checkout narrower than the
      # corpus names both numbers; the one step running both fails the
      # job there, before the suite, and the suite reads the same tree.
      # The promise (#38): `oracle::PROMISE_VARIABLE`, read off the same
      # section and set beside the tree's variable, lists what of the pin
      # this runner has, so a test
      # that would skip for an absent tree fails instead naming both
      # places it looked; a provisioning step that breaks turns the job
      # red rather than measuring less in silence. The tree alone is
      # promised: the pinned php is a macOS keg (oracle.toml) that this
      # ubuntu runner cannot have, so the tests that spawn it skip here
      # until the pin names a binary the runner can have, which is a
      # person's.
      # The wall-clock, measured on the dev machine (2026-09-10, M-series,
      # residential link), for the narrower set before #1713: the shallow
      # clone 9.6 s and the sparse checkout 2.4 s, 132 MB in the tree and
      # 31 MB under `.git`, 21414 `.phpt` files; with `--filter=blob:none`
      # the clone is 1.0 s and the checkout 13.3 s, so the plain shallow
      # clone is the one taken. The roots `xtask status --section corpus`
      # names hold every `.phpt` the pin counts; the runner's figures for
      # them, cold and from cache, are read off the first two runs.
      - name: the corpus the subsets need, named by the harness
        id: pin
        run: |
          cargo xtask status --section corpus --format json > "$RUNNER_TEMP/corpus.json"
          jq -r '"tag=\(.tag)", "key=\(.key)"' "$RUNNER_TEMP/corpus.json" >> "$GITHUB_OUTPUT"
      - name: the pinned php-src, from the cache
        id: corpus
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/php-src
          key: ${{ runner.os }}-${{ steps.pin.outputs.key }}
      - name: the pinned php-src, checked out sparse and shallow at the tag
        if: steps.corpus.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          git clone --quiet --no-checkout --depth 1 --branch "$TAG" https://github.com/php/php-src.git "$RUNNER_TEMP/php-src"
          jq -r '.patterns[]' "$RUNNER_TEMP/corpus.json" | git -C "$RUNNER_TEMP/php-src" sparse-checkout set --no-cone --stdin
          git -C "$RUNNER_TEMP/php-src" checkout --quiet
      - name: the tree's variable and the promise's, named by the harness and set for the steps below
        run: |
          cargo xtask status --section oracle --format json > "$RUNNER_TEMP/oracle.json"
          tree=$(jq -r .tree.variable "$RUNNER_TEMP/oracle.json")
          promise=$(jq -r .promise.variable "$RUNNER_TEMP/oracle.json")
          echo "$tree=$RUNNER_TEMP/php-src" >> "$GITHUB_ENV"
          echo "$promise=tree" >> "$GITHUB_ENV"
      - name: the tree is at the pin's commit and holds every test the pin counts
        run: cargo test -p xtask --test oracle a_tree_the_variable_names_
      # The crate's own tests as the reading `done`'s condition 1 asks
      # every touched crate for (#191): the workspace here, the touched
      # crates at pre-commit. The harness's own tests run here once, under
      # the corpus promised above, and are the reading; they ran a second
      # time in a job of their own before, which cost a runner the whole
      # suite per push for nothing `done` reads, and `cargo xtask clippy`
      # above already holds xtask to every warning.
      - run: cargo xtask test
      - run: cargo xtask api-check
      - run: cargo xtask budget
      - run: cargo xtask unsafe-audit
      - run: cargo xtask vocab
      # The census joined to `api.lock`, per commit (§7): the inherited
      # tree is outside this repository and outside CI, so the run joins
      # the committed census and the regeneration is a maintainer's, under
      # `--tree`. The unmatched rows are the failure; the unresolved rows
      # are the number the weekly bars read.
      - run: cargo xtask port-map
      # The witness reading `done`'s condition 1 asks every touched crate
      # for (§4.5, §7: witnesses run per commit over all crates). A kernel
      # or native without a witness fails here and names the coverage
      # rule's text. The pinned php is not on this runner, so a crate with
      # nothing to run reads `skip`, not `pass` (#60), and `done` lists it
      # unmet for a touched crate until the oracle is at the pin's path
      # here; the pin is a person's. `phpt` stays out until a crate's
      # subset has a home (#18).
      - run: cargo xtask witness
      # The rendering diff `done`'s condition 1 asks an extension the
      # binary carries for (§4.5, §7: per commit over every extension the
      # `php` binary carries, revision 63). A red row is an extension not
      # yet ported and `done` holds a touched one to it, so the step writes
      # the readings and fails the job for nothing; without the pinned php
      # here it reads `skip` as `witness` does, until the oracle is at the
      # pin's path.
      - run: cargo xtask crosscheck
        continue-on-error: true
      # A push to `main` is judged since the merge base with `main`, the
      # base `done` takes by default (§4.5, ADR-0009). A pull request's
      # checkout is a detached merge commit, so the base is the ref the
      # pull request targets.
      - name: done
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            cargo xtask done --base "$GITHUB_BASE_REF"
          else
            cargo xtask done
          fi
      - name: the summary
        if: always()
        run: |
          cargo xtask status --section permits --uncut > permits.md
          cat permits.md
          cat permits.md >> "$GITHUB_STEP_SUMMARY"
      - name: the reading store, the only upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness
          path: target/harness
          if-no-files-found: warn
