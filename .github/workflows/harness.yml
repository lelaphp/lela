# The harness in CI (harness-design.md §7, §10 rule 4): the region files are
# held by `computed check`, which runs no loader and needs no trust grant;
# the harness's own tests hold the map, the hook wiring and the rules'
# negative controls; and per commit the instruments run over the whole
# workspace. It runs on a push to `main` alone and runs no `done`: what a
# push carries was judged at pre-push and by `land`, whose judges are
# main's tip's (Round 1, Q21; harness-design.md §4.5); a pull request
# runs nothing here, as Mitchell ruled on #4348 (ruling 5; #4372).
# The reading store is the only thing the run keeps, and the permits
# section is the summary. A ticket is closed by
# the session that worked it, through `xtask ticket close`, the instrument
# that reads its acceptance criteria; CI closes none (#290; CONTEXT.md,
# Ticket). A red main is filed, once, by the last job (#1156).
#
# Every job runs on a hosted runner, a fresh machine each job, as Mitchell
# ruled on 2026-11-17 and 2026-11-19: no machine of the project's own runs
# a job. The Linux jobs, the build, clippy, the tests and the rest of the
# instruments, take their runner from the repository variable
# LELA_BUILD_RUNNER, a JSON list of labels, and with the variable unset
# that is GitHub's `ubuntu-26.04` (scripts/ci/README.md). The `oracle`
# job runs on a macOS 15 image (Blacksmith's 12-core
# `blacksmith-12vcpu-macos-15` while the repository is private, GitHub's
# `macos-15` once it is public) and reads no variable: the
# witnesses, the crosscheck and the tests that spawn the oracle need the
# pinned php, a macOS keg (oracle.toml), which the job pours after
# .github/actions/oracle-runner has laid what a fresh Mac lacks. The
# stores meet in the `store` job, handed to it as artifacts of the run
# through .github/actions/stash.
# `bench` is no job here: it is run by hand in bench.yml, on the runner the
# variable names, as a hosted machine's and so as provisional, each bar
# between two runs of its A/A control, as Mitchell ruled on 2026-11-19. A
# hosted reading taken any other way is noise a person could mistake for a
# measurement, which is why `xtask bench` refuses a GitHub-hosted runner
# asked as anything but `--machine hosted`, whatever job runs it.
name: harness
on:
  push:
    branches: [main] # a ticket's branch is judged at pre-push and by `land` (#4372)
# A run of `main` is never cancelled once it runs; of the runs waiting
# behind it, GitHub keeps the newest and cancels the rest.
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regions:
    name: computed check
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - run: cargo install computed --locked
      - run: computed check AGENTS.md ext/AGENTS.md data/INDEX.md docs/divergence.md docs/perf/measurement-protocol.md harness-design.md third-engine-design.md
  per-commit:
    name: the instruments
    # Ubuntu 26.04 for libtidy 5.8, the oracle's (#1724): the release
    # packages.txt names, and so the one a runner LELA_BUILD_RUNNER names
    # carries (scripts/ci/README.md).
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A hosted runner's image comes nearly full: GitHub's had 14 GiB free
      # in the trial of 2026-11-17, and this job's target/ grows to 20, so
      # the tests alone stopped there at 1 GiB. Where under 40 are free on
      # such an image, the toolchains it carries and no step here uses are
      # taken away, which left 49. GitHub's image is known by its tool
      # cache, so another provider's image is left as it comes.
      - name: room for target/ on a hosted image
        run: |
          free=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc 0-9)
          echo "$free GiB free"
          if [ "$free" -lt 40 ] && [ -d /opt/hostedtoolcache ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/google-cloud-sdk /opt/az
            df -h "$GITHUB_WORKSPACE"
          fi
      - uses: ./.github/actions/workspace
      # The platform libraries the workspace links, from the one list the
      # action reads (design §7.2; #1300).
      - uses: ./.github/actions/platform-libraries
      # The named locales a request's setlocale() asks the C library for
      # (design §5.14, revision 40; #1150): de_DE for ext/standard's
      # two-request test, and the names the witnesses under ext/ pin, so a
      # test that reads one finds it here as the witnesses do on the oracle
      # runner, whose macOS carries every one. Ubuntu 26.04 generates none
      # of them, and a hosted runner's user runs these two commands as
      # root. `locale-gen` builds the ones glibc lists as supported, the
      # ISO-8859 ones under their bare names, from the `locales` package
      # the image carries, with no download (3 s for the seven and
      # ja_JP.SJIS in an ubuntu:26.04 container, 2026-10-04);
      # `locales-all` is an `apt-get update` and every locale glibc has,
      # and still lacks ja_JP.SJIS, which glibc lists as unsupported since
      # Shift_JIS is not ASCII-compatible and which `localedef -c` builds
      # all the same.
      # `update-locale` is left out: it sets the system's default LANG,
      # which nothing here reads. A name that fails to build fails the
      # step, and the corpus step below promises the locales, so a test
      # that finds one absent fails rather than skip (#3180).
      - name: the named locales the tests ask for
        run: |
          sudo locale-gen de_DE de_DE.UTF-8 fr_FR fr_FR.UTF-8 tr_TR is_IS is_IS.UTF-8
          sudo localedef -c --no-warnings=ascii -i ja_JP -f SHIFT_JIS ja_JP.SJIS
      # The MySQL server the mysqli and pdo_mysql tests run against, as
      # Mitchell ruled on #1345, fresh for this job.
      - uses: ./.github/actions/mysql
      # Each instrument exits 1 on a failing reading, which fails the job;
      # the readings it wrote are stashed either way.
      - run: cargo fmt --check
      - run: cargo xtask clippy
      # `new-ext` renders ext/AGENTS.md's extensions region with `computed
      # run`, and the test that holds the template topology reads the row
      # it wrote, so the binary is the test's dependency and not only the
      # regions job's (§5).
      - run: cargo install computed --locked
      # The function-hook module (harness-design.md §1 revision 8, §6).
      # Its declarations are a file Claude Code writes, Claude Code's and
      # not this project's, so the repository does not carry them. They
      # are written at pre-commit by the committer's own Claude Code
      # whenever a path under harness-plugins/ is staged, and `tsc`,
      # `plugin validate --strict` and `plugin test` hold the modules to
      # them there. No Claude Code is installed here, so nothing here
      # type-checks the modules.
      # The pinned php-src (#37): the tree the tests that resolve a subset
      # of the real corpus read, named to the harness by its variable, with
      # the tree promised and not the binary: the pinned php is a macOS keg
      # this runner cannot have, so the tests that spawn it skip here and
      # run in the oracle job below. The one step running the tree's two
      # tests fails the job there, before the suite, and the suite reads
      # the same tree. The MySQL server started above is promised too, so
      # a mysqli or pdo_mysql test that finds none fails here (#3084), and
      # so are the locales generated above (#3180).
      - uses: ./.github/actions/corpus
        with:
          promise: tree mysql locale
      - name: the tree is at the pin's commit and holds every test the pin counts
        run: cargo test -p xtask --test oracle a_tree_the_variable_names_
      # The crate's own tests as the reading `done`'s condition 1 asks
      # every touched crate for (#191): the workspace here, the touched
      # crates at pre-commit. The harness's own tests run here once, under
      # the corpus promised above, and are the reading; they ran a second
      # time in a job of their own before, which cost a runner the whole
      # suite per push for nothing `done` reads, and `cargo xtask clippy`
      # above already holds xtask to every warning.
      - run: cargo xtask test
      # The export's tool (#4597); the folder is left out of the export, so the step runs only where it is.
      - name: the export tool's tests
        run: '[ ! -d scripts/export ] || python3 -I -B -m unittest discover -s scripts/export -p "test_*.py"'
      # dist/'s tests (#44): the publish, the release, the bundle and the
      # installer, which nothing ran before a runner met them. shellcheck
      # is installed first, since the lint of install.sh is skipped where
      # it is absent, and -v names each test the runner skips with its
      # reason (#73).
      - name: shellcheck, for the lint of install.sh
        run: sudo sh "$GITHUB_WORKSPACE/dist/apt.sh" install shellcheck
      - name: dist's tests
        run: python3 -I -B -m unittest discover -v -s dist -p "test_*.py"
      - run: cargo xtask api-check
      - run: cargo xtask budget
      - run: cargo xtask unsafe-audit
      - run: cargo xtask vocab
      # The census joined to `api.lock`, per commit (§7): the inherited
      # tree is outside this repository and outside CI, so the run joins
      # the committed census and the regeneration is a maintainer's, under
      # `--tree`. The unmatched rows are the failure; the unresolved rows
      # are the number the weekly bars read.
      - run: cargo xtask port-map
      - name: this job's readings
        if: always()
        uses: ./.github/actions/stash
        with:
          put: store-build
          path: target/harness
          retention-days: 1 # read by the store job, minutes later

  miri:
    name: Miri on php_heap
    # Design §9's Miri on `php_heap`'s tests per commit (harness §7, #1916):
    # `xtask miri` on the nightly `xtask::miri::TOOLCHAIN` names, which
    # rustup installs here with its `miri` component where the runner has
    # not yet, and the cargo-nextest `xtask::miri::NEXTEST` names, which
    # runs each test in a Miri process of its own (#4117) and which
    # `cargo install` leaves as it is where that release is installed;
    # `xtask/tests/miri.rs` holds both lines to the constants. The
    # negative control runs here too, since the build job has no nightly
    # and its copy of the test returns on the skip.
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - run: rustup toolchain install nightly-2026-02-20 --profile minimal --component miri,rust-src
      - run: cargo install --locked cargo-nextest@0.9.127
      - run: cargo xtask miri
      - run: cargo test -p xtask --test miri
      - name: this job's readings
        if: always()
        uses: ./.github/actions/stash
        with:
          put: store-miri
          path: target/harness
          # The phpt runs the workspace keeps are the build job's to hand
          # on: this job takes none, and its runner's would be another
          # machine's or an older job's runs of the same tree.
          exclude: phpt-runs/
          retention-days: 1 # read by the store job, minutes later

  tailcall:
    name: the threaded dispatch, checked on its dated nightly
    # The lane that holds `cfg(dispatch = "tailcall")` (#2905), as Mitchell
    # ruled on #2970 (harness-design.md §7, design §5.8): per commit,
    # php_engine checked under the cfg on the dated nightly
    # scripts/ci/tailcall.sh pins, which installs it here where the runner
    # has not yet. The match loop on the pinned stable toolchain is what
    # ships; this keeps the threaded variant compiling. It writes no
    # reading, so its failure is the run's and red-main's, and in no store.
    # php_engine links no platform library, so none is installed.
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - run: scripts/ci/tailcall.sh check

  oracle:
    name: the witnesses, the crosscheck and the oracle's tests
    # Not run while the repository is private, as Mitchell ruled on
    # 2026-11-19: a push's Mac minutes are billed then (with nightly.yml's
    # oracle job, 259 on GitHub's 3-core Mac that day), and the witnesses
    # and the crosscheck are held before each land by the merge check. A
    # public repository's minutes on GitHub's `macos-15` are not billed,
    # and from then this job runs there on every push with no edit here;
    # nightly.yml's Mac jobs run on Blacksmith's 12-core M4 while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ github.event.repository.private && 'blacksmith-12vcpu-macos-15' || 'macos-15' }}
    # On the hosted Mac of the trial of 2026-11-17 the witnesses took 94
    # minutes with the build they start from nothing, and the crosscheck
    # and xtask's tests 2 more, after the pour, MySQL and the variant.
    timeout-minutes: 180
    # One instrument runs at a time here, so it is given the whole machine:
    # unless XTASK_SEATS is set, xtask divides the cores among three seats
    # (xtask/src/seat.rs), which left the witness and phpt pools a third
    # of the runner.
    env:
      XTASK_SEATS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - uses: ./.github/actions/oracle-runner
      # The pin's one install, which nightly.yml's oracle job runs too: a
      # hosted runner keeps no keg, so each job pours the closure afresh.
      - uses: ./.github/actions/pinned-php
      - uses: ./.github/actions/mysql
      # The tree and the binary both promised: a test of the harness that
      # spawns the oracle and finds it absent fails here rather than skip.
      - uses: ./.github/actions/corpus
        with:
          promise: tree oracle
      # The oracle variants a crate's row names, built from that tree once
      # per pin and checked by SHA-256 after (#2298); a build that is not the
      # pin's fails the step and not the lanes, whose variant crates say so.
      - uses: ./.github/actions/oracle-variants
        continue-on-error: true
      # The witness reading `done`'s condition 1 asks every touched crate
      # for (§4.5, §7: witnesses run per commit over all crates), under the
      # pinned php. A kernel or native without a witness fails here and
      # names the coverage rule's text. The served binaries build in
      # release-da, the correctness lanes' profile (#2056, #2217). `phpt`
      # stays out until a crate's subset has a home (#18).
      - run: cargo xtask witness
      # The rendering diff `done`'s condition 1 asks an extension the
      # binary carries for (§4.5, §7: per commit over every extension the
      # `php` binary carries, revision 63). A red row is an extension not
      # yet ported and `done` holds a touched one to it, so the step writes
      # the readings and fails the job for nothing.
      - run: cargo xtask crosscheck
        continue-on-error: true
      # The harness's tests that spawn the oracle, which skip on the build
      # runner. Plain `cargo test`, which writes no reading: the `test`
      # reading is the build runner's, and the two stores keep one
      # instrument each so they meet in the run's store whole. Some of the
      # tests run `computed`, which a fresh runner lacks, so it is installed
      # first, as the instruments' job installs it. `--no-fail-fast` runs
      # every test binary whatever an earlier one found, so one run of this
      # job names every failure.
      - run: cargo install computed --locked
      - run: cargo test -p xtask --no-fail-fast
      - name: this job's readings
        if: always()
        uses: ./.github/actions/stash
        with:
          put: store-oracle
          path: target/harness
          # The phpt runs the workspace keeps are the build job's to hand
          # on: this job takes none, and its runner's would be another
          # machine's or an older job's runs of the same tree.
          exclude: phpt-runs/
          retention-days: 1 # read by the store job, minutes later

  store:
    name: the run's store
    # The three jobs' stores joined into the one the run keeps, and its
    # permits section as the summary, whatever the three found. It judges
    # nothing: the `done` step it ran on a pull request went with the
    # trigger (#4348 ruling 5; #4372), and a push runs no `done`.
    needs: [per-commit, miri, oracle]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      # The three jobs' stores, one store again: each instrument keeps its
      # own files, and no instrument ran on both runners. A job that kept
      # none is passed over.
      - name: the three jobs' readings, one store
        uses: ./.github/actions/stash
        with:
          get: store-build store-miri store-oracle
          merge: true
          optional: true
          path: target/harness
      - name: the summary
        if: always()
        run: |
          cargo xtask status --section permits --uncut > permits.md
          cat permits.md
          cat permits.md >> "$GITHUB_STEP_SUMMARY"
      - name: the reading store, the only one the run keeps
        if: always()
        uses: ./.github/actions/stash
        with:
          put: harness
          path: target/harness
          retention-days: 30

  # A red main filed (#1156, adopted on #1151): on a push to main alone, the
  # run's verdict and the one before it decide. Two red runs in a row file
  # one `ci:red-main` ticket; a third comments on it; a green run comments
  # that main is green again and leaves the ticket for its builder to close
  # through `xtask ticket close`. The ticket names the failing jobs and
  # steps and carries no `done` lines, since a push runs no `done` (Round 1,
  # Q21). scripts/ci/red.sh says how, and `DRY_RUN=1` prints what it would
  # write.
  red-main:
    name: a red main, filed
    needs: [regions, per-commit, miri, tailcall, oracle, store]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(vars.LELA_BUILD_RUNNER || '["ubuntu-26.04"]') }}
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A filing that fails is the step's warning and never the run's
      # failure: the next run reads this run's verdict, and a red here would
      # count a green main as the first of two reds.
      - name: two red runs in a row, one ticket
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RED: ${{ contains(needs.*.result, 'failure') }}
        run: scripts/ci/red.sh main
