# The seam manifest (harness-design.md §4.1). One tracked file that declares
# each seam once: producer, consumers, lock file, permitted edges, `unsafe`
# homes, forbidden types, line ceilings, the ADR that decided it, and the text
# a failure prints. Every rule sensor is derived from it: `api-check`,
# `unsafe-audit`, `budget`, `permit`, `status`, the generated `ext/clippy.toml`
# and the one negative-control fixture per rule. A rule stated anywhere else is
# a copy. Edited by a person, in the same commit as the design change.
#
# The numbers are this file's alone: design §4.1 names the crates, §4.5 the
# locks, §10 the lints and profiles, and the harness's §12 item 6 the harness's
# own prose; each cites this file and none of the three design documents
# restates a number (design ledger 14, jit ledger 6, harness ledger 38).
# `xtask` refuses a manifest with a key outside the grammar `Manifest` reads
# (xtask/src/manifest.rs); this comment does not restate the list.
# Keys beyond the harness's §4.1 example, added here because §10 states a rule
# the example had no predicate for, are marked `# grammar:` where they first
# appear. Each is one predicate, as the grammar requires.

[oracle]
pin = "oracle.toml"                        # the only statement of version, digest, recipe

[budget]
total = 630000                             # every counted line of the workspace plus `bindings`; the crate rows are ceilings each crate is held to, and do not sum to this; 560000, the +40k step at the measured weekly rate, for php_ssa's 9,000 (#3174) and the tier's queue; #2971's dedupe freed 93 (#3565, 2026-10-26); 630000, four weeks at the measured rate (#4163, 2026-11-05)
new = 127500                               # design §0, §4.1: lines not on the inheritance manifest (§13)
docs = 6500                                # design §10; `docs/**` plus the three living documents
harness = 4800                             # harness §12 item 6: `.claude/**` and `harness-plugins/**` hand-written, generated types excluded, less the desk where `harness-desk` holds it; 1600 for the readiness-update skill (2026-10-24); 4800 for the vendored skills (#3620 D2, 2026-10-30)
harness-desk = 1300                        # harness §12 item 6: `harness-plugins/desk/**` hand-written, tests included; 1300 for the desk's estimated 980 and its tests (#3491, ruled 2026-10-25)
lock_packages = 190                        # design §4.1: third-party `Cargo.lock` packages (those with a `source`); a workspace crate is held by its [[crate]] row and ceiling (#1335); 164 is stage 1's TLS as #2333 ruled, 190 adds the compiled tier's Cranelift core set and rustix as #2945 ruled
clean_build_release_s = 90                 # design §10: `cargo build --release` from clean on the dev machine
api_items = 1700                           # design §4.4, §4.5: public items of php_ext, measured on api.lock (revision 34; #697); 1550 for the open-source gate's face items, #3548's reserved[] and #3509's set_aside, with room for the next (#3666, 2026-10-30); 1700, about five weeks at the measured rate (#4163, 2026-11-05)
api_private_items = 16                     # design §4.4 (revision 34, D1 of #947): api::__private, the helpers only a macro expansion names, capped apart from api_items
bindings = 32000                           # design §4.1: `ext/*/src/ffi/**` pooled across every extension
# Lines are non-blank, non-comment, tests excluded (`xtask budget`).

[telemetry]
silent_days = 14                           # harness §7: readings and no failure this long is a candidate for silent; `status --section permits`

[divergence]
target = 10                                # harness §4.3: the day-30 target, debt rows under it; no other cause counts (Mitchell on #2460, #2462)

[parity]
# Suites php builds and parity does not count, each with the ruling that put it there.
out = [
  { suites = ["ext/pgsql", "ext/pdo_pgsql", "ext/ldap", "ext/snmp",
              "ext/odbc", "ext/pdo_odbc", "ext/pdo_dblib"], ruling = 1167 },
]

