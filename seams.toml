# ---------------------------------------------------------------- seams
# The six locked seams (design §4.5). `effects.lock` is retired; its content is
# `ops.lock`'s effects column. A lock with `sections` is diffed per section.
[[seam]]
name = "heap"
producer = "php_heap"
consumers = ["php_unit", "php_compile", "php_link", "php_engine", "php_jit", "php_ssa"]
lock = "heap.lock"
adr = "0003"
[[seam]]
name = "process"
producer = "php_process"
consumers = ["php_engine"]
lock = "process.lock"
[[seam]]
name = "unit"
producer = "php_unit"
consumers = ["php_compile", "php_engine", "php_jit", "php_link", "php_ssa"]
lock = "unit.lock"
adr = "0001"
[[seam]]
name = "link"
producer = "php_link"
consumers = ["php_compile", "php_engine", "php_jit", "php_ssa"]
lock = "link.lock"
adr = "0012"
[[seam]]
name = "ops"
producer = "ops.toml"
consumers = ["php_unit", "php_engine", "php_compile", "xtask"]
lock = "ops.lock"
generated = true
[[seam]]
name = "api"
producer = "php_engine"
facade = "php_ext"
consumers = ["ext/*"]
lock = "api.lock"
adr = ["0002", "0004", "0005"]
[[seam]]
name = "sapi"
producer = "php_engine"
consumers = ["php_sapi", "xtask"]
lock = "sapi.lock"
[[seam]]
name = "tier"
producer = "php_engine"
consumers = ["php_jit", "php_sapi"]   # the face section is the one statement of the Tier face; kernels stay php_jit's (#1350)
lock = "tier.lock"
allowlist = true
sections = ["face", { name = "kernels", consumers = ["php_jit"] }]
adr = "0006"
[[seam]]
name = "ssa"
producer = "php_ssa"
consumers = ["php_jit"]                    # the epoch's slot is php_jit's own type, kept through tier::epoch_state, so php_engine names no php_ssa type (#3571)
lock = "ssa.lock"
adr = "0015"
[[seam]]
name = "layer"                            # the stream layer's face of php_engine, sealed from extensions: a trait implemented for Request and free items, which php_ext re-exports neither of (#1959, ruled 2026-10-07)
producer = "php_engine"
module = "layer"
consumers = ["php_streams"]
lock = "layer.lock"
[[seam]]
name = "harness"                          # revision 16: xtask's public items are the instruments and the data; nothing in the workspace imports it
producer = "xtask"
consumers = []
lock = "xtask.lock"

# ---------------------------------------------------------- lock homes
# The crate a lock's file lives with, for a lock no [[crate]] row names. Every
# other lock is named by the row of the crate that produces it; the `ops` seam's
# producer is ops.toml, a file, so no row carries it. php_unit owns the opcode
# enum (ADR-0001) and its build.rs already reads ops.toml, so the record of that
# interface sits beside unit.lock, and api-check holds it as it holds the rest.
[lock_home]
"ops.lock" = "php_unit"

# ---------------------------------------------------------------- edges
# Design §4.2. A manifest edge outside this list fails `api-check`; so does a
# `use` path that crosses a seam without going through its lock.
[[edge]]
from = "php_syntax"
to = ["php_heap"]
[[edge]]
from = "php_unit"
to = ["php_heap"]
[[edge]]
from = "php_link"
to = ["php_unit", "php_heap"]
[[edge]]
from = "php_compile"
to = ["php_syntax", "php_unit", "php_link", "php_heap"]
[[edge]]
from = "php_engine"
to = ["php_compile", "php_unit", "php_link", "php_heap", "php_macros", "php_process"]
adr = "0007"
[[edge]]
from = "php_streams"
to = ["php_engine", "php_macros"]
[[edge]]
from = "php_ext"
to = ["php_engine", "php_macros", "php_streams"]
reexports_only = true
[[edge]]
from = "ext/*"
to = ["php_ext", "ext/*", "timelib_sys"]
only = true
adr = "0004" # ext/* edges are the ones each crate declares; never php_engine, php_compile, php_syntax, php_bundle
[[edge]]
from = "php_bundle"
to = ["ext/*", "php_ext", "php_jit"]
order = "registration"
adr = ["0004", "0006"]
[[edge]]
from = "php_jit"
to = ["php_engine", "php_unit", "php_link", "php_heap", "php_ssa"]
allowlist = "tier.lock"
adr = "0006"
[[edge]]
from = "php_ssa"
to = ["php_unit", "php_link", "php_heap"]
adr = "0015"
[[edge]]
from = "php_sapi"
to = ["php_proto", "php_engine"]
lock = "sapi.lock" # the host face only; php_sapi never sees api
[[edge]]
from = "php_engine::{executor,kernels}"
to = "php_engine::{serve,headers,gpc,output}"
deny = true # design §4.2: keeps a later main/-style split possible
[[edge]]
from = "sapi/*"
to = ["php_sapi", "php_proto", "php_bundle", "php_ext"]
adr = "0008" # a host reaches the engine through php_sapi; php_ext to declare natives of its own (#1348) and to read frames, op arrays and the linked tables as an extension does (#1911); never php_engine or ext/*

# ---------------------------------------------------------------- rules
# Each rule: an `id`, a `scope` or a `tool`, one predicate, an optional `adr`,
# and the `text` a failure prints (or, for an `on` rule, the note an allow
# carries). One fixture per rule under
# `xtask/fixtures/rules/<id>/` must fail, or `cargo test -p xtask` fails.

[[rule]]
id = "ext.no-locks"
scope = "ext/*"
deny_types = ["std::sync::Mutex", "std::sync::RwLock", "std::cell::Cell", "std::cell::RefCell", "std::sync::atomic::*", "parking_lot::*",
              "std::sync::Once", "std::sync::OnceLock", "std::sync::LazyLock", "std::cell::OnceCell", "std::cell::LazyCell", "once_cell::*",
              "std::rc::Rc"]
deny_macros = ["std::thread_local"]
adr = "0005"
text = "Extension state is request-scoped, immutable engine-scoped or process-scoped (ADR-0005, ADR-0010); no lock, cell, once, Rc or thread-local in ext/*. Cross-request caching is api::Cache; a library's object a call into PHP code must outlive is the request's, held by Memory::holding (ADR-0013); a C variable exported from src/ffi/ under php's name is C ABI, not state (#3551)."
# Renders to the generated, committed `ext/clippy.toml` (`disallowed-types`);
# a stale copy is a `budget` failure. The wildcard is expanded from Cargo.lock.

[[rule]]
id = "state.no-thread-local"
scope = ["crates/*", "sapi/*"]            # ext/* is ext.no-locks'
deny_types = ["std::thread::LocalKey"]
deny_macros = ["std::thread_local"]
adr = "0014"
text = "No engine, tier, host or test state is thread-local (design §5.14 Threads, jit-design.md §8): a tier keeps its state in the engine or request state Tier::extension() declares, an extension in its own, and a test reads a request state back through tier::serve_kept. The one per-thread slot is php_heap's lend, which holds a request's heap for one call into C (ADR-0014); its static carries #[expect(clippy::disallowed_types)] and php_heap's root #![expect(clippy::disallowed_macros)], where clippy reports the macro."

[[rule]]
id = "unsafe.homes"
allow = ["php_heap", "php_process", "ext/*/src/ffi/", "sapi/*/src/ffi/", "timelib_sys", "php_jit::table::code", "php_jit::enter", "xtask::bench::spent::read"]
adr = "0006"
text = "unsafe is permitted only in the homes this rule names; see design §4.1. Every other crate is #![forbid(unsafe_code)]; php_jit, xtask (its bench reader, #3062), and an extension or a host with bindings, are #![deny(unsafe_code)] with the allowance on the named module alone."

[[rule]]
id = "unsafe.one-op"
scope = ["crates/php_heap/**", "crates/php_process/**", "ext/*/src/ffi/**", "sapi/*/src/ffi/**", "crates/timelib_sys/src/**", "crates/php_jit/src/table/code.rs", "crates/php_jit/src/enter.rs", "xtask/src/bench/spent/read.rs"]
deny_lints = ["clippy::undocumented_unsafe_blocks", "clippy::multiple_unsafe_ops_per_block"]   # grammar: deny_lints, design §10
text = "Every unsafe block is one operation with a SAFETY comment."

[[rule]]
id = "fork.home"
scope = ["crates/**/*.rs", "ext/**/*.rs", "sapi/**/*.rs"]
exempt = ["crates/php_process/**"]
deny_pattern = '\b(unistd|libc)::v?fork\b'
text = "fork has one home, php_process, and php_engine's fork policy is its only caller (#1779)."

[[rule]]
id = "fork.threads"
scope = ["crates/*", "ext/*", "sapi/*"]
deny_methods = ["php_process::fork::fork", "std::thread::spawn", "std::thread::Builder::spawn", "std::thread::scope",
                "libc::fork", "libc::vfork", "nix::unistd::fork", "nix::unistd::daemon"]   # grammar: deny_methods, #1950
adr = "0010"
text = "A process forks through php_engine's one home, fork::Alone, the one caller of php_process::fork, itself the one caller of fork(2); every thread of the engine's process starts through fork::spawn, so it is counted and a fork waits for it, and an extension owns none (#1807, #1950). The home's call carries #[expect(clippy::disallowed_methods)], a test its allow."
# Renders to the generated, committed `crates/clippy.toml`, `ext/clippy.toml`
# and `sapi/clippy.toml` (`disallowed-methods`); a path of libc or nix is
# `allow-invalid`, since each is declared for some targets and features only.

[[rule]]
id = "lints.no-panic"
scope = ["crates/*", "ext/*", "sapi/*"]  # every crate a request runs through; php_syntax because the parser runs inside every request (#236), the rest measured clean (#1917)
exempt = ["tests", "xtask", "crates/php_macros"]
deny_lints = ["clippy::unwrap_used", "clippy::expect_used", "clippy::panic", "clippy::unreachable", "clippy::todo", "clippy::unimplemented"]
allow_in_tests = ["clippy::unwrap_used", "clippy::expect_used", "clippy::panic"]  # rendered as clippy's allow-*-in-tests keys (#3078)
text = "Internal invariant failures are InternalError fatals with a message, not panics (design §10)."

[[rule]]
id = "tests.no-silent-return"
scope = ["crates/*", "ext/*", "sapi/*"]   # src test modules and tests/ alike; xtask's Promise::or_skip is its honest skip, counted by #3085
check = "silent-return"   # the clippy instrument's sensor of a return at a #[test] fn's own level (#3105)
text = "A test that returns early passes without asserting: its setup fails with .expect(\"<step>\") (#3078), and a return at a #[test] fn's own level is refused unless it is return Err(..) (#3079)."

[[rule]]
id = "api.no-hot"
scope = "crates/php_ext/**"
deny_pattern = 'php_heap::hot'
text = "php_heap::hot is for the handlers; api never re-exports it (design §4.4, §10)."

[[rule]]
id = "ext.no-private"
scope = "ext/*/src/**"
deny_pattern = '__private'
text = "Only a macro expansion names php_ext::__private; an extension's source never does (design §4.4, revision 34)."

[[rule]]
id = "api.lock-line"
scope = "crates/php_engine/src/api/**"
on = "pub"
text = "A new pub item in api needs its api.lock line in the same commit; api holds to [budget] api_items (design §4.4)."
[[rule]]
id = "xtask.lock-line"
scope = "xtask/src/**"
on = "pub"
text = "A new pub item in xtask needs its xtask.lock line in the same commit."

[[rule]]
id = "ext.pub-beyond-extension"
scope = "ext/*"
on = "pub"
text = "api-check fails an ext crate's library dependency on another ext crate that no row of design §4.10's list of surfaces names with both crates, and diffs its pub items beyond extension() against its ext/<name>/surface.lock, which `api-check --write` rewrites and lands in the same commit (#2020, #2251)."

[[rule]]
id = "witness.exit-authored"
scope = "**/*.rs"
deny_pattern = '```expect[^\n]*\b(?:exit|signal)=[+-]?\d+'
unless = "xtask witness --accept"
exempt = ["xtask/src/witness/**", "xtask/tests/witness.rs"] # the parser of the fence grammar and its tests carry the shape they parse (#23)
text = "exit= and signal= in a witness are captured by `xtask witness --accept`, never authored."

[[rule]]
id = "witness.capture-authored"
scope = "**/*.rs"
deny_pattern = '(?m)^[ \t]*//[/!][ \t]*```expect\b[^\n]*\bcapture\b[^\n]*\n(?:[ \t]*//[/!][^\n]*\n)*?[ \t]*//[/!][ \t]*```[ \t]*$(?:\n[ \t]*//[/!][ \t]*```stderr\b[^\n]*\n(?:[ \t]*//[/!][^\n]*\n)*?[ \t]*//[/!][ \t]*```[ \t]*$)?'   # a fence marked `capture`, from its `expect` line to its close, and the `stderr` fence after it; a block dropping the word is no hit (#2413)
unless = "xtask witness --accept"
text = "A fence marked `capture` holds the oracle's streams as `xtask witness --accept --streams` wrote them, never authored; drop `capture` to write the fence by hand."

[[rule]]
id = "witness.coverage"
scope = ["crates/php_engine/src/**", "crates/php_streams/src/**", "ext/*/src/**"]
check = "witness-coverage"
text = "A kernel or a native without a witness fails CI (design §8)."

[[rule]]
id = "vocab.avoid"
scope = ["crates/*", "ext/*"]
avoid_from = "CONTEXT.md" # grammar: avoid_from, harness §5
text = "The glossary's _Avoid_ words appear in no public item name or rustdoc prose; a lock line mirrors php's names and is not read."

[[rule]]
id = "vocab.harness"
scope = "xtask"
avoid_from = { file = "CONTEXT.md", section = "Harness" } # grammar: avoid_from, harness §5
text = "The Harness section's _Avoid_ words appear in no public item name or rustdoc prose of the harness; xtask/fixtures/** are other crates' sources and are not read."

[[rule]]
id = "vocab.sapi"
scope = "sapi/*"
avoid_from = "CONTEXT.md" # grammar: avoid_from, harness §5
# vocab.avoid's scope gaining sapi/* (#3620 D4, #3624), as an addition: a
# host crate is held to the whole glossary, as an engine or extension crate is.
text = "The glossary's _Avoid_ words appear in no public item name or rustdoc prose of a host; a lock line mirrors php's names and is not read."

[[rule]]
id = "generated.committed"
generated = ["crates/clippy.toml", "ext/clippy.toml", "sapi/clippy.toml"] # grammar: generated, design §10
text = "Each clippy.toml the row names is generated from the manifest and committed; a stale copy fails budget."

[[rule]]
id = "git.no-verify"
tool = "Bash"
where = "checkout"   # a scratch repository outside every checkout has no hooks for the flag to skip (#3186, ruled 2026-10-21)
deny_argv = ["--no-verify", "-n", "-c core.hooksPath", "--config-env core.hooksPath"]
with = ["git commit", "git merge"]   # git merge --no-verify skips pre-merge-commit as git commit's skips pre-commit (#2751); -n there is --no-stat, refused all the same
text = "Commits run the pre-commit hook; --no-verify is not available to agents."
remedy = "run the commit as it is, and fix what the hook names"                 # #3627

[[rule]]
id = "git.merge-commits-itself"
tool = "Bash"
where = "staging"   # grammar: where, the merge worktree on `staging`, where the merge queue's merges are made (#3618 M2, #3622)
deny_pattern = '(?m)(\A|[|;&(\n]\s*)git(\s+-[cC]\s+\S+|\s+--?[\w.-]+(=\S+)?)*\s+merge(\s|$)'   # git merge where it is run (first in the call, after a separator or a newline), never where it is cited
unless_pattern = '\s--(no-commit|squash|ff-only|abort|continue|quit|help)\b|\s-h\b'   # a merge that leaves its commit to git commit, commits nothing, or ends one
text = "A merge in the merge worktree is finished by git commit, so pre-commit renders, tests and checks what it commits (#2744, #2751, #3622)."
remedy = "`git merge --no-commit <branch>`, then `git commit -F <file> -- <paths>`"                 # #3627, #3639

[[rule]]
id = "git.no-amend"
tool = "Bash"
deny_argv = ["--amend"]
with = "git commit"
text = "A commit is never rewritten: make a new one. An amend of a pushed commit forks main from origin (#2267)."
remedy = "`git commit -F <file> -- <paths>` with a new commit"                 # #3627

[[rule]]
id = "git.operation"
tool = "Bash"
where = "operating"   # grammar: where, a checkout another session owns by its owner record, with a merge, cherry-pick, revert, rebase or am standing in it (#2476, #3621)
deny_argv = ["add", "stage", "commit", "rm", "mv", "restore", "reset", "apply", "merge", "cherry-pick", "revert", "rebase", "am"]
with = "git"
text = "A merge, cherry-pick, revert or rebase in progress commits the whole index, so what you stage or step there lands in its commit, and it is the checkout's owner's to end (#2476, #3618 M1)."
remedy = "work in your own worktree, or wait for its owner to end it"                 # #3627

[[rule]]
id = "ticket.close"
tool = "Bash"
deny_argv = ["close", "reopen"]
with = "gh issue"
exempt_label = ["frontier:chart"] # a chart sheet carries no acceptance criteria, so the close of a filled one is the frontier skill's bookkeeping (#341)
text = "A ticket closes through `xtask ticket close`, the instrument that read its acceptance criteria; `gh issue close` and `gh issue reopen` are not available to agents."
remedy = "`cargo xtask ticket close <n>`"                 # #3627

[[rule]]
id = "ticket.close-api"
tool = "Bash"
deny_pattern = '''gh\s+api\b(?:[^|;&]*issues/\d+(?:['"\s]|$)[^|;&]*(?:[\s'"]state=(?:closed|open)\b|"state"\s*:\s*"(?:closed|open)"|--input\b|=@-|=["']?\$\()|[^|;&]*(?:[\s'"]state=(?:closed|open)\b|"state"\s*:\s*"(?:closed|open)"|--input\b|=@-|=["']?\$\()[^|;&]*issues/\d+(?:['"\s]|$)|[^|;&]*\bgraphql\b[^|;&]*(?:(?:close|reopen)Issue\(|--input\b|=@-|=["']?\$\()|[^|;&]*(?:(?:close|reopen)Issue\(|--input\b|=@-|=["']?\$\()[^|;&]*\bgraphql\b)'''
text = "The same act through `gh api`: an issue's state is set by `xtask ticket close` and by nothing else. A write to an issue's comments, labels or other sub-resources sets no state and is not this rule's (#2390)."
remedy = "`cargo xtask ticket close <n>`"                 # #3618 ruling 3

[[rule]]
id = "ticket.reply-unfiled"
tool = "Stop"
deny_pattern = '(?i)\b(left (for|to) a person|for a person to|handed (off )?to a person|a person (decides|must|should|will|would|has to)|is a person.?s( alone)?|worth (filing|a ticket)|(needs|deserves|wants) (a|its own) ticket|should be filed|not (yet )?filed|left open|leaves? open|open question|still to (do|decide)|not (yet )?done|remains? (to be|to do|undone|open)|in a later (commit|turn|session|ticket)|next turn|future work|follow[- ]?ups?|leftovers?|out of scope|todo)\b'
text = "A session that closed a ticket names what it found and did not do in a ticket, a divergence row or a rule proposed in a commit message, never in its reply alone (CONTEXT.md, Ticket): a reply that hands work to a person, leaves a decision open or calls a thing worth filing is held once. A heuristic beside the close's own conditions; the second Stop passes."
remedy = "file it with `gh issue create`, `ready-for-agent` or `for-a-person`, and name its number in the reply"                 # #3627

[[rule]]
id = "lanes.nightly"
tool = "Bash"
deny_pattern = '(?m)(\A|[|;&]\s*)"?(\S*\bphp[0-9.]*|\$\{?\w+\}?)"?(\s+[^|;&\s]+)*?\s+\S*run-tests\.php|(\A|[|;&]\s*)\S*run-tests\.php|compile-identity --corpus'   # upstream's runner where it is run (first in the call, after a separator, or under php), never where it is cited, a message's line included (#790); the lane's flags are lanes.nightly-flags (#1860)
text = "Nightly lanes run in CI only; run the per-crate subset."
remedy = "`cargo xtask phpt --subset <crate>`"                 # #3618 ruling 3

[[rule]]
id = "lanes.nightly-flags"
tool = "Bash"
deny_argv = ["--full", "--jit"]
unless_argv = { "--jit" = "xtask phpt --subset" }   # grammar: unless_argv, a denied element let through where the phrase runs bounded by the option, as require_argv reads one: the tier's one-subset reading (#3052, #3068)
with = ["xtask phpt", "xtask bench"]   # xtask however it is run: the cargo alias, cargo run -p xtask, a path, a variable the line assigns (#1860)
text = "Nightly lanes run in CI only; run the per-crate subset, and the tier's `--jit` lane on one subset named by `--subset` (#3052)."
remedy = "`cargo xtask phpt --subset <crate>`, with `--jit` on one subset"                 # #3627

[[rule]]
id = "lanes.nightly-soak"
tool = "Bash"
deny_argv = ["--nightly"]
with = ["xtask soak"]
text = "Nightly lanes run in CI only; run the per-crate subset."
remedy = "`cargo xtask phpt --subset <crate>`"                 # #3627

[[rule]]
id = "lanes.builder-subset"
tool = "Bash"
where = "ticketed"   # grammar: where, a builder's worktree (branch.<b>.ticket); main's checkout, where the merge check runs the lane, records none (#1145, #1149)
require_argv = "--subset"
with = "xtask phpt"   # the subset named, as a word or after =; a call for the instrument's help runs no lane (#1424, #1860)
text = "A builder runs its crates' subsets, and Zend/tests when it touches php_engine, php_compile, php_syntax or php_heap; the whole lane is the merge check's (specs §6)."
remedy = "`cargo xtask phpt --subset <your crate>`, plus Zend/tests when you touch the engine crates"                 # #3618 ruling 3

[[rule]]
id = "computed.force"
tool = "Bash"
deny_pattern = 'computed\s+run\b.*--force'
text = "`computed run --force` discards a hand edit; a person decides that."
remedy = "`computed run <file>` to refresh the region; a hand edit to keep is a person's"                 # #3627

[[rule]]
id = "harness.self"
tool = ["Edit", "Write"]
where = "checkout"   # as harness.self-shell: a checkout of this repository, never a scratch repository outside them (#3885)
scope = [".claude/**", ".claude-plugin/marketplace.json", "harness-plugins/*/hooks/**", "harness-plugins/*/.claude-plugin/**", "seams.toml", "oracle.toml", "docs/divergence.toml"]
# A skill is an ordinary file, held by review and the [budget] harness
# ceiling (#626); a plugin laid inside one is not, since a project skill's
# plugin loads for every session and its module could approve a call permit
# blocked (#3470). The marketplace says where each plugin's source is, and
# every plugin's hooks/ and .claude-plugin/ are held, so a later plugin is
# covered with no edit here (#3490).
exempt = [".claude/skills/**", "!.claude/skills/**/.claude-plugin/**", "!.claude/skills/**/hooks/**"]
deny = true
text = "Harness configuration, the oracle pin and the divergence registry are edited by a person."
remedy = "propose it on a `for-a-person` ticket; an additive row a person settled lands with `cargo xtask steer`; to discard your change, file it, since `git restore` of these paths is denied too"                 # #3618 ruling 3

[[rule]]
id = "harness.self-shell"
tool = "Bash"
where = "checkout"   # grammar: where, a checkout of this repository, the main one or a linked worktree, and never a scratch repository outside them; judged wherever permit cannot follow the line (#2887, #2915)
# The paths of harness.self, written by a shell line (#625, ruled
# 2026-09-28): a redirection into one, `tee` naming one, `sed -i` or
# `perl -i` over one, `cp`, `mv`, `ln` or `install` with one as the
# destination, `git apply` or `patch` naming one, `git checkout` or
# `git restore` of one. A path is the root's, bare or `./`, and under
# `.claude/` anything but `skills/` (#626), less a skill's `.claude-plugin/`
# or `hooks/` (#3470), and under `harness-plugins/` any plugin's
# `hooks/` or `.claude-plugin/` (#3490). Reading one (`cat`, `grep`,
# `head`, `diff`, `git show`) is none of these; `permit --after` holds
# what a pattern cannot see (#1516).
deny_pattern = '''(?x)
  [0-9&]?>>?\|?\s*['"]?
    (?:(?:\./)?(?:seams\.toml|oracle\.toml|docs/divergence\.toml|harness-plugins/[^/\s'"|;&)<>]+/(?:hooks|\.claude-plugin)/[^\s'"|;&)<>]*|\.claude-plugin/marketplace\.json)(?:$|[\s'"|;&)<>])|(?:\./)?\.claude/(?:[^s\s'"]|s[^k]|sk[^i]|ski[^l]|skil[^l]|skill[^s]|skills[^/]|skills/[^\s'"|;&)<>]*/(?:\.claude-plugin|hooks)/))
| \btee\b[^|;&\n]*[\s'"]
    (?:(?:\./)?(?:seams\.toml|oracle\.toml|docs/divergence\.toml|harness-plugins/[^/\s'"|;&)<>]+/(?:hooks|\.claude-plugin)/[^\s'"|;&)<>]*|\.claude-plugin/marketplace\.json)(?:$|[\s'"|;&)<>])|(?:\./)?\.claude/(?:[^s\s'"]|s[^k]|sk[^i]|ski[^l]|skil[^l]|skill[^s]|skills[^/]|skills/[^\s'"|;&)<>]*/(?:\.claude-plugin|hooks)/))
| \b(?:sed|perl)\b[^|;&\n]*\s(?:-[a-zA-Z]*i|--in-place)[^|;&\n]*[\s'"]
    (?:(?:\./)?(?:seams\.toml|oracle\.toml|docs/divergence\.toml|harness-plugins/[^/\s'"|;&)<>]+/(?:hooks|\.claude-plugin)/[^\s'"|;&)<>]*|\.claude-plugin/marketplace\.json)(?:$|[\s'"|;&)<>])|(?:\./)?\.claude/(?:[^s\s'"]|s[^k]|sk[^i]|ski[^l]|skil[^l]|skill[^s]|skills[^/]|skills/[^\s'"|;&)<>]*/(?:\.claude-plugin|hooks)/))
| \b(?:cp|mv|ln|install)\b[^|;&\n]*[\s'"]
    (?:(?:\./)?(?:seams\.toml|oracle\.toml|docs/divergence\.toml|harness-plugins/[^/\s'"|;&)<>]+/(?:hooks|\.claude-plugin)/[^\s'"|;&)<>]*|\.claude-plugin/marketplace\.json)|(?:\./)?\.claude/(?:[^s\s'"]|s[^k]|sk[^i]|ski[^l]|skil[^l]|skill[^s]|skills[^/]|skills/[^\s'"|;&)<>]*/(?:\.claude-plugin|hooks)/)[^\s'"|;&)<>]*)
    ['"]?(?:\s+(?:-\S*|[0-9]*>&?\S*))*\s*(?:$|[|;&\n)])
| \b(?:git\s+(?:-C\s+\S+\s+)?(?:apply|checkout|restore)|patch)\b[^|;&\n]*[\s'"=]
    (?:(?:\./)?(?:seams\.toml|oracle\.toml|docs/divergence\.toml|harness-plugins/[^/\s'"|;&)<>]+/(?:hooks|\.claude-plugin)/[^\s'"|;&)<>]*|\.claude-plugin/marketplace\.json)(?:$|[\s'"|;&)<>])|(?:\./)?\.claude/(?:[^s\s'"]|s[^k]|sk[^i]|ski[^l]|skil[^l]|skill[^s]|skills[^/]|skills/[^\s'"|;&)<>]*/(?:\.claude-plugin|hooks)/))
'''
text = "Harness configuration, the oracle pin and the divergence registry are edited by a person, through a shell as through Edit and Write."
remedy = "propose it on a `for-a-person` ticket; an additive row a person settled lands with `cargo xtask steer`; to discard your change, file it, since `git restore` of these paths is denied too"                 # #3618 ruling 3

[[rule]]
id = "harness.transcript"
tool = "Bash"
# A session's transcript under ~/.claude/projects, written by a shell line
# in the shapes harness.self-shell reads (#2282, ruled 2026-10-08): a
# redirection into one, `tee` naming one, `sed -i` or `perl -i` over one,
# `cp`, `mv`, `ln` or `install` with one as the destination, `git apply`
# or `patch` naming one; the path `~`-relative, `$HOME`'s or absolute.
# permit reads the person's answers there (#2247); reading one is none
# of these.
# A project's memory/ is not a transcript and is written as any file
# (#3185, ruled 2026-10-21).
deny_pattern = '''(?x)
  [0-9&]?>>?\|?\s*['"]?(?:~|\$\{?HOME\}?|/[^\s'"|;&)<>]*)/\.claude/projects/(?:[^/\s'"|;&)<>]*/?(?:$|[\s'\"|;&)<>])|[^/\s'"|;&)<>]+/(?:[^m\s'\"|;&)<>]|m[^e]|me[^m]|mem[^o]|memo[^r]|memor[^y]|memory[^/]))
| \btee\b[^|;&\n]*[\s'"](?:~|\$\{?HOME\}?|/[^\s'"|;&)<>]*)/\.claude/projects/(?:[^/\s'"|;&)<>]*/?(?:$|[\s'\"|;&)<>])|[^/\s'"|;&)<>]+/(?:[^m\s'\"|;&)<>]|m[^e]|me[^m]|mem[^o]|memo[^r]|memor[^y]|memory[^/]))
| \b(?:sed|perl)\b[^|;&\n]*\s(?:-[a-zA-Z]*i|--in-place)[^|;&\n]*[\s'"](?:~|\$\{?HOME\}?|/[^\s'"|;&)<>]*)/\.claude/projects/(?:[^/\s'"|;&)<>]*/?(?:$|[\s'\"|;&)<>])|[^/\s'"|;&)<>]+/(?:[^m\s'\"|;&)<>]|m[^e]|me[^m]|mem[^o]|memo[^r]|memor[^y]|memory[^/]))
| \b(?:cp|mv|ln|install)\b[^|;&\n]*[\s'"](?:~|\$\{?HOME\}?|/[^\s'"|;&)<>]*)/\.claude/projects/(?:[^/\s'"|;&)<>]*/?(?:$|[\s'\"|;&)<>])|[^/\s'"|;&)<>]+/(?:[^m\s'\"|;&)<>]|m[^e]|me[^m]|mem[^o]|memo[^r]|memor[^y]|memory[^/]))[^\s'"|;&)<>]*
    ['"]?(?:\s+(?:-\S*|[0-9]*>&?\S*))*\s*(?:$|[|;&\n)])
| \b(?:git\s+(?:-C\s+\S+\s+)?(?:apply|checkout|restore)|patch)\b[^|;&\n]*[\s'"=](?:~|\$\{?HOME\}?|/[^\s'"|;&)<>]*)/\.claude/projects/(?:[^/\s'"|;&)<>]*/?(?:$|[\s'\"|;&)<>])|[^/\s'"|;&)<>]+/(?:[^m\s'\"|;&)<>]|m[^e]|me[^m]|mem[^o]|memo[^r]|memor[^y]|memory[^/]))
'''
text = "A session's transcript is Claude Code's record of what the person said; no agent writes it, nor anything else under ~/.claude/projects but a project's memory/."
remedy = "keep working material in the session's scratchpad"                 # #3627

[[rule]]
id = "divergence.reason"
scope = "docs/divergence.toml"
check = "divergence-reason"
text = "A divergence row with status accepted has a reason a person wrote, a by-design row's citing the design section or ADR that chose it, and an oracle-build row carries what it retires at; done fails while an open row touches the scope (harness §4.3)."

[[rule]]
id = "checkout.owner"
tool = ["Edit", "Write", "Bash"]
where = "owned"   # grammar: where, a checkout another session owns by its owner record, judged where each write lands (#3618 M1, #3621)
writes = true   # grammar: writes, an Edit, a Write, or a Bash line with a command that can change a checkout or a redirection into a file (#3621)
text = "One session writes in a checkout: its owner, recorded by `xtask worktree add` or `xtask worktree own` (#3618 M1)."
remedy = "work in your own worktree (`xtask worktree add`), or have its owner let it go with `xtask worktree own --release`"                 # #3627

[[rule]]
id = "wait.foreground"
tool = "Bash"
runs = "foreground"   # grammar: runs, a call the runtime runs in the foreground and never one with run_in_background, whose end it notifies (#3624)
# A poll loop, an until, while or for whose body sleeps 3 s or more
# before its done, where it is run and not where a heredoc writes it:
# the shape that held a coordinator, a seat or a lock in #3624's
# measurement of 821 builder waits (265 coordinator, 14 lock and 92 seat
# loops fire; no single sleep and no settle of 2 s or less does).
deny_pattern = '''(?s)(?:\A|[;&|({\n]|\b(?:then|do|else))\s*(?:until|while|for)\s.*?[;\n]\s*do\b(?:.*?(?:[;&|({\n]|\b(?:then|do|else)))?\s*sleep\s+0*(?:[3-9]|[1-9][0-9]+)(?:\.[0-9]+)?[smh]?\b.*?\bdone\b'''
text = "A foreground poll loop holds the turn, and the coordinator, seat or lock it waits on with it (#3624)."
remedy = "run what it waits for with run_in_background, whose end the runtime notifies, or wait on the condition with Monitor and an until-loop"                 # #3627

[[rule]]
id = "git.main-ff-only"
tool = "Bash"
where = "main"   # grammar: where, the repository's main checkout and never a linked worktree (#2751)
deny_pattern = '(?m)(\A|[|;&(\n]\s*)git(\s+-[cC]\s+\S+|\s+--?[\w.-]+(=\S+)?)*\s+merge(\s|$)'   # git merge where it is run, as git.merge-commits-itself reads it
unless_pattern = '\s--(ff-only|abort|continue|quit|help)\b|\s-h\b'   # a fast-forward, which commits nothing, or the end of a merge that stands, its owner's (#3621)
text = "main moves only by a fast-forward to a commit the merge queue judged (#3618 M2, #3622)."
remedy = "merge in the merge worktree on staging, then `xtask worktree land`"                 # #3627

# ---------------------------------------------------------------- owed
# What a crate owes before done (harness §4.5 condition 1): one row per
# instrument, the crates a glob or a list less `exempt`, and `when` a
# predicate the harness derives in code (Mitchell on #3184, built by #3206).
[[owed]]
instrument = "clippy"
crates = "*"

[[owed]]
instrument = "test"
crates = "*"

[[owed]]
instrument = "witness"
crates = "*"
when = "engine"                           # every crate but the harness (layout::HARNESS)

[[owed]]
instrument = "api-check"
crates = "*"

[[owed]]
instrument = "budget"
crates = "*"

[[owed]]
instrument = "unsafe-audit"
crates = "*"

[[owed]]
instrument = "phpt"
held_at = "merge"  # #3618 ruling 2: the merge check owns the row
crates = "*"
when = "phpt-subset"                       # the per-commit lane runs a subset of the crate

[[owed]]
instrument = "port-map"
crates = "*"
when = "lock-home"                         # the crate api.lock lives with, the one scope port-map writes

[[owed]]
instrument = "crosscheck"
held_at = "merge"  # #3618 ruling 2: the merge check owns the row
crates = "ext/*"
when = "carried"                           # an extension the binary under test carries

[[owed]]
instrument = "miri"
crates = ["php_heap"]                      # design §9's memory model; also what `xtask miri` runs by default

[[bench]]
bar = "g1"
tolerance_pct = 2.0                        # protocol §12.3's floor alone until g1-aa has two weeks of nights (#3130)
