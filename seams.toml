# ---------------------------------------------------------------- seams
# The six locked seams (design §4.5). `effects.lock` is retired; its content is
# `ops.lock`'s effects column. A lock with `sections` is diffed per section.
[[seam]]
name = "heap"
producer = "php_heap"
consumers = ["php_unit", "php_compile", "php_engine", "php_jit"]
lock = "heap.lock"
adr = "0003"
[[seam]]
name = "unit"
producer = "php_unit"
consumers = ["php_compile", "php_engine", "php_macros", "php_jit"]
lock = "unit.lock"
adr = "0001"
[[seam]]
name = "ops"
producer = "ops.toml"
consumers = ["php_unit", "php_engine", "php_compile", "xtask"]
lock = "ops.lock"
generated = true
[[seam]]
name = "api"
producer = "php_engine"
facade = "php_ext"
consumers = ["ext/*"]
lock = "api.lock"
adr = ["0002", "0004", "0005"]
[[seam]]
name = "sapi"
producer = "php_engine"
consumers = ["php_sapi", "xtask"]
lock = "sapi.lock"
[[seam]]
name = "tier"
producer = "php_engine"
consumers = ["php_jit"]
lock = "tier.lock"
allowlist = true
sections = ["face", "kernels"]
adr = "0006"

# ---------------------------------------------------------------- edges
# Design §4.2. A manifest edge outside this list fails `api-check`; so does a
# `use` path that crosses a seam without going through its lock.
[[edge]]
from = "php_unit"
to = ["php_heap"]
[[edge]]
from = "php_compile"
to = ["php_syntax", "php_unit", "php_heap"]
[[edge]]
from = "php_engine"
to = ["php_compile", "php_unit", "php_heap"]
[[edge]]
from = "php_macros"
to = ["php_engine"]
adr = "0002"
[[edge]]
from = "php_ext"
to = ["php_engine", "php_macros"]
reexports_only = true
[[edge]]
from = "ext/*"
to = ["php_ext", "ext/*"]
only = true
adr = "0004" # ext/* edges are the ones each crate declares; never php_engine, php_compile, php_syntax, php_bundle
[[edge]]
from = "php_bundle"
to = ["ext/*", "php_ext", "php_jit"]
order = "topological"
adr = ["0004", "0006"]
[[edge]]
from = "php_jit"
to = ["php_engine", "php_unit", "php_heap"]
allowlist = "tier.lock"
adr = "0006"
[[edge]]
from = "php_sapi"
to = ["php_proto", "php_engine"]
lock = "sapi.lock" # the host face only; php_sapi never sees api
[[edge]]
from = "php"
to = ["php_bundle", "php_sapi"]
[[edge]]
from = "xtask"
to = ["php_bundle", "php_sapi"]
[[edge]]
from = "php_engine::{executor,kernels}"
to = "php_engine::{serve,headers,gpc,output}"
deny = true # design §4.2: keeps a later main/-style split possible

# ---------------------------------------------------------------- rules
# Each rule: an `id`, a `scope` or a `tool`, one predicate, an optional `adr`,
# and the `text` a failure prints (or, for an `on` rule, the note an allow
# carries). One fixture per rule under
# `xtask/fixtures/rules/<id>/` must fail, or `cargo test -p xtask` fails.

[[rule]]
id = "ext.no-locks"
scope = "ext/*"
deny_types = ["std::sync::Mutex", "std::sync::RwLock", "std::cell::Cell", "std::cell::RefCell", "std::sync::atomic::*", "parking_lot::*"]
adr = "0005"
text = "Extension state is request-scoped or immutable; no lock or cell in ext/*. Cross-request caching is api::Cache."
# Renders to the generated, committed `ext/clippy.toml` (`disallowed-types`);
# a stale copy is a `budget` failure. The wildcard is expanded from Cargo.lock.

[[rule]]
id = "unsafe.homes"
allow = ["php_heap", "ext/*/src/ffi/", "php_jit::table::code", "php_jit::enter"]
adr = "0006"
text = "unsafe is permitted in four places; see design §4.1. Every other crate is #![forbid(unsafe_code)]; php_jit and an extension with bindings are #![deny(unsafe_code)] with the allowance on the named module alone."

[[rule]]
id = "unsafe.one-op"
scope = ["crates/php_heap/**", "ext/*/src/ffi/**", "crates/php_jit/src/table/code.rs", "crates/php_jit/src/enter.rs"]
deny_lints = ["clippy::undocumented_unsafe_blocks", "clippy::multiple_unsafe_ops_per_block"]   # grammar: deny_lints, design §10
text = "Every unsafe block is one operation with a SAFETY comment."

[[rule]]
id = "lints.no-panic"
scope = ["crates/php_heap", "crates/php_unit", "crates/php_compile", "crates/php_engine", "crates/php_jit", "crates/php_sapi", "ext/*"]
exempt = ["tests", "xtask"]
deny_lints = ["clippy::unwrap_used", "clippy::expect_used", "clippy::panic", "clippy::unreachable", "clippy::todo", "clippy::unimplemented"]
text = "Internal invariant failures are InternalError fatals with a message, not panics (design §10)."

[[rule]]
id = "engine.reentry-signature"
scope = "crates/php_engine/**"
check = "reentry-signature" # grammar: check, a named xtask lint (design §10, principle 9)
text = "A function in php_engine that calls execute or release takes &mut Request."

[[rule]]
id = "api.no-hot"
scope = "crates/php_ext/**"
deny_pattern = 'php_heap::hot'
text = "php_heap::hot is for the handlers; api never re-exports it (design §4.4, §10)."

[[rule]]
id = "api.lock-line"
scope = "crates/php_engine/src/api/**"
on = "pub"
text = "A new pub item in api needs its api.lock line in the same commit; api ≤ 400 items."

[[rule]]
id = "ext.pub-beyond-extension"
scope = "ext/*"
on = "pub"
text = "api-check prints each ext crate's pub items beyond extension(); anything beyond the pdo driver trait and the random handle needs a line in the design (§12)."

[[rule]]
id = "witness.exit-authored"
scope = "**/*.rs"
deny_pattern = '```expect[^\n]*\bexit=\d+'
unless = "xtask witness --accept"
text = "exit= in a witness is captured by `xtask witness --accept`, never authored."

[[rule]]
id = "witness.coverage"
scope = ["crates/php_engine/src/ops/**", "ext/*/src/**"]
check = "witness-coverage"
text = "A kernel or a native without a witness fails CI (design §8)."

[[rule]]
id = "vocab.avoid"
scope = ["crates/*", "ext/*"]
avoid_from = "CONTEXT.md" # grammar: avoid_from, harness §5
text = "The glossary's _Avoid_ words appear in no public item name or rustdoc prose; a lock line mirrors php's names and is not read."

[[rule]]
id = "generated.committed"
generated = { "ext/clippy.toml" = "ext.no-locks" } # grammar: generated, design §10
text = "ext/clippy.toml is generated from the manifest and committed; a stale copy fails budget."

[[rule]]
id = "git.no-verify"
tool = "Bash"
deny_argv = ["--no-verify", "-n"]
with = "commit"
text = "Commits run the pre-commit hook; --no-verify is not available to agents."

[[rule]]
id = "lanes.nightly"
tool = "Bash"
deny_pattern = 'xtask (-- )?(phpt|bench) --full|run-tests\.php|compile-identity --corpus'   # `xtask phpt --full` and `cargo run -p xtask -- phpt --full` alike
text = "Nightly lanes run in CI only; run the per-crate subset."

[[rule]]
id = "computed.force"
tool = "Bash"
deny_pattern = 'computed\s+run\b.*--force'
text = "`computed run --force` discards a hand edit; a person decides that."

[[rule]]
id = "harness.self"
tool = ["Edit", "Write"]
scope = [".claude/**", "harness-plugins/hooks/hooks.json", "harness-plugins/.claude-plugin/plugin.json", "seams.toml", "oracle.toml", "docs/divergence.toml"]
deny = true
text = "Harness configuration, the oracle pin and the divergence registry are edited by a person."

[[rule]]
id = "divergence.reason"
scope = "docs/divergence.toml"
check = "divergence-reason"
text = "A divergence row with status accepted has a reason a person wrote; done fails while an open row touches the scope (harness §4.3)."
