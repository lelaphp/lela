# The seam manifest (harness-design.md §4.1). One tracked file that declares
# each seam once: producer, consumers, lock file, permitted edges, `unsafe`
# homes, forbidden types, line ceilings, the ADR that decided it, and the text
# a failure prints. Every rule sensor is derived from it: `api-check`,
# `unsafe-audit`, `budget`, `permit`, `status`, the generated `ext/clippy.toml`
# and the one negative-control fixture per rule. A rule stated anywhere else is
# a copy. Edited by a person, in the same commit as the design change.
#
# Numbers are design §4.1 (crates), §4.5 (locks), §10 (lints, profiles) and the
# harness's §12 item 6; the design cites this file and restates none of them.
# `xtask` refuses a manifest with a key outside this grammar:
#   [oracle] [budget] [telemetry] [[crate]] [[seam]] [[edge]] [[rule]] [[week]]
# Keys beyond the harness's §4.1 example, added here because §10 states a rule
# the example had no predicate for, are marked `# grammar:` where they first
# appear. Each is one predicate, as the grammar requires.

[oracle]
pin = "oracle.toml"                        # the only statement of version, digest, recipe

[budget]
total = 272500                             # design §4.1: the sum of every [[crate]] row plus `bindings`; docs is separate (253.2k + 15k = 268.2k at this revision)
new = 127500                               # design §0, §4.1: lines not on the inheritance manifest (§13)
docs = 5000                                # design §10; `docs/**` plus the three living documents
harness = 300                              # harness §12 item 6: `.claude/**` and `harness-plugins/**` hand-written, generated types excluded
lock_packages = 120                        # design §4.1: `Cargo.lock` packages, default features, counted on day 31 with the Cranelift set
clean_build_release_s = 90                 # design §10: `cargo build --release` from clean on the dev machine
api_items = 400                            # design §4.4, §4.5: public items of php_ext, measured on api.lock
bindings = 15000                           # design §4.1: `ext/*/src/ffi/**` pooled across every extension
# Lines are non-blank, non-comment, tests excluded (`xtask budget`).

[telemetry]
silent_days = 14                           # harness §7: readings and no failure this long is a candidate for silent; `status --section permits`

