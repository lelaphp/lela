[[item]]
mahout = "semantics::engine_limitation"
sites = 15
crates = 7
status = "gone"
rule = "gone, decided 2026-09-07. php has no engine-limitation error, so no witness can pin one. The 15 sites: 10 (curl 4, iconv 3, mbstring 2, dom 1) disappear with the C bindings the design chooses over pure Rust; 2 (SplPriorityQueue::compare override, PhpToken __get override) exist only because Mahout could not re-enter user code from those positions, which call::call and the object handlers provide; 3 (RegexIterator GET_MATCH/ALL_MATCHES/SPLIT, unpack non-integer codes, htmlspecialchars non-UTF-8 charsets) are unported behaviour, and a native without it fails its own witness against the oracle, which proposes an open divergence row that fails done until the behaviour is ported or a person accepts the row. No api item, no interim raise."

