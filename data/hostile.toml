# The hostile corpus (harness row H15, #4265): PHP programs whose error
# handler disturbs the opline that raised the diagnostic, mid-step, each held
# to the oracle by `cargo xtask hostile`. Read by `xtask hostile` and its
# tests and by nothing else.
#
# One `[[program]]` per program. `id` names it for good: a kept run's
# verdict, a `hostile:<id>` a `trace:` row covers and the reading's message
# all name it by its id, so an id is never given to another program. `form`
# is what the handler does to the step's operands, one of
#   grows     it adds entries to a table the step reads or writes: the symbol
#             table, an array, an object's properties
#   unsets    it unsets the container or an operand the step holds
#   replaces  it assigns over the container or an operand, freeing what stood
#   throws    it throws, so the step ends partway
# `from` says where a program was taken from, where it was taken. `code` runs
# as a witness's snippet does, with `<?php` on the line above it.
#
# Every program here the pinned php completes normally, its exit and output
# defined, both plainly and with freed memory scribbled (USE_ZEND_ALLOC=0,
# MallocScribble=1). A candidate it does not complete stays out of this file,
# and its record is kept apart from this repository. No seeds: the corpus is
# what is written here.

[[program]]
id = "kernel-serve-closure"
form = "throws"
from = "a witness of php_engine's serve_closure"
code = '''
class D { function __destruct() { echo "d\n"; } }
set_error_handler(function () { throw new Exception('x'); });
$d = new D;
$f = function (array &$r) use ($d) {};
unset($d);
try { call_user_func($f, 'v'); } catch (Exception $e) { echo "caught\n"; }
unset($f);
echo "end\n";
'''

