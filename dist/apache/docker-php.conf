# php's official image's docker-php.conf, with php-fpm as the handler where
# it names mod_php's application/x-httpd-php. The handler is set only for a
# file that exists, so a missing script is Apache's 404, as under mod_php,
# and not php-fpm's "File not found.".
<FilesMatch \.php$>
	<If "-f %{REQUEST_FILENAME}">
		SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
	</If>
</FilesMatch>

DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory /var/www/>
	Options -Indexes
	AllowOverride All
	# mod_php sees the Authorization header (PHP_AUTH_*, HTTP_AUTHORIZATION);
	# a FastCGI backend sees it only when Apache passes it.
	CGIPassAuth On
</Directory>
