; The pool Apache hands .php files to. Run as root, the master serves as
; www-data, as Apache's children do; run as another user, php-fpm ignores
; `user` and `group` and serves as that user.
[www]
user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; mod_php under prefork runs as many requests at once as Apache has
; children; this is the ceiling on php's side. Raise it with
; a conf file of your own in php-fpm.d (later files win).
pm = dynamic
pm.max_children = 32
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; getenv() sees the container's environment, as under mod_php.
clear_env = no

; A script's writes to stderr reach the container's stderr undecorated.
catch_workers_output = yes
decorate_workers_output = no

; error_log() and php's errors reach the container's stderr once, through
; php-fpm's log, and not a second time through Apache's proxy_fcgi.
php_admin_flag[fastcgi.logging] = off
