; php-fpm behind Apache in the dax-php apache image. Errors go to the
; container's stderr, as mod_php's go to Apache's error log, which is
; stderr in php's image. Pools are in php-fpm.d, as php's fpm image has them.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

include = /usr/local/etc/php-fpm.d/*.conf
