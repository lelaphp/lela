# The workspace (third-engine-design.md §4.2): members are `crates/*`, `ext/*`,
# `sapi/*` (ADR-0008) and `xtask`. Every directory under the three globs is a
# crate, since cargo refuses one that holds no `Cargo.toml`, so `xtask new-ext`
# lays an extension down and writes nothing here (#4458).
[workspace]
resolver = "3"
members = ["crates/*", "ext/*", "sapi/*", "xtask"]

# On macOS the dev profile's default, `split-debuginfo = "unpacked"`, keeps
# every codegen unit's object in target/debug/deps for its debuginfo, under a
# name new to each incremental build, and nothing removes the old ones: a
# worktree's target reached 36G in a day (#839). Packed, rustc gathers the
# debuginfo into a .dSYM beside each binary (dsymutil; on Linux, split DWARF
# into a .dwp) and deletes the objects. Line tables alone keep dsymutil as
# fast as the link it follows, so a rebuild costs what it did: a backtrace
# keeps every frame's file and line, and lldb breaks on a file and line but
# shows no variables. `CARGO_PROFILE_DEV_DEBUG=full` builds with them.
[profile.dev]
split-debuginfo = "packed"
debug = "line-tables-only"
incremental = false  # rustc's incremental cache was ~70% of a checkout's target/; off, a worktree builds in ~12G, not ~39G (#1609)

# The third-party crates the harness spends its time in, optimised in the
# dev profile `cargo xtask` runs: a sample of `xtask unsafe-audit` put about
# three quarters of its stacks in sha1_smol at opt-level 0, hashing a
# reading's key, and the store's readers spend theirs in serde_json (#2162).
# They build once and stay cached, so the edit loop pays nothing for them;
# `xtask` itself stays at 0, so a harness edit rebuilds as fast as before.
[profile.dev.package.sha1_smol]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.serde]
opt-level = 3
[profile.dev.package.toml]
opt-level = 3
[profile.dev.package.regex-lite]
opt-level = 3
[profile.dev.package.syn]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

# The correctness lanes' build (harness-design.md §7, revision 82; #1994):
# release's optimisation with debug assertions and overflow checks on, so
# what `cfg(debug_assertions)` guards runs over the whole corpus at about
# release's cost. Cargo applies a profile to every crate of the graph, so
# the dependencies take both checks as well, and std's inlined `ub_checks`
# preconditions follow the crate that inlines them; std's own compiled code
# is the toolchain's release build either way. Thin LTO and a single
# codegen unit are left to release: they buy the bench lane and the shipped
# binaries speed a lane does not read, at the cost of the build. The
# harness names the profile once, as `LANE` in xtask/src/oracle/profile.rs.
[profile.release-da]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

# Design §10: pedantic on with a short, reasoned allow list; the no-panic
# lints are per-crate (`seams.toml` rule `lints.no-panic`, xtask exempt).
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"   # `manifest::Manifest`, `reading::Reading` are the names the design uses
missing_errors_doc = "allow"        # every Result here is anyhow with context; the doc would say "on failure"
must_use_candidate = "allow"        # the harness's constructors are not misused by discarding
# An owner is handed on or given up, never dropped in silence (design §5.1,
# #1980): `let _ =` on a must-use value and `mem::forget` are refused. A
# discard that is meant names itself, so a reader sees it.
let_underscore_must_use = "warn"
mem_forget = "warn"

# The same rule for a value with a `Drop`: `_ = x` lowers to `let _ = x`,
# and an `Owner` has a `Drop` under debug assertions, so an owner discarded
# by either spelling fails `xtask clippy`, after a brace, a semicolon or a
# closure's bars as well as at a line's start (#2201).
[workspace.lints.rust]
let_underscore_drop = "warn"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }  # php_unit: the linked class record's index by name, a `HashTable` of row positions (#2169); already in the lock under indexmap
regex-lite = "0.1"                  # permit's deny_pattern; one package, no dependencies
sha1_smol = "1"                     # git blob ids for the stamp's tree hash, in process; one package, no dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
syn = { version = "3", features = ["full", "visit"] }
quote = "1"                         # php_macros: the expansion as tokens (ADR-0007); already in the lock under syn
proc-macro2 = "1"                   # php_macros: tokens outside a macro invocation, for its own tests; already in the lock under syn
md5 = "0.8"
libc = "0.2"                        # the platform's headers, for `php_heap`'s probe of the thread's bounds (design §4.1)
cranelift-codegen = { version = "0.135.6", default-features = false, features = ["core", "x86", "arm64"] }  # php_jit::lower: a trace's CLIF to final bytes for x86-64 and aarch64, the core set #2945 ruled with the ceiling of 190 (jit-design.md §4.3, §6)
cranelift-frontend = { version = "0.135.6", default-features = false, features = ["core"] }  # php_jit::lower: the FunctionBuilder a trace is laid down with, in #2945's core set
cranelift-native = { version = "0.135.6", default-features = false, features = ["core"] }  # php_jit::lower: the host ISA and its features, `Backend::new`'s lookup, in #2945's core set
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "mm"] }  # php_jit::table::code on Linux: the memfd, its seals and its two mappings (jit-design.md §4.4, §6), as #2945 ruled; adds itself and linux-raw-sys
nix = { version = "0.31", default-features = false }  # ext/posix and ext/pcntl: the process, its credentials, its signals and the user database (design §7.2, revision 35)
corosensei = "0.3"                  # a fiber's machine stack and the switch onto it, in `php_heap` (design §4.1, §5.11)
cc = "1"                            # ext/date's build.rs compiles the vendored timelib (design §7.2, §12)
expect-test = "1.5"                 # the parser's snapshot fixtures, regenerated once per file (record §4.9), and the compiler's and the unit format's dump snapshots (#3102)
sha2 = { version = "0.11", default-features = false }  # ext/hash: `compress256` and `compress512` under php's own SHA-2 contexts (design §7.2)
keccak = "0.2"                      # ext/hash: Keccak-f[1600] under php's SHA-3 sponge (design §7.2)
twox-hash = { version = "2", default-features = false, features = ["alloc", "xxhash3_64", "xxhash3_128"] }  # ext/hash: xxh3 and xxh128, which php cannot serialise (design §7.2)
pcre2-sys = "0.2.10"                # libpcre2-8 with its JIT, the keg the oracle links, found through pkg-config and never vendored; the crate's declarations (design §7.2, #624, #717, `.cargo/config.toml`'s LIBPCRE2_8_STATIC)
pkg-config = "0.3"                  # ext/libxml's build.rs finds the platform's libxml2 (design §7.2, #731)
libsqlite3-sys = { version = "0.39", features = ["bundled_bindings"] } # ext/pdo_sqlite: the platform's libsqlite3, the keg the oracle links, found through pkg-config and never vendored; the crate's prebuilt declarations, no bindgen (design §7.2, #1510, `.cargo/config.toml`'s SQLITE3_LIB_DIR)
libz-sys = { version = "1.1", default-features = false, features = ["libc"] }  # ext/zlib: the platform's zlib, whose deflate bytes are the oracle's at every level (design §7.2, revision 34; #950)
libbz2-rs-sys = { version = "0.2.5", default-features = false, features = ["rust-allocator"] }  # ext/bz2: libbzip2 ported to Rust, whose bytes are the oracle's libbz2 1.0.8's at every block size and work factor (design §7.2, revision 39; #1116)
openssl-sys = "0.9"                # ext/openssl: the platform's libcrypto, found through pkg-config and never vendored, bound on the oracle's machine to the keg the oracle loads (design §7.2; #1108, #3414)
curl-sys = { version = "0.4.90", default-features = false, features = ["upkeep_7_62_0"] }  # ext/curl: the declarations of the platform's libcurl, the one the oracle links, which ext/curl's build.rs holds it to and never lets it vendor (design §7.2; #1332)
mysql_common = { version = "0.38", default-features = false }  # ext/mysqlnd: the MySQL wire protocol's packet types and scrambles, no I/O; mysqlnd ported over it, every read and write through the engine's streams (#1345)
flate2 = { version = "1", default-features = false, features = ["zlib"] }  # ext/mysqlnd: the compressed protocol's envelopes, over the locked libz-sys (#1345)
bzip2 = "0.6"                       # ext/zip: BZIP2 entries read and written over libbz2-rs-sys
aes = "0.9"                         # ext/zip: WinZip AES entries read and written
hmac = "0.13"                       # ext/zip: WinZip AES's authentication code
pbkdf2 = "0.13"                     # ext/zip: WinZip AES's key derivation
sha1 = { version = "0.11", default-features = false }  # ext/zip: WinZip AES's HMAC-SHA1
crc32fast = "1.5"                   # ext/zip: an entry's CRC-32
getrandom = { version = "0.4", features = ["std"] }  # ext/zip: the salt and the PKWARE header an encrypted entry is written with
hyper = { version = "1.7", default-features = false, features = ["server", "http1"] }  # sapi/makala: the production server's HTTP/1.1 framing, RFC 9112's Transfer-Encoding and Content-Length rules, no parser of our own (#2337, #2333)
hyper-util = { version = "0.1.17", default-features = false, features = ["tokio"] }  # sapi/makala: hyper's sockets on tokio (#2337)
httpdate = "1.0"                    # sapi/makala: the `Date` of the 408 the server writes past hyper, the crate hyper dates its own responses with, so no package is added (#2341)
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "time", "sync", "signal"] }  # sapi/makala: the connection side's one-thread runtime, the bounded channels between it and the request threads (#2337), and the SIGTERM that begins its drain (#2344)
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }  # sapi/makala: TLS 1.2 and 1.3 at the edge, its aws-lc-rs provider and X25519MLKEM768 first, as #2333 ruled; no TLS before 1.2, no renegotiation (#2343)
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }  # sapi/makala: rustls over the connection side's tokio sockets (#2343)
