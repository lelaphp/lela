# The workspace (third-engine-design.md §4.2): members are `crates/*`, `ext/*`
# and `xtask`. The globs are listed as each crate is created; cargo refuses a
# glob that matches a directory without a manifest, and `crates/php_ext` holds
# only `api.lock` today.
[workspace]
resolver = "3"
members = ["crates/*", "xtask", "ext/standard", "ext/spl", "ext/date", "ext/reflection", "ext/pcre", "ext/mbstring", "ext/session", "ext/pdo", "ext/dom", "ext/random", "ext/pdo_mysql", "ext/filter", "ext/tokenizer", "ext/json", "ext/openssl", "ext/curl", "ext/iconv", "ext/pdo_sqlite", "ext/ctype", "ext/hash"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

# Design §10: pedantic on with a short, reasoned allow list; the no-panic
# lints are per-crate (`seams.toml` rule `lints.no-panic`, xtask exempt).
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"   # `manifest::Manifest`, `reading::Reading` are the names the design uses
missing_errors_doc = "allow"        # every Result here is anyhow with context; the doc would say "on failure"
must_use_candidate = "allow"        # the harness's constructors are not misused by discarding

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex-lite = "0.1"                  # permit's deny_pattern; one package, no dependencies
sha1_smol = "1"                     # git blob ids for the stamp's tree hash, in process; one package, no dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
syn = { version = "3", features = ["full", "visit"] }
md5 = "0.8"
libc = "0.2"                        # the platform's headers, for `php_heap`'s probe of the thread's bounds (design §4.1)
corosensei = "0.3"                  # a fiber's machine stack and the switch onto it, in `php_heap` (design §4.1, §5.11)
expect-test = "1.5"                 # the parser's snapshot fixtures, regenerated once per file (record §4.9)
pcre2-sys = "0.2.10"                # libpcre2-8 with its JIT, built from the crate's bundled source (design §7.2, `.cargo/config.toml`'s PCRE2_SYS_STATIC)
