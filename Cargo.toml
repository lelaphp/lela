# The workspace (third-engine-design.md §4.2): members are `crates/*`, `ext/*`
# and `xtask`. The globs are listed as each crate is created; cargo refuses a
# glob that matches a directory without a manifest, and `crates/php_ext` holds
# only `api.lock` today.
[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
