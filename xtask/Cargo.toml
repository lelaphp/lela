[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The harness: instruments, readings and the one renderer (harness-design.md §4)"

[lints]
workspace = true

[build-dependencies]
sha1_smol.workspace = true          # the digest of seams.toml this build is compiled against (src/built.rs)

[dependencies]
# The in-process adapter of design §8's `ScriptExec` seam (§4.2: the harness
# reaches the engine through the bundle): the enabled set, the tier's name and
# a fresh engine of them over the `Capture` sink, which `witness` serves a
# snippet through where no binary is built. Every extension feature the
# bundle declares is on, so the linked engine carries the twenty extensions
# the oracle has and a crate the manifest marks `feature =` is held to its
# witnesses on its merits (harness §7, revision 43); the `feature =` rows
# name php's default build for the binary and the phpt lane alone. `pcntl` is
# the one extension it does not carry: a fence that forks or takes a signal is
# marked `process` and served by the `php` binary in a process of its own, so
# nothing forks the harness, and an unmarked one fails on the undefined function
# rather than forking it (harness §8, revision 61).
# `witness-trace` records the natives each fence enters, which is what
# witness coverage counts (harness §4.5 condition 2, revision 58).
php_bundle = { path = "../crates/php_bundle", features = [
    "test", "witness-trace",
    "standard", "spl", "date", "reflection", "pcre", "mbstring", "session",
    "pdo", "dom", "random", "pdo_mysql", "filter", "tokenizer", "json",
    "openssl", "curl", "iconv", "pdo_sqlite", "ctype", "hash", "libxml",
    "lexbor", "zlib", "posix", "sockets", "phar", "bz2", "uri",
] }

anyhow.workspace = true
clap.workspace = true
# The oracle module's runner kills a program's process group whole, so what a
# test started goes with it (harness §4.3, #1211).
nix = { workspace = true, features = ["signal"] }
regex-lite.workspace = true
sha1_smol.workspace = true
md5.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
syn.workspace = true
