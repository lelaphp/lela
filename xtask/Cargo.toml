[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license = "MIT"
rust-version.workspace = true
publish = false
description = "The harness: instruments, readings and the one renderer (harness-design.md §4)"

# `xtask test` runs these test executables side by side: each lays
# what it writes down in trees of its own (`scratch::Tree`), so none shares
# a store, a port or a System V key with another. One path is shared: the
# workspace's own `target/debug`, which compile_identity builds `php` into
# and worktree and permit copy whole, so the three hold one key. Those
# three, phpt and new_sapi build with cargo or serve the engine inside a
# test, about two minutes of a run, so `--staged` runs each only where a
# path of its own is staged; `done` asks the whole run.
[package.metadata.xtask.test]
executables = "side-by-side"
apart = { compile_identity = ["target"], worktree = ["target"], permit = ["target"] }
own.compile_identity = ["src/compile_identity", "tests/compile_identity.rs", "fixtures/compile-identity", "tests/common"]
own.worktree = ["src/worktree.rs", "tests/worktree.rs", "tests/common"]
own.permit = ["src/permit", "tests/permit.rs", "fixtures/rules", "fixtures/approval", "tests/common"]
own.phpt = ["src/phpt", "tests/phpt.rs", "fixtures/phpt", "tests/common"]
own.new_sapi = ["src/new_sapi.rs", "tests/new_sapi.rs", "fixtures/new-sapi", "tests/common"]

[lints]
workspace = true

[build-dependencies]
sha1_smol.workspace = true          # the digest of seams.toml this build is compiled against (src/built.rs)

[dependencies]
# No engine crate (harness §8, revision 84): the witness and
# crosscheck lanes serve a snippet through `lela-linked`, `sapi/cli` built
# with the bundle's `linked` set, which this harness builds and starts as a
# process; so an edit under `crates/` or `ext/` rebuilds that binary and
# never this one, which every hook runs.
anyhow.workspace = true
clap.workspace = true
# The oracle module's runner kills a program's process group whole, so what a
# test started goes with it (harness §4.3); phpt's System V sweep reads
# the runner's user by name, as `ipcs` prints an object's creator; the linked
# adapter waits on a server's answer by `poll`, for no longer than the limit.
nix = { workspace = true, features = ["poll", "signal", "user"] }
regex-lite.workspace = true
sha1_smol.workspace = true
md5.workspace = true
sha2.workspace = true               # a variant's macOS build names the digest of the [closure] it was made against
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
syn.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }   # the line of a test-level return clippy's reading names
# The lanes, each the pure part of one, with a ceiling of its own so the
# lines ruled for it cannot be spent by other harness work; the adapter
# under src/ runs, compares and records, and calls them (ruled 2026-10-31;
# design revision 185).
php_lanes_differential = { path = "../lanes/differential" }
php_lanes_framework = { path = "../lanes/framework" }
php_lanes_fuzz = { path = "../lanes/fuzz" }
php_lanes_packages = { path = "../lanes/packages" }

[dev-dependencies]
# tests/new_sapi.rs: a stand-in's parameter types as written, held to the
# real facade's; already in the lock under syn.
quote.workspace = true
