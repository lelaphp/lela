# A fixture of #2165: nine crates measured in one cargo run. php_heap is
# clean; php_unit carries a clippy lint; php_syntax is built on php_unit;
# php_compile does not compile; php_engine is built on php_compile;
# php_macros is a proc-macro crate with a test; php_link is clean but for
# a lint behind its feature `gated` (#140). Each
# crate's reading out of the one run is the reading a run over it alone
# gives, so a crate's lint or compile error is its own and the ones built
# on it are judged on what they are. sapi/cli turns php_heap's `loud` on
# and sapi/makala does not; each one's test starts its binary and holds it
# to its own, so a run that builds makala's binary under cli's features
# fails makala (#2606).
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "php_heap"
budget = 100

[[crate]]
name = "php_unit"
budget = 100

[[crate]]
name = "php_syntax"
budget = 100

[[crate]]
name = "php_compile"
budget = 100

[[crate]]
name = "php_engine"
budget = 100

[[crate]]
name = "php_macros"
budget = 100

[[crate]]
name = "php_link"
budget = 100

[[crate]]
name = "sapi/cli"
budget = 100

[[crate]]
name = "sapi/makala"
budget = 100
