[package]
name = "php_heap"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# A target built only with a feature, as `sapi/cli`'s `php-linked` is: a
# test run, which turns on no feature, builds the crate whole without it,
# and a clippy run, under every feature, lints it (#140).
[features]
extra = []
# Turned on by the fixture's `sapi/cli` and not by its `sapi/makala`
# (#2606).
loud = []

[[bin]]
name = "heap-extra"
path = "src/extra.rs"
required-features = ["extra"]
