[package]
name = "php_heap"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# A target built only with a feature no run turns on, as the hosts'
# `*-witness` binaries are: the crate is whole without it.
[features]
extra = []

[[bin]]
name = "heap-extra"
path = "src/extra.rs"
required-features = ["extra"]
