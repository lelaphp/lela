# A negative-control fixture (harness-design.md §4.1): a workspace that must
# fail the instrument named by its directory. The pin is the real one, by path.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "php_unit"
budget = 1000

# No `allow` here: the test that lists files adds it to a copy.
[[rule]]
id = "licence.header"
scope = ["crates/**", "ext/**", "sapi/**"]
check = "licence-header"
text = "A file's expression is MIT AND BSD-3-Clause, and MIT alone only where the rule's allow names its path."
