# A negative-control fixture (harness-design.md §4.1): a workspace that must
# fail the instrument named by its directory. The pin is the real one, by path.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "php_unit"
budget = 1000

# The three files that state an expression are listed; the test that lists
# other paths writes its own list into a copy.
[[rule]]
id = "licence.header"
scope = ["crates/**", "ext/**", "sapi/**"]
check = "licence-header"
allow = ["crates/php_unit/src/alone.rs", "crates/php_unit/src/listed.rs", "crates/php_unit/src/wide.rs"]
text = "The expression of a file the rule's allow names is MIT AND BSD-3-Clause and what its row of THIRD-PARTY.md adds."
