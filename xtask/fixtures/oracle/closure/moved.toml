# A negative control (#2935): the grammar's least pin with a [closure], and a
# macOS build made against `zstd = "1.5.6"`, the record before zstd's bump,
# whose digest is no longer the pin's [closure]'s. `Pin::load` must refuse it
# (xtask/tests/variant.rs).
[oracle]
version = "8.5.9"
path = "/nowhere/php"
md5 = "00000000000000000000000000000000"

[source]
tag = "php-8.5.9"
commit = "dd6e76cc"
path = "/nowhere/php-src"
phpt_files = 0

[recipe]
script_name = "witness.php"
preamble = "<?php\n"
args = ["-n"]
ini = []
env_clear = true

[recipe.limits]
timeout_s = 60

[recipe.normalise]
crlf_to_lf = true
trim = " \t\n\r\u0000\u000B"
scratch_token = "%SCRATCH%"

[closure]
zstd = "1.5.7_1"

[variant.closure]
flags = ["--enable-zend-test"]
darwin-arm64 = { path = "php", md5 = "00000000000000000000000000000000", closure = "sha256:f3f950ce43447203da79ea7a1a4391bdbdc1963bf63528f58b46da443e68e2b8" }
