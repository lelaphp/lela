# The pinned oracle's configure line, as `php -n -i`'s "Configure Command"
# row prints it, for `oracle propose`'s test (#4384).
sha256 = "{sha256:php}"
args = [
    "--prefix=/opt/homebrew/Cellar/php@9.1/9.1.2_1",
    "--with-pear=/opt/homebrew/Cellar/php@9.1/9.1.2_1/share/php@9.1/pear",
    "--enable-bcmath",
    "PKG_CONFIG_PATH=/opt/homebrew/opt/zip/lib/pkgconfig:/opt/homebrew/opt/zstd/lib/pkgconfig",
    "CFLAGS=-O2 -g",
    "LDFLAGS=say \"hi\"",
]
