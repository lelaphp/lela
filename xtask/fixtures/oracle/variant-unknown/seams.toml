# A negative control (harness-design.md §4.1, §12 item 4; #1890): a
# workspace whose one crate `witness`, `crosscheck` and `phpt` must fail.
# The pin is the real one, by path, and the crate's [[crate]] row names an
# oracle variant it carries no [variant.<name>] for, so its lanes have no
# oracle to read it under.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "ext/pcre"
budget = 1000
oracle = "no-such-variant"
