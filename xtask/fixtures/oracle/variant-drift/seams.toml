# A negative control (harness-design.md §4.1, §12 item 4; #1890): a
# workspace whose one crate is read under an oracle variant whose binary's
# SHA-256 is not the pin's, which `witness`, `crosscheck` and `phpt` must refuse
# as they refuse the main oracle's drift. The pin is the fixture's own.
[oracle]
pin = "oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "ext/pcre"
budget = 1000
oracle = "drift"
