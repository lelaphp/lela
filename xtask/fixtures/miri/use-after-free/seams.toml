# A negative control (harness-design.md §4.1, §12 item 4): a workspace that
# must fail the instrument named by the directory above it. The pin is the
# real one, by path.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "php_heap"
budget = 1000

# What a run with no crate named takes (#3206).
[[owed]]
instrument = "miri"
crates = ["php_heap"]
