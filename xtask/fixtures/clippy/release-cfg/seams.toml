# A fixture of #2392: php_heap is clean in the dev profile and carries an
# `unused_mut` in release, where the debug-only line that needed the `mut`
# is gone; php_unit names `debug_assertions` only in a comment and a
# string, so it is linted in dev alone; php_syntax splits and is clean on
# both sides.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "php_heap"
budget = 100

[[crate]]
name = "php_unit"
budget = 100

[[crate]]
name = "php_syntax"
budget = 100
