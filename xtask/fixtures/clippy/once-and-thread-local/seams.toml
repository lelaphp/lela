# A negative-control fixture (harness-design.md §4.1): a workspace that must
# fail the instrument named by its directory. The pin is the real one, by path.
# The ext.no-locks row is the one #1781 ruled, word for word: clippy, under
# the ext/clippy.toml it renders, refuses the once type of once.json and the
# thread-local of thread-local.json, and permit denies both writes; allow.json
# is the neighbour both let through. The Cargo.lock holds no package, so the
# two package wildcards render as the comment that says so.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[rule]]
id = "ext.no-locks"
scope = "ext/*"
deny_types = ["std::sync::Mutex", "std::sync::RwLock", "std::cell::Cell", "std::cell::RefCell", "std::sync::atomic::*", "parking_lot::*",
              "std::sync::Once", "std::sync::OnceLock", "std::sync::LazyLock", "std::cell::OnceCell", "std::cell::LazyCell", "once_cell::*"]
deny_macros = ["std::thread_local"]
adr = "0005"
text = "Extension state is request-scoped, immutable engine-scoped or process-scoped (ADR-0005, ADR-0010); no lock, cell, once or thread-local in ext/*. Cross-request caching is api::Cache."

[[rule]]
id = "generated.committed"
generated = ["ext/clippy.toml"]
text = "ext/clippy.toml is generated and committed; a stale copy fails budget (fixture)."
