# A negative-control fixture (harness-design.md §4.1): an [[owed]] row the
# reader must refuse, read after a manifest's least table. It names the predicate `phpt-lane`, which the harness does
# not derive,
# and the refusal names it (#3206).
[[owed]]
instrument = "phpt"
crates = "*"
when = "phpt-lane"
