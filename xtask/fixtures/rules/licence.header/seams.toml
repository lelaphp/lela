# A negative-control fixture (harness-design.md §4.1): a workspace that must
# fail the rule named by its directory. The pin is the real one, by path.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "php_unit"
budget = 1000

[[rule]]
id = "licence.header"
scope = ["crates/**", "ext/**", "sapi/**"]
exempt = ["crates/php_unit/vendored/**"]
check = "licence-header"
allow = ["crates/php_unit/src/held.rs", "crates/php_unit/src/two_lines.rs", "crates/php_unit/src/shim.c"]
text = "A Rust, C or C++ file under crates/, ext/ or sapi/ states no licence where it begins, and one the rule's allow names begins with the four lines of the licence header and an empty one."
remedy = "take the licence lines off a file the list does not name, and begin one it names with the four lines"
