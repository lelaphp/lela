# A negative-control fixture (harness-design.md §4.1): a workspace that must
# fail the instrument named by its directory. The pin is the real one, by path.
# The fork.threads row #1950 ruled: `generate` renders it to
# crates/clippy.toml's disallowed-methods, and clippy, under that file and
# with every warning denied as the `clippy` instrument runs it, refuses the
# call each `<path>.rs` beside this file makes, however it is imported, and
# passes home.rs, the one call the home makes under its #[expect].
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[rule]]
id = "fork.threads"
scope = "crates/*"
deny_methods = ["php_process::fork::fork", "std::thread::spawn", "std::thread::Builder::spawn", "std::thread::scope",
                "libc::fork", "libc::vfork", "nix::unistd::fork", "nix::unistd::daemon"]
adr = "0010"
text = "A process forks through php_engine's one home alone (fixture)."

[[rule]]
id = "generated.committed"
generated = ["crates/clippy.toml"]
text = "crates/clippy.toml is generated and committed (fixture)."
