# A negative-control fixture (harness-design.md §4.1): a workspace that must
# fail the instrument named by its directory. The pin is the real one, by path.
# Its one rule reads one heading of the glossary beside it, the grammar #63
# proposes for the harness: `avoid_from = { file, section }`.
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "xtask"
budget = 1000

[[rule]]
id = "vocab.harness"
scope = "xtask"
avoid_from = { file = "CONTEXT.md", section = "Harness" }
text = "The Harness section's _Avoid_ words appear in no public item name or rustdoc prose of the harness (fixture)."
