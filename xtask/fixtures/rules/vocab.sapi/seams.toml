# A negative-control fixture (harness-design.md §4.1): a workspace that must
# fail the instrument named by its directory. The pin is the real one, by path.
# Its one rule holds the host crates to the whole glossary beside it, as
# `vocab.avoid` holds an engine or extension crate (#3632).
[oracle]
pin = "../../../../oracle.toml"
[budget]
total = 1000
new = 1000
docs = 1000
harness = 1000
lock_packages = 1000
clean_build_release_s = 1000
api_items = 1000
bindings = 1000

[[crate]]
name = "sapi/cli"
budget = 1000

[[rule]]
id = "vocab.sapi"
scope = "sapi/*"
avoid_from = "CONTEXT.md"
text = "The glossary's _Avoid_ words appear in no public item name or rustdoc prose of a host (fixture)."
