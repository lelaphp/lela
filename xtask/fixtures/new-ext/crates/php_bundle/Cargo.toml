# The fixture's bundle, shaped as crates/php_bundle is: `new-ext` appends
# the optional dependency, the feature and the `enabled()` line here.
[package]
name = "php_bundle"
version = "0.0.0"
edition = "2024"

[features]
default = []
# The set every host links; `new-ext` lists each crate here too.
host = []
# The engine the harness links, built of the two.
linked = ["default", "host"]
# A name that enables nothing until php_jit exists.
jit = []

# The facade, and the extensions as `new-ext` adds them.
[dependencies]
php_ext = { path = "../php_ext" }

[lints]
workspace = true
