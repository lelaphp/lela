# The fixture workspace: the facade is a member; `new-ext` adds the crate it lays down.
[workspace]
resolver = "3"
members = ["crates/php_ext", "crates/php_bundle"]

[workspace.package]
edition = "2024"
license = "MIT AND BSD-3-Clause"
rust-version = "1.95"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
