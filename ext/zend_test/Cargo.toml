# ext/zend_test: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_zend_test"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The zend_test extension, php-src/ext/zend_test"

[lints]
workspace = true

# The facade; the engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# ext/standard, whose `php_var_export_ex` the observer writes a return
# value with (`ext/standard/php_var.h`), and whose `UriParser` is
# `php_uri_get_parser` with its `parse_url` arm (design §4.10).
php_ext_standard = { path = "../standard" }
# ext/libxml, whose binding of libxml2 `test.c` sets the library's
# process defaults through (`<libxml/globals.h>`, design §4.10).
php_ext_libxml = { path = "../libxml" }
# ext/uri, whose `php_uri.h` types `zend_test_uri_parser` reads a parse
# in, the parsers named through ext/standard's `UriParser` (design §4.10).
php_ext_uri = { path = "../uri" }
# `raise(3)` and the signal mask, for `zend_test_crash`'s `SIGSEGV`, in
# `src/ffi/` alone (`unsafe.homes`).
libc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }

# `zend_test_crash`'s end, its process this test's own `main` (#2976).
[[test]]
name = "crash"
harness = false
