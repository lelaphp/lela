# ext/pdo_sqlite: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_pdo_sqlite"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The pdo_sqlite extension, php-src/ext/pdo_sqlite"

[lints]
workspace = true

# The facade, and `pdo`, whose driver face this crate implements, as
# `ZEND_MOD_REQUIRED("pdo")` has it (design §4.10). The engine is out of
# reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_pdo = { path = "../pdo" }
# The platform's libsqlite3, the keg the oracle links, found through
# pkg-config and never vendored (design §7.2, #1510), bound in `src/ffi/`
# alone (`unsafe.homes`).
libsqlite3-sys = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# session, and standard below it, for the save handler that writes through
# a persistent link in session's `RSHUTDOWN` (#1695).
php_ext_session = { path = "../session" }
php_ext_standard = { path = "../standard" }
