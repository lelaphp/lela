# ext/dba: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_dba"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The dba extension, php-src/ext/dba"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# The ndbm handler over the C library's `<ndbm.h>` in `src/ffi/` alone, the
# platform's ndbm the oracle links (design §7.2); `mode_t` and the
# `open(2)` flags from here.
libc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# session, and standard below it, for the save handler that writes through
# a persistent link in session's `RSHUTDOWN`.
php_ext_session = { path = "../session" }
php_ext_standard = { path = "../standard" }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
