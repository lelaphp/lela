# ext/pdo_mysql: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_pdo_mysql"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The pdo_mysql extension, php-src/ext/pdo_mysql"

[lints]
workspace = true

# The facade; `pdo`, whose connector face this crate implements, and
# `mysqlnd`, whose driver it connects through, as `pdo_mysql.c` includes
# `ext/pdo/php_pdo_driver.h` and `ext/mysqlnd/mysqlnd.h` and requires both
# (design §4.10). The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_pdo = { path = "../pdo" }
php_ext_mysqlnd = { path = "../mysqlnd" }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# session, and standard below it, for the save handler that writes through
# a persistent link in session's `RSHUTDOWN`.
php_ext_session = { path = "../session" }
php_ext_standard = { path = "../standard" }
# spl, which php always has and pdo requires (`ZEND_MOD_REQUIRED("spl")`),
# for the engines that carry pdo (tests/capture.rs says why).
php_ext_spl = { path = "../spl" }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_json = { path = "../json" }
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
