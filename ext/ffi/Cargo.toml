# ext/ffi: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_ffi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The ffi extension, php-src/ext/ffi"
links = "ffi"

[lints]
workspace = true

# The facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `dlopen`, `dlsym`, `dlclose` and `dlerror` for `FFI::cdef($code, $lib)`
# and `FFI::load`, and `calloc`, `free` and `memcmp` for the C memory a
# `FFI\CData` owns, in `src/ffi/` alone (`unsafe.homes`).
libc = { workspace = true }

# libffi is the platform's, as the oracle links `/usr/lib/libffi.dylib`:
# found through `pkg-config libffi`, the SDK's `ffi.h`, and declared by
# hand in `src/ffi/`, no bindgen (design §7.2, revision 75).
[build-dependencies]
pkg-config = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# ext/standard for the natives a callback another thread calls is served
# around: `usleep`, `proc_open` and `proc_close`, `set_time_limit` and
# `hrtime`.
php_ext_standard = { path = "../standard" }
# ext/sockets for `socket_read`, a wait a callback closes its socket in.
php_ext_sockets = { path = "../sockets" }
# ext/uri and ext/lexbor, which ext/standard declares required (`standard_deps`).
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
