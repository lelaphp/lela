# ext/libxml: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_libxml"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The libxml extension, php-src/ext/libxml"
# The one crate that links libxml2, which ext/dom reaches through it.
links = "xml2"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `php_image.h`'s handler, which `image_svg.c` registers with `standard`
# (design §4.10).
php_ext_standard = { path = "../standard" }

# libxml2 is the platform's, found through `pkg-config libxml-2.0` (design
# §7.2) and bound in `src/ffi/` alone (`unsafe.homes`).
[build-dependencies]
pkg-config = { workspace = true }
# php's C-variadic generic handler, `src/ffi/generic.c`.
cc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
