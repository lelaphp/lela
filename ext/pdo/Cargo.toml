# ext/pdo: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_pdo"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The pdo extension, php-src/ext/pdo"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# spl, which php always has and pdo requires (`ZEND_MOD_REQUIRED("spl")`),
# for the engines that carry pdo with a connector.
php_ext_spl = { path = "../spl" }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_json = { path = "../json" }
