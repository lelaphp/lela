# ext/session: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_session"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The session extension, php-src/ext/session"

[lints]
workspace = true

# The facade, and ext/standard for what `session.c` includes of it:
# `php_var_serialize` and `php_var_unserialize` (`php_var.h`) with the
# var hash one decode shares, ADR-0004's edge where php-src includes the
# other extension's headers. The engine is out of reach (`[[edge]]`
# ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_standard = { path = "../standard" }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
