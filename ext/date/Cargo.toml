# ext/date: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_date"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The date extension, php-src/ext/date"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }

# timelib, compiled from `lib/`, the sources vendored from php-src's
# `ext/date/lib` at the pinned tag (design §7.2, §12); no system library.
[build-dependencies]
cc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
