# ext/date: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_date"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The date extension, php-src/ext/date"

[lints]
workspace = true

# The facade, and timelib's binding. The engine is out of reach
# (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# timelib, vendored and compiled in its own crate (design §7.2), and
# wrapped here in `src/ffi/`.
timelib_sys = { path = "../../crates/timelib_sys" }
# `strftime(3)`, under the request's locale, in `src/ffi/` alone
# (`unsafe.homes`).
libc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
