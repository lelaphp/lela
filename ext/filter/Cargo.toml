# ext/filter: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_filter"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The filter extension, php-src/ext/filter"

[lints]
workspace = true

# The facade, and ext/standard for what `sanitizing_filters.c` includes
# of it: `php_strip_tags_ex` (`php_string.h`) and
# `php_escape_html_entities_ex` (`html.h`), ADR-0004's edge where php-src
# includes the other extension's headers. The engine is out of reach
# (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_standard = { path = "../standard" }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
