# ext/pcre: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_pcre"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The pcre extension, php-src/ext/pcre"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# libpcre2-8 with its JIT (design §7.2), bound in `src/ffi/` alone
# (`unsafe.homes`): the library the pinned keg links, found through
# pkg-config and never vendored, the crate's declarations kept.
pcre2-sys = { workspace = true }

# `build.rs` fails the build where pkg-config finds no libpcre2-8, rather
# than let pcre2-sys fall back to the source it bundles, and compiles and
# runs `config0.m4`'s JIT program for `PCRE_JIT_SUPPORT`.
[build-dependencies]
pkg-config = { workspace = true }
cc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
