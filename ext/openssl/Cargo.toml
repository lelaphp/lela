# ext/openssl: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_openssl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The openssl extension, php-src/ext/openssl"

[lints]
workspace = true

# The facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `php_fopen_wrappers.h`'s http and ftp wrappers, which openssl registers
# again as `https` and `ftps`, and the stream context's options and URI
# parser `xp_ssl.c` reads (design §4.10).
php_ext_standard = { path = "../standard" }
# libcrypto is the platform's OpenSSL of the major version the oracle
# links, 4 since php 8.5.12, found by openssl-sys through pkg-config and bound in `src/ffi/`
# alone (`unsafe.homes`; design §7.2).
openssl-sys = { workspace = true }

# `build.rs` reads `OPENSSL_VERSION_TEXT` off the headers openssl-sys
# found, through the C preprocessor, as php's build compiles it.
[build-dependencies]
cc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
