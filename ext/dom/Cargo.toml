# ext/dom: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_dom"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The dom extension, php-src/ext/dom"

[lints]
workspace = true

# The facade, and libxml. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# libxml2 through `ext/libxml`'s surface, `php_libxml.h`'s, as php's dom
# includes it (`ZEND_MOD_REQUIRED("libxml")`, design §4.10).
php_ext_libxml = { path = "../libxml" }
# lexbor's HTML5 parser, CSS selectors and encodings through `ext/lexbor`,
# as php's dom includes lexbor's headers (`ZEND_MOD_REQUIRED("lexbor")`,
# design §4.10).
php_ext_lexbor = { path = "../lexbor" }

# The test face, `php_ext::test`, for tests/ and the unit tests alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_standard = { path = "../standard" }
php_ext_uri = { path = "../uri" }
# `spl_autoload_register`, for the test whose autoloader a node's class
# runs, and json, which spl requires.
php_ext_json = { path = "../json" }
php_ext_spl = { path = "../spl" }
