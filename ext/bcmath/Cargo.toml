# ext/bcmath: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_bcmath"
version = "0.0.0"
edition.workspace = true
# The port of php's bcmath.c is the workspace's; src/num.rs translates
# php-src's libbcmath, LGPL-2.1 or any later version as its headers grant,
# whose licence stands beside it as LICENSE-libbcmath.
license = "MIT AND LGPL-2.1-or-later"
rust-version.workspace = true
publish = false
description = "The bcmath extension, php-src/ext/bcmath"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
