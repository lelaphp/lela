# ext/exif: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_exif"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The exif extension, php-src/ext/exif"

[lints]
workspace = true

# The facade, and the extension whose headers exif.c includes. The engine
# is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `php_image.h` and `php_string.h`: the image type, its MIME type and the
# file's base name (`ZEND_MOD_REQUIRED("standard")`, design §4.10).
php_ext_standard = { path = "../standard" }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
