# ext/gettext: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_gettext"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The gettext extension, php-src/ext/gettext"
# The one crate that links libintl.
links = "intl"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# The C library's locale calls a lookup is made under (`src/ffi/`).
libc = { workspace = true }

# libintl is the keg's GNU gettext, the one the oracle links, found by
# `build.rs` as php's `config.m4` finds it and bound in `src/ffi/` alone
# (`unsafe.homes`; design §7.2, revision 72).

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
