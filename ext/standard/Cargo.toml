# ext/standard: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_standard"
version = "0.0.0"
edition.workspace = true
# The workspace's, but for the ports of the third-party files php-src
# carries, each under its own licence (THIRD-PARTY.md): strnatcmp.rs
# (Zlib), scanf.rs (TCL), crypt/freesec.rs and dir/php_glob.rs
# (BSD-3-Clause), uuencode.rs (BSD-4-Clause-UC), image/avif.rs
# (BSD-2-Clause) and crypt/md5_crypt.rs (Beerware); crypt/blowfish.rs,
# crypt/sha_crypt.rs and md5.rs follow public-domain code.
license = "MIT AND BSD-2-Clause AND BSD-3-Clause AND BSD-4-Clause-UC AND Beerware AND TCL AND Zlib"
rust-version.workspace = true
publish = false
description = "The standard extension, php-src/ext/standard"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# ext/random, whose RNG `shuffle`, `str_shuffle` and
# `array_rand` draw from (`ext/random/php_random.h`, design §4.10).
php_ext_random = { path = "../random" }
# ext/date, whose default zone `gettimeofday` reads its offset from
# (`ext/date/php_date.h`'s `get_timezone_info`, design §4.10).
php_ext_date = { path = "../date" }
# ext/uri, whose parsers the http and ftp wrappers read a URL with
# under `uri_parser_class` (`ext/uri/php_uri.h`, design §4.10), as
# `basic_functions.c` requires `uri`.
php_ext_uri = { path = "../uri" }
# `access(2)`, `utime(2)` and the user and group lookups `filestat.c`
# makes, in `src/ffi/` alone (`unsafe.homes`).
libc = { workspace = true }
# zlib's `uncompress`, which `php_handle_swc` inflates a compressed SWF
# with: an inflate's bytes are the stream's whatever implements it.
miniz_oxide = "0.8.9"

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started (#1925).
php_ext_lexbor = { path = "../lexbor" }
