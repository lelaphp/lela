# ext/standard: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_standard"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The standard extension, php-src/ext/standard"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `access(2)`, `utime(2)` and the user and group lookups `filestat.c`
# makes, in `src/ffi/` alone (`unsafe.homes`).
libc = { workspace = true }
# zlib's `uncompress`, which `php_handle_swc` inflates a compressed SWF
# with: an inflate's bytes are the stream's whatever implements it.
miniz_oxide = "0.8.9"

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
