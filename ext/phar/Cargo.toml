# ext/phar: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_phar"
version = "0.0.0"
edition.workspace = true
# The workspace's, but for tar.rs's `phar_tar_octal`, a port of Tim
# Kientzle's libarchive code under its BSD-2-Clause notice (THIRD-PARTY.md).
license = "MIT AND BSD-2-Clause"
rust-version.workspace = true
publish = false
description = "The phar extension, php-src/ext/phar"

[lints]
workspace = true

# The facade; ext/standard, whose `crc32.h` phar's CRC checks call and
# whose serialiser keeps an archive's `metadata`; ext/hash, whose
# `php_hash.h` its signatures hash through; and ext/spl, whose filesystem
# objects `Phar` and `PharFileInfo` extend (design §4.10, the `standard`,
# `hash` and `spl` → `phar` rows). The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_standard = { path = "../standard" }
php_ext_hash = { path = "../hash" }
php_ext_spl = { path = "../spl" }
# `localtime_r(3)` and `mktime(3)`, which zip.c converts DOS times
# through, and `getuid(2)`, `getgid(2)` and `getgroups(2)`, which
# phar_fancy_stat reads permission bits by, in `src/ffi/` alone
# (`unsafe.homes`).
libc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started (#1925).
php_ext_json = { path = "../json" }
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
