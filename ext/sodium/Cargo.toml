# ext/sodium: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_sodium"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The sodium extension, php-src/ext/sodium"
links = "sodium"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }

# libsodium is the library the pinned keg links, found through pkg-config
# and never vendored; its calls are declared by hand in `src/ffi/`, no
# bindgen (design §7.2, revision 72).
[build-dependencies]
pkg-config = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_lexbor = { path = "../lexbor" }
php_ext_standard = { path = "../standard" }
php_ext_uri = { path = "../uri" }
