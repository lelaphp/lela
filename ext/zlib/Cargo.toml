# ext/zlib: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_zlib"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The zlib extension, php-src/ext/zlib"

[lints]
workspace = true

# The facade, and `standard`, whose `file.h` natives the `gz*` aliases
# are and whose stream contexts the wrapper reads (design §4.10). The
# engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_standard = { path = "../standard" }
# zlib is the platform's, linked through libz-sys and bound in `src/ffi/`
# alone (`unsafe.homes`): no pure-Rust deflate writes the oracle's bytes
# (design §7.2, revision 34; #950).
libz-sys = { workspace = true }

# `build.rs` reads `ZLIB_VERSION` and `ZLIB_VERNUM` off the `zlib.h` a C
# build finds, through the C preprocessor, as php's build compiles them
# (#1974).
[build-dependencies]
cc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# #2826's non-shipping qualification adds no newly locked package.
miniz_oxide = "=0.8.9"
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started (#1925).
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
