# ext/intl: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_intl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The intl extension, php-src/ext/intl"
# The one crate that links ICU.
links = "icuuc"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `php_date.h`, which `common_date.cpp`, `timezone_class.cpp` and
# `calendar_methods.cpp` include for a `DateTime`'s and a `DateTimeZone`'s
# time and zone (design §4.10).
php_ext_date = { path = "../date" }

# ICU is found by `build.rs` through pkg-config: on macOS the keg the oracle
# links, of the major the pin's `[closure]` names (`icu4c@<major>`, which
# `build.rs` reads from `oracle.toml` with `toml`), and on any other
# target the platform's, at or above php's floor, 57.1. It is bound
# in `src/ffi/` alone, and php's intl C++ is built by `cc` in C++ mode as
# `src/ffi/shim/` (`unsafe.homes`; design §7.2, revision 75).
[build-dependencies]
cc = { workspace = true }
toml = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# `tests/pin.rs`, which holds `build/pin.rs`'s reading of the pin.
toml = { workspace = true }
