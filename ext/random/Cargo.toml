# ext/random: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_random"
version = "0.0.0"
edition.workspace = true
# The workspace's, but for engine_mt19937.rs, a port of php-src's Mersenne
# Twister, under its BSD-3-Clause notice (THIRD-PARTY.md).
license = "MIT AND BSD-3-Clause"
rust-version.workspace = true
publish = false
description = "The random extension, php-src/ext/random"

[lints]
workspace = true

# The facade; the engine is out of reach (`[[edge]]` ext/*). Beside it the
# host's CSPRNG, what `csprng.c`'s `php_random_bytes_ex` reads: `getentropy`
# on this host and `getrandom(2)` on Linux, with no `unsafe` of this crate's.
[dependencies]
php_ext = { path = "../../crates/php_ext" }
getrandom = "0.4.3"

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
