# ext/mysqli: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_mysqli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The mysqli extension, php-src/ext/mysqli"

[lints]
workspace = true

# The facade, and `mysqlnd`, whose client it connects through, as
# `php_mysqli_structs.h` includes `ext/mysqlnd/mysqlnd.h` and mysqli.c
# requires it (design §4.10). The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_mysqlnd = { path = "../mysqlnd" }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# session, and standard below it, for the save handler that writes through
# a link in session's `RSHUTDOWN` (#1689).
php_ext_session = { path = "../session" }
php_ext_standard = { path = "../standard" }
# openssl, whose natives mysqlnd's `sha256_password` and
# `caching_sha2_password` encrypt the password with over a plain socket
# (#2092).
php_ext_openssl = { path = "../openssl" }
