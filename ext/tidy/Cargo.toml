# ext/tidy: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_tidy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The tidy extension, php-src/ext/tidy"
# The one crate that links libtidy.
links = "tidy"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }

# libtidy is the keg's tidy-html5, the one the oracle links, found by
# `build.rs` through pkg-config and bound in `src/ffi/` alone
# (`unsafe.homes`; design §7.2, revision 72).
[build-dependencies]
pkg-config = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
