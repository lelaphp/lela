# ext/ctype: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_ctype"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The ctype extension, php-src/ext/ctype"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `isalpha(3)` and the rest of `<ctype.h>`, under the request's locale,
# in `src/ffi/` alone (`unsafe.homes`).
libc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
