# ext/curl: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_curl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The curl extension, php-src/ext/curl"

[lints]
workspace = true

# The facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `fdopen` over a stream's fd for `CURLOPT_STDERR`, in `src/ffi/` alone.
libc = { workspace = true }
# libcurl's declarations, re-exported by `src/ffi/sys.rs` and called in
# `src/ffi/` alone; the library is the platform's, the one the oracle
# links, which `build.rs` holds curl-sys to (design §7.2).
curl-sys = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
