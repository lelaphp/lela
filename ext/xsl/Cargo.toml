# ext/xsl: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_xsl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The xsl extension, php-src/ext/xsl"
# The one crate that links libxslt and libexslt.
links = "xslt"

[lints]
workspace = true

# The facade, libxml and dom. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# libxml2 through `ext/libxml`'s surface, as php's xsl includes
# `php_libxml.h` (`ZEND_MOD_REQUIRED("libxml")`, design §4.10).
php_ext_libxml = { path = "../libxml" }
# `xpath_callbacks.h`'s registry and `xml_common.h`'s `php_dom_create_object`,
# which php's xsl includes (`ZEND_MOD_REQUIRED("dom")`, design §4.10).
php_ext_dom = { path = "../dom" }

# libxslt and libexslt are the platform's, as the oracle links them, found
# through `pkg-config` (design §7.2, revision 72) and bound in `src/ffi/`
# alone (`unsafe.homes`); `cc` builds the few lines of C there.
[build-dependencies]
pkg-config = { workspace = true }
cc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started.
php_ext_lexbor = { path = "../lexbor" }
php_ext_standard = { path = "../standard" }
php_ext_uri = { path = "../uri" }
