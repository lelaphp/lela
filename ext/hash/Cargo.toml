# ext/hash: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_hash"
version = "0.0.0"
edition.workspace = true
# The workspace's, but for xxhash.rs, a port of xxHash under its
# BSD-2-Clause notice; murmur.rs follows public-domain code (THIRD-PARTY.md).
license = "MIT AND BSD-2-Clause"
rust-version.workspace = true
publish = false
description = "The hash extension, php-src/ext/hash"

[lints]
workspace = true

# The facade, and ext/standard, whose `md5.h`, `sha1.h` and crc32 table
# `php_hash_md.h`, `php_hash_sha.h` and `hash_crc32.c` include (ADR-0004's
# dependency rule). The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_standard = { path = "../standard" }
sha2 = { workspace = true }
keccak = { workspace = true }
twox-hash = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
