# ext/zip: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_zip"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The zip extension, php-src/ext/zip"

[lints]
workspace = true

# The facade; `standard`, whose `php_glob`, `php_basename` and
# `php_stream_context_get_option` `php_zip.c` and `zip_stream.c` call; and
# `pcre`, whose compiled-pattern cache `addPattern` matches with, as php's
# `ZEND_MOD_REQUIRED("pcre")` (design §4.10). The engine is out of reach
# (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
php_ext_standard = { path = "../standard" }
php_ext_pcre = { path = "../pcre" }
# libzip's behaviour re-derived in pure Rust (design §7.2, revision 70;
# #1515): ext/zip finds and reads the central directory as libzip's
# zip_open does (#3380), and the codecs and ciphers below read and write
# each entry, a buffer at a time (#1545); deflate is written through the
# platform's zlib, bound in `src/ffi/` over the libz-sys ext/zlib binds,
# at libzip's memLevel (#1657, #1651), and LZMA, XZ and ZSTD are read
# and written through the platform's liblzma and libzstd, bound in
# `src/ffi/` and found by `build.rs` (#3529).
flate2 = { workspace = true }
libz-sys = { workspace = true }
libc = { workspace = true }
bzip2 = { workspace = true }
aes = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
sha1 = { workspace = true }
crc32fast = { workspace = true }
getrandom = { workspace = true }

# `build.rs` compiles `zlib.h`'s `ZLIB_VERSION` as C, the string libzip's
# `deflateInit2` hands zlib (#2426), and finds liblzma and libzstd
# through pkg-config (#3529).
[build-dependencies]
cc = { workspace = true }
pkg-config = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started (#1925).
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
