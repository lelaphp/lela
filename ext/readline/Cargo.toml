# ext/readline: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_readline"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The readline extension, php-src/ext/readline"
links = "edit"

[lints]
workspace = true

# The facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `free` and `strdup` for the strings libedit allocates and is handed, in
# `src/ffi/` alone (`unsafe.homes`).
libc = { workspace = true }

# libedit is the platform's, the library the pinned php links, found
# through pkg-config and never vendored; its calls are declared by hand
# in `src/ffi/`, no bindgen (design §7.2, revision 72).
[build-dependencies]
pkg-config = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
