# ext/pcntl: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_pcntl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The pcntl extension, php-src/ext/pcntl"

[lints]
workspace = true

# The one dependency: the facade. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# The OS through `nix` (fork, the waits, exec, the signal dispositions and mask, alarm and the children's resource usage), and `libc` in `src/ffi/` alone for what `nix`
# does not wrap (design §7.2, revision 35).
nix = { workspace = true, features = ["process", "signal", "resource"] }
libc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
