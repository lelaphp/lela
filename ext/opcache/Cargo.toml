# ext/opcache: one crate per extension (ADR-0004), laid down by `xtask new-ext`.
[package]
name = "php_ext_opcache"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The opcache extension, php-src/ext/opcache"

[lints]
workspace = true

# The facade, the one workspace dependency. The engine is out of reach (`[[edge]]` ext/*).
[dependencies]
php_ext = { path = "../../crates/php_ext" }
# `opcache.preload_user`'s account through `nix` (the user database and,
# on Linux, its group list), and `libc` in `src/ffi/` alone for the
# per-thread credential calls `nix` wraps only as the per-process ones
# (#1258, as ext/posix binds what `nix` lacks, design §7.2).
nix = { workspace = true, features = ["user"] }
libc = { workspace = true }

# The test face, `php_ext::test`, for tests/ alone (design §4.3 seam 4).
[dev-dependencies]
php_ext = { path = "../../crates/php_ext", features = ["test"] }
# ext/standard for the natives the cache's own tests call and
# `zend_accel_override_file_functions` replaces: `file_exists`, `is_file`
# and `is_readable`, `file_put_contents` and `unlink`.
php_ext_standard = { path = "../standard" }
# What the extensions of the test engines require, transitively, as
# `zend_startup_module_ex` refuses an extension whose required one is not
# started (#1925).
php_ext_lexbor = { path = "../lexbor" }
php_ext_uri = { path = "../uri" }
