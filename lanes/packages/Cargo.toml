# php_lanes_packages: the packages lane's logic, with its own ceiling so
# other harness work cannot spend its lines (#69): the steps of one pinned
# package's run, the reading of its runner's JUnit log and the matching of
# its tests across the oracle's run and Lela's. It depends on no workspace
# crate; `xtask/src/packages` is the adapter that takes the steps, judges
# through the tally and records, and calls this.
[package]
name = "php_lanes_packages"
version = "0.0.0"
edition.workspace = true
license = "MIT"
rust-version.workspace = true
publish = false
description = "The packages lane's logic: one pinned package's run planned, its runner's log read and its tests matched across the two runs"

[lints]
workspace = true
