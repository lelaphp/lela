args = ["-R", "-n", "-F", "-y", "{dir}/php-fpm.conf"]
files = { "php-fpm.conf" = "[global]\nerror_log = {dir}/fpm.log\n[www]\nlisten = {dir}/fpm.sock\npm = static\npm.max_children = 1\n", "body.txt" = "x=from&y=file", "p.php" = "<?php var_dump($_POST, file_get_contents('php://input'));\n" }
mask = [['\[\d\d-\w{3}-\d{4} \d\d:\d\d:\d\d[.\d]*\] ', '[<time>] '], ['(pid|child|after) [\d.]+', '$1 N']]
[line.serve]
listen = "{dir}/fpm.sock"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/p.php"], ["REQUEST_METHOD", "POST"], ["CONTENT_TYPE", "application/x-www-form-urlencoded"], ["CONTENT_LENGTH", "-1"]]
body = "x=hello&y=world"
shut = true
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/p.php"], ["REQUEST_METHOD", "POST"], ["CONTENT_TYPE", "multipart/form-data; boundary=b"], ["CONTENT_LENGTH", "-1"]]
body = "--b\r\nContent-Disposition: form-data; name=\"x\"\r\n\r\nhello\r\n--b--\r\n"
shut = true
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/p.php"], ["REQUEST_METHOD", "POST"], ["CONTENT_TYPE", "application/x-www-form-urlencoded"], ["CONTENT_LENGTH", "-1"], ["REQUEST_BODY_FILE", "{dir}/body.txt"]]
