# sapi/fpm: php's FastCGI process manager, `php-src/sapi/fpm`, one crate
# under `sapi/` (ADR-0008), the binary `php-fpm`: a master that reads
# php-fpm.conf and forks its pools' children, each serving FastCGI
# requests on an engine of the bundle's enabled set with `cgi-fcgi` after
# it. Four edges, php_bundle, php_sapi, php_proto for the FastCGI and
# CGI codecs, and php_ext for the natives its own extension declares
# (ADR-0008 as amended by #1348); the engine is named through the facade
# alone.
[package]
name = "php_sapi_fpm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "php's FastCGI process manager, the binary php-fpm"

[lints]
workspace = true

[[bin]]
name = "php-fpm"
path = "src/main.rs"

# The same binary with `php_engine`'s `witness-trace` on, which the witness
# lane builds and serves a fence with a `request fpm` through, and nothing
# else does (harness §8, revision 61).
[[bin]]
name = "php-fpm-witness"
path = "src/witness.rs"
required-features = ["witness-trace"]

[features]
# Every request a child serves appends the natives it entered to the file
# `PHP_WITNESS_TRACE` names (harness §4.5 condition 2, revision 61).
witness-trace = ["php_bundle/witness-trace", "php_sapi/witness-trace"]

[dependencies]
# The CLI's set (sapi/cli/Cargo.toml says why each): php's configure
# builds every extension outside the `cli` class for every host, so the
# oracle's `php-fpm -m` lists every module its `php -m` does (#1477), and
# `pcntl` and `posix` are in every host whose serving process is
# single-threaded, as php-fpm's children are (design §7.2, revision 66).
# The test `the_bundle_is_the_clis` holds the two lists equal.
php_bundle = { path = "../../crates/php_bundle", features = ["pcntl", "posix", "sockets", "bz2", "openssl", "bcmath", "calendar", "mbstring", "curl", "exif", "shmop", "sysvsem", "sysvmsg", "sysvshm", "ftp", "pdo_mysql", "mysqli", "dba", "zip", "gmp", "tidy", "gettext"] }
php_proto = { path = "../../crates/php_proto" }
php_sapi = { path = "../../crates/php_sapi" }
# The face its `cgi_module_entry`'s natives are declared with, as an
# extension declares its own (ADR-0008, #1348).
php_ext = { path = "../../crates/php_ext" }
# The process manager's system calls, safe where `nix` wraps them, and
# `libc` in `src/ffi/` alone for the fork, the signal handlers, the
# shared memory and the rest `nix` leaves unsafe (ADR-0008).
nix = { workspace = true, features = ["process", "signal", "resource", "fs", "socket", "net", "poll", "event", "user", "time", "syslog", "feature"] }
libc = { workspace = true }
