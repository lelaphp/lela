# `exec` to a second context that does not compile, at the prompt of a first
# that does not: its refusal is logged with a prompt inside the log, at which
# nothing is compiled, so `ev` evaluates; under `-r` the prompt `exec` is read
# at stands inside the first refusal's log, and the second refusal is logged
# nowhere (`-qb -n`).
[[line]]
name = "ev-after-exec-to-a-second-refused-context-evaluates"
args = ["-qb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php function (", "b.php" = "<?php class {" }
stdin = "exec b.php\nev 1\nc\nev 2\nq\n"

