# php runs an included file whose code is its one `RETURN` of a constant only
# while `zend_execute_ex` is php's own (`Z/Zend/zend_vm_def.h:6569-6572`);
# under phpdbg's it executes it, so the loop steps that `RETURN` and a
# breakpoint on its line stops there. The address php prints is masked.
[[line]]
name = "an-included-file-of-declarations-alone-is-stepped-a-line"
args = ["-qIb", "-n", "{dir}/g.php"]
files = { "inc.php" = "<?php\nfunction bar() {\n  $b = 3;\n  return $b;\n}\n", "g.php" = "<?php\ninclude __DIR__ . '/inc.php';\nbar();\n" }
stdin = "b {dir}/inc.php:6\nr\nc\nq\n"
mask = [['#\d{10,}', '#N']]

# php runs an included file whose code is its one `RETURN` of a constant only
# while `zend_execute_ex` is php's own (`Z/Zend/zend_vm_def.h:6569-6572`);
# under phpdbg's it executes it, so the loop steps that `RETURN` and a
# breakpoint on its opline stops there. The address php prints is masked.
[[line]]
name = "an-included-file-of-declarations-alone-is-stepped-its-opline"
args = ["-qIb", "-n", "{dir}/g.php"]
files = { "inc.php" = "<?php\nfunction bar() {\n  $b = 3;\n  return $b;\n}\n", "g.php" = "<?php\ninclude __DIR__ . '/inc.php';\nbar();\n" }
stdin = "b {dir}/inc.php:#0\nr\nc\nq\n"
mask = [['#\d{10,}', '#N']]

# `b f.php:#N` keeps the file as typed (`phpdbg_set_breakpoint_file_opline`,
# `Z/sapi/phpdbg/phpdbg_bp.c:738`): a relative name is pending under that name
# and never resolves against the compiled `/abs/f.php`.
[[line]]
name = "a-relative-file-opline-breakpoint-keeps-its-name"
args = ["-qIb", "-n", "{dir}/f.php"]
files = { "f.php" = "<?php\nfunction foo() {\n  $a = 1;\n  return $a;\n}\nclass A { function b() { return 2; } }\nfoo();\n(new A)->b();\n" }
stdin = "b f.php:#0\nr\nq\n"
mask = [['#\d{10,}', '#N']]

# An absolute one at a prompt with a frame of that file's code executing is
# resolved at once (`phpdbg_resolve_opline_break`, `:591-603`), and resolved
# again before each opline of that code. The address is masked.
[[line]]
name = "an-absolute-file-opline-breakpoint-resolves-in-an-executing-frame"
args = ["-qIb", "-n", "{dir}/f.php"]
files = { "f.php" = "<?php\nfunction foo() {\n  $a = 1;\n  return $a;\n}\nclass A { function b() { return 2; } }\nfoo();\n(new A)->b();\n" }
stdin = "b foo\nr\nb {dir}/f.php:#0\nc\nq\n"
mask = [['#\d{10,}', '#N']]

# php keeps a function, method or file opline breakpoint, once resolved, in
# `PHPDBG_BREAK_OPLINE` too, and `info break` lists it under `Opline
# Breakpoints` with its address and the kind it was resolved from
# (`phpdbg_print_breakpoints`), above the named tables. The address is masked.
[[line]]
name = "info-break-lists-resolved-opline-breakpoints-under-the-opline-table"
args = ["-qIb", "-n", "{dir}/f.php"]
files = { "f.php" = "<?php\nfunction foo() {\n  $a = 1;\n  return $a;\n}\nclass A { function b() { return 2; } }\nfoo();\n(new A)->b();\n" }
stdin = "b foo\nr\nb foo#0\nb A::b#0\nb {dir}/f.php:#0\ni b\nq\n"
mask = [['#\d{10,}', '#N']]

# A second opline breakpoint on one opline of one function or method is
# refused after its notice and its number given back
# (`Z/sapi/phpdbg/phpdbg_bp.c:676-682`, `:719-725`): nothing is added to the
# named tables, while the opline table, which php updated before it refused,
# keeps the refused number under a resolved opline. The address is masked.
[[line]]
name = "a-second-opline-breakpoint-on-one-opline-is-refused"
args = ["-qIb", "-n", "{dir}/f.php"]
files = { "f.php" = "<?php\nfunction foo() {\n  $a = 1;\n  return $a;\n}\nclass A { function b() { return 2; } }\nfoo();\n(new A)->b();\n" }
stdin = "b foo#0\nb foo#0\nb baz#0\nb baz#0\nb A::b#0\nb A::b#0\ni b\nq\n"
mask = [['#\d{10,}', '#N']]

# A breakpoint stops a run between two handlers, `ev` evaluates in the frame
# stopped in, and `c` runs on to the end (#2507).
[[line]]
name = "a-run-stops-at-a-breakpoint-and-evaluates-in-the-frame"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\n$i = 1;\necho PHP_SAPI, $i++, \"\\n\";\necho $i, \"\\n\";\n" }
stdin = "b 4\nr\nev $i * 10\nc\nq\n"

# A step from a function's breakpoint stops at the next line, and the end of
# stdin quits (#2507).
[[line]]
name = "a-step-stops-at-the-next-line-and-the-end-of-input-quits"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f() {\n\treturn 1;\n}\nf();\n" }
stdin = "b f\nr\ns\n"

# A watchpoint's report writes the values through the program's output, so
# its first byte sends the headers and the header callback runs under the
# debugger, which stops in it on the same change before the report goes on
# (`sapi/phpdbg/tests/gh15210_002.phpt`'s shape, #2507).
[[line]]
name = "a-watch-report-sends-the-headers-and-the-callback-is-debugged"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nheader_register_callback(function() { echo \"sent\";});\n$a = [0];\n$a[0] = 1;\n" }
stdin = "b 4\nr\nw $a[0]\nc\nc\nq\n"

# `phpdbg_prompt()` and `phpdbg_break_function()`, natives the prompt serves
# through `register` and `ev`, read and write the session they are called in
# (#2507).
[[line]]
name = "a-native-the-prompt-serves-reads-the-session"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f() {\n  echo \"in f\\n\";\n}\nf();\necho \"done\\n\";\n" }
stdin = "register phpdbg_prompt\nphpdbg_prompt y>\nev phpdbg_break_function(\"f\")\nr\nq\n"
