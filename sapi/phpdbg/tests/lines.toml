# After `clean` over a context that does not compile, php's next cycle
# compiles it under `PHPDBG_DISCARD_OUTPUT` once fully started, so its log
# stands at a prompt that writes nothing: `ev`'s value is written, its newline
# not; nothing is logged there; a refusal there bails out of it, and so does
# `c` (`-qb -n`, then "clean\nev 1\nq\n"). The counts `clean` writes are each
# build's, and are masked.
[[line]]
name = "after-clean-the-refused-context-stands-at-an-invisible-prompt-ev"
args = ["-qb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction (\n" }
stdin = "clean\nev 1\nq\n"
mask = [['(?m)^(Classes|Functions|Constants)( +)\d+$', '$1${2}N']]

