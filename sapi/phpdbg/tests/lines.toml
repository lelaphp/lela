# phpdbg's own lines, each run by `xtask witness` under the pinned phpdbg
# (oracle.toml's [sapi]) and then under this crate's, in one directory laid
# afresh, and held equal: a startup that ends the process under an ini of the
# line's own, which a fence cannot carry (#1634; #1975, as #2468 ruled). No
# byte here is the oracle's; the oracle's run is the expectation. The grammar
# is xtask/src/witness/host.rs's.

# A refusal answered after every extension started, at `zend_post_startup`
# inside `php_module_startup`: opcache's `ACCEL_LOG_FATAL` in
# `accel_post_startup` for `opcache.file_cache_only` with no
# `opcache.file_cache`. php ends the process there, before phpdbg reads its
# line further, so the file named on the line is never run (#1943).
# `zend_accel_error` writes the time `asctime` prints and the process's id
# before its message.
[[line]]
name = "post-startup-refused"
args = ["-n", "-d", "opcache.enable_cli=1", "-d", "opcache.file_cache_only=1", "-qrr", "/nonexistent/t.php"]
mask = [['(?m)^.{24} \(\d+\): ', '<asctime> (<pid>): ']]

# An extension whose engine start refuses, php's `MINIT` returning `FAILURE`
# (ADR-0010): `ffi.preload` naming a header that is not there. php ends the
# process from `php_error_cb`, `exit(-2)` for the `E_CORE_ERROR` of a failed
# `MINIT` (`Z/main/main.c:1505-1507`), before the host does anything of its
# own (#1802). phpdbg displays nothing under its `display_errors` and logs
# each diagnostic as its log function does before it is booted, a line on
# stdout; under `display_errors=1` each is logged, then displayed, before the
# next, in the order `php_error_cb` writes them; under
# `display_errors=stderr` the display goes to stderr, as `php_error_cb`
# writes it for a host named `phpdbg`, and the log stays on stdout.
[[line]]
name = "startup-refused"
args = ["-qrr", "-n", "-d", "ffi.preload=/nonexistent/startup-refused.h", "/nonexistent/t.php"]
[[line.then]]
args = ["-qrr", "-n", "-d", "display_errors=1", "-d", "fatal_error_backtraces=0", "-d", "ffi.preload=/nonexistent/startup-refused.h", "/nonexistent/t.php"]
[[line.then]]
args = ["-qrr", "-n", "-d", "display_errors=stderr", "-d", "fatal_error_backtraces=0", "-d", "ffi.preload=/nonexistent/startup-refused.h", "/nonexistent/t.php"]

# A session at the prompt: the program laid as `t.php` (or the file a line
# names) in the line's directory, the commands on stdin, and an init file
# laid as `init` where `-i` names it. A session that loops is cut at
# `head`, its first cycles.

# `-e` compiles with extended info (`Z/sapi/phpdbg/phpdbg.c:1250`, `:1498`):
# the main op array of `f(1)`'s echo is eight oplines with its `EXT_STMT`,
# `EXT_FCALL_BEGIN` and `EXT_FCALL_END`, and five without; the listing goes to
# the second stream (#1822).
[[line]]
name = "extended-info-compiles-php-s-oplines-into-the-listing"
args = ["-qIb", "-n", "-e", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f($a) { return $a; }\necho f(1);\n" }
stdin = "print exec\nq\n"

# The same listing without `-e` (#1822).
[[line]]
name = "without-extended-info-the-listing-is-five-oplines"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f($a) { return $a; }\necho f(1);\n" }
stdin = "print exec\nq\n"

# `-rr` runs the file and quits with php's quitting flag set, so a run that
# ends normally writes no closing notice.
[[line]]
name = "run-twice-on-the-line-quits-without-the-closing-notice"
args = ["-qrr", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php echo \"x\\n\";\n" }

# What php logs while it starts, before phpdbg is booted, goes to C's
# `stdout`, an `fprintf` (`php_sapi_phpdbg_log_message`), where a pipe holds
# it to the exit, while the program's output goes out past it with
# `write(2)`: so a startup warning's log line stands after the body (#2899).
[[line]]
name = "a-startup-log-line-is-held-behind-the-body"
args = ["-qrr", "-n", "-d", "date.timezone=Foo/Bar", "{dir}/t.php"]
files = { "t.php" = "<?php echo \"body\\n\";\n" }

# `-rr` over a program that exits with 3.
[[line]]
name = "run-twice-on-the-line-quits-with-the-program-s-exit-status"
args = ["-qrr", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php echo \"x\\n\"; exit(3);\n" }

# Under `-rr` the loop checks nothing between handlers, so an uncaught
# throwable stops at no prompt: the run's end reports it and the status is its
# fatal's.
[[line]]
name = "run-twice-on-the-line-reports-an-uncaught-throwable-at-the-end"
args = ["-qrrb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php throw new Exception(\"boo\");\n" }

# The init file's commands run before the startup run, in its request, a line
# at a time: a line that names no command writes its error with the line and
# the next line still runs (`-qrrb`).
[[line]]
name = "the-init-file-runs-before-the-startup-run"
args = ["-qrrb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$i = 1;\necho $x ?? \"unset\", \"\\n\";\n", "init" = "b 3\nev $x = 7\nnope\n" }
stdin = ""

# The same init file under `-qrb`, whose startup run stops at the breakpoint
# the file set.
[[line]]
name = "the-init-file-runs-before-the-startup-run-that-stops"
args = ["-qrb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$i = 1;\necho $x ?? \"unset\", \"\\n\";\n", "init" = "b 3\nev $x = 7\nnope\n" }
stdin = "q\n"

# An init line that names no command is quoted as php's lexer left it, each
# quoted word unquoted in place over its opening quote and the tail kept.
[[line]]
name = "an-unrecognized-init-line-is-quoted-as-the-lexer-left-it"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho 1;\n", "init" = "echo \"cmd\"\nfoo \"ab\" 'c\\'d' x\n" }
stdin = "q\n"

# Without `-b`, notices and errors are coloured whether or not stdout is a
# terminal, the prompt never.
[[line]]
name = "notices-and-errors-are-coloured-unless-boring"
args = ["-qrr", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$i = 1;\necho $x ?? \"unset\", \"\\n\";\n", "init" = "b 3\nev $x = 7\nnope\n" }
stdin = ""

# An uncaught throwable's report under `-qrr`, coloured.
[[line]]
name = "an-uncaught-throwable-is-coloured-unless-boring"
args = ["-qrr", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php throw new Exception(\"boo\");\n" }

# A run at the prompt under `-qIb`.
[[line]]
name = "the-prompt-is-never-coloured"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\necho \"x\\n\";\n" }
stdin = "r\nq\n"

# A cycle's end exports the breakpoints as `break` lines, and the next cycle
# starts its tables empty and its count at zero: the init file numbers its
# line #0 again, the lines run again after it with nothing written, and the
# breakpoints still stop. The file's lines are past the eighth: under it php
# lists a file's breakpoints off a packed table it reads as a hash, which
# drops rows or crashes.
[[line]]
name = "a-cycle-starts-the-breakpoints-over-and-carries-them"
args = ["-qrb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n\n\n\n\n\n\n$a = 1;\n$b = 2;\n$c = 3;\necho \"x\\n\";\n", "init" = "b 9\n" }
stdin = "c\nb 9\nb 10\ninfo break\nq\n"

# A deleted breakpoint is not carried into the next cycle, and the numbers
# close up.
[[line]]
name = "a-deleted-breakpoint-is-not-carried-and-the-numbers-close-up"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction foo() { echo \"foo\\n\"; }\nfunction bar() { echo \"bar\\n\"; }\nfunction baz() { echo \"baz\\n\"; }\nfoo();\nbar();\nbaz();\n" }
stdin = "b foo\nb bar\nb del 0\nr\nc\nb baz\ninfo break\nr\nq\n"

# `info` with no sub-command writes the execution context's overview: in the
# init file, before the context is compiled; at the prompt the compile left,
# with the main op array's sizes; and at a breakpoint, executing, with what
# the last handler answered. The tables' sizes are what each build loads, and
# are masked.
[[line]]
name = "info-writes-the-execution-context-overview"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\nfunction f($x) { $y = $x; return $y; }\nf(1);\n", "init" = "info\n" }
stdin = "info\nb f\nr\ninfo\nq\n"
mask = [['(?m)^(Classes|Functions|Constants)( +)\d+$', '$1${2}N']]

# `-v` clears quietness, so a step writes each opline the loop reaches to
# stderr; `set break` disables one breakpoint and `set breaks` all, and a
# restart starts the cycle over with the line's flags, the breakpoints on and
# quietness as `-v` left it, the one disabled carried enabled.
[[line]]
name = "set-breaks-and-quiet-read-as-php-writes-them-across-a-cycle"
args = ["-qvb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f($x) {\n  $y = $x + 1;\n  return $y;\n}\necho f(1), \"\\n\";\necho \"end\\n\";\n" }
stdin = "b f\nr\ns\nn\nset break 0 off\nset quiet\nset breaks off\nset breaks\nr\ny\nset breaks\nset quiet\ninfo break\nq\n"

# An init file's code block runs where its `:>` stands, its lines joined with
# nothing between them, a comment and a blank line among them skipped, as
# `phpdbginit code`: what it defines the program finds, and what it raises
# names that file (`-qb -n`).
[[line]]
name = "an-init-code-block-runs-as-phpdbginit-code"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho $x ?? \"unset\", \"\\n\";\nf();\n", "init" = "<:\n$x = 5;\nfunction f() { echo \"f\\n\"; }\n  echo \"a\";\n# comment\n\n echo $undef, \"b\\n\";\n:>\nev $x\n" }
stdin = "q\n"

# An init file's code block runs where its `:>` stands, its lines joined with
# nothing between them, a comment and a blank line among them skipped, as
# `phpdbginit code`: what it defines the program finds, and what it raises
# names that file (`-qrb -n`).
[[line]]
name = "an-init-code-block-runs-as-phpdbginit-code-under-r"
args = ["-qrb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho $x ?? \"unset\", \"\\n\";\nf();\n", "init" = "<:\n$x = 5;\nfunction f() { echo \"f\\n\"; }\n  echo \"a\";\n# comment\n\n echo $undef, \"b\\n\";\n:>\nev $x\n" }
stdin = "q\n"

# An init file's code block runs where its `:>` stands, its lines joined with
# nothing between them, a comment and a blank line among them skipped, as
# `phpdbginit code`: what it defines the program finds, and what it raises
# names that file (`-qrrb -n`).
[[line]]
name = "an-init-code-block-runs-as-phpdbginit-code-under-rr"
args = ["-qrrb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho $x ?? \"unset\", \"\\n\";\nf();\n", "init" = "<:\n$x = 5;\nfunction f() { echo \"f\\n\"; }\n  echo \"a\";\n# comment\n\n echo $undef, \"b\\n\";\n:>\nev $x\n" }
stdin = ""

# What a code block leaves pending, a parse error, is rendered by the next
# `ev`, which writes nothing else.
[[line]]
name = "a-parse-error-a-code-block-leaves-is-the-next-ev-s"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho $x ?? \"unset\", \"\\n\";\nf();\n", "init" = "<:\n$y =\n:>\nev 2\nev 3\n" }
stdin = "q\n"

# A throwable nothing catches stops the loop first, at a prompt with no
# listing of `phpdbginit code` to show, and the next `ev` renders it.
[[line]]
name = "a-throwable-a-code-block-leaves-stops-the-loop-first"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho $x ?? \"unset\", \"\\n\";\nf();\n", "init" = "<:\necho \"a\\n\";\nthrow new Exception(\"boo\");\n:>\nev 1\nev 2\n" }
stdin = "c\nq\n"

# A fatal ends the reading of the init files, its log listing nothing, and
# stops at no prompt in the first cycle.
[[line]]
name = "a-fatal-in-a-code-block-ends-the-reading-of-the-init-files"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho $x ?? \"unset\", \"\\n\";\nf();\n", "init" = "<:\nini_set(\"memory_limit\", \"2M\");\nstr_repeat(\"x\", 4 << 20);\n:>\nev 2\n" }
stdin = "c\nq\n"

# php runs the init file before it compiles the context, so where the context
# does not compile, what the file writes comes first, the compiler's log after
# it, and the prompt stands in the request the file ran in, with what it left;
# a `print exec` there compiles the context again and writes the log again.
[[line]]
name = "an-init-file-runs-before-a-context-that-does-not-compile"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\necho \"prog \", $x ?? \"unset\", \"\\n\";\n$b =\n", "init" = "b 3\nev $x = 3\nprint exec\n" }
stdin = "ev $x\nprint exec\nc\nr\nq\n"

# `print exec` in the init file compiles the context there, with its notice,
# once a cycle, and the context's own compile after the file writes it again.
[[line]]
name = "print-exec-in-the-init-file-compiles-the-context-first"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\necho \"prog \", $x ?? \"unset\", \"\\n\";\n", "init" = "print exec\nev 5\nprint exec\n" }
stdin = "q\n"

# `run` in the init file compiles the context and runs it there, the
# breakpoints the file set not stopping it, and the file's next lines run
# after it, an `ev` among them writing nothing; under `-rr` the startup run
# then finds the program executing and asks, and the end of the input quits.
[[line]]
name = "run-in-the-init-file-runs-the-program-there"
args = ["-qrrb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\necho \"prog \", $x ?? \"unset\", \"\\n\";\n", "init" = "ev 1\nb 3\nrun\nev 2\nb 3\n" }
stdin = "q\n"

# Without `-rr` php's cycle ends and starts again with the init file, which
# runs the program again, for as long as the session lasts: its first cycles.
[[line]]
name = "run-in-the-init-file-runs-the-program-every-cycle"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\necho \"prog \", $x ?? \"unset\", \"\\n\";\n", "init" = "ev 1\nb 3\nrun\nev 2\nb 3\n" }
stdin = "q\n"
head = 4096

# With no `-i` and no `-I`, the init files are `PHP_CONFIG_FILE_PATH`'s
# `.phpdbginit`, one in each directory of `PHP_INI_SCAN_DIR`, and the working
# directory's; php's walk of `PHP_INI_SCAN_DIR` cuts it at its first `:` where
# it stands in the environment, so the program reads the first directory
# alone, and so does every cycle after the first.
[[line]]
name = "the-default-init-files-are-read-where-php-reads-them"
args = ["-qb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\necho getenv(\"PHP_INI_SCAN_DIR\"), \"\\n\";\n", "a/.phpdbginit" = "ev \"A\"\n", "b/.phpdbginit" = "ev \"B\"\n", ".phpdbginit" = "ev \"W\"\n" }
env = { PHP_INI_SCAN_DIR = "{dir}/a:{dir}/b" }
stdin = "r\nr\nq\n"

# Under `-r` php's startup run compiles a context that does not compile once
# the session is fully started, so its log stands at a prompt, and nothing is
# logged from there: a `run` or a `print exec` refused again writes nothing,
# and `ev` no warning. Under `display_errors=1` the warning is displayed: a
# parse error leaves `zend_compile` as it returns, so `compile_file` emits
# its record and stops it before phpdbg renders the `ParseError`.
[[line]]
name = "a-refusal-inside-the-log-leaves-its-guard-set"
args = ["-qrb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction (\n" }
stdin = "ev 2\nr\nev $x\nprint exec\nr\nq\n"
[[line.then]]
args = ["-qrb", "-n", "-d", "display_errors=1", "{dir}/t.php"]

# The same past a compile error, which bails out of `zend_compile` past
# `compile_file`'s `zend_emit_recorded_errors`, so `EG(record_errors)` stands
# on with the fatal held: `ev`'s warning is held too, logged nowhere and
# displayed nowhere (#2901), and the next compile emits the record, its
# fatal bailing out ahead of its own.
[[line]]
name = "a-compile-error-s-record-holds-back-an-ev-warning"
args = ["-qrb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\nbreak 2;\n" }
stdin = "ev 2\nr\nev $x\nprint exec\nr\nq\n"
[[line.then]]
args = ["-qrb", "-n", "{dir}/t.php"]

# Such a refusal bails out of the log past the line that clears its guard, so
# nothing is logged after it either.
[[line]]
name = "a-refusal-inside-the-log-leaves-its-guard-set-at-print-exec"
args = ["-qb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction (\n" }
stdin = "print exec\nprint exec\nc\nprint exec\nq\n"

# The same, a `run` at the prompt included.
[[line]]
name = "a-refusal-inside-the-log-leaves-its-guard-set-at-run"
args = ["-qb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction (\n" }
stdin = "r\nev 1\nc\nr\nev $x\nr\nq\n"

# A context the compiler warns about twice before it refuses it, logged and
# displayed, the streams merged (#2776): `php_error_cb` logs each diagnostic,
# then displays it, before the next, and `php_sapi_phpdbg_log_message` lists
# the code after the fatal's entry, inside its log, so the fatal's display
# comes after the listing (`Z/main/main.c:1411-1495`,
# `Z/sapi/phpdbg/phpdbg.c:731-770`); `display_errors=stderr` displays on
# stderr in the same turns.
[[line]]
name = "a-refused-context-s-diagnostics-are-logged-and-displayed-in-turn"
args = ["-qb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n" }
stdin = "q\n"
streams = "merged"
[[line.then]]
args = ["-qb", "-n", "-d", "display_errors=stderr", "{dir}/t.php"]

# Under `-r` the startup compile is php's auto compile under
# `PHPDBG_DISCARD_OUTPUT` (`Z/sapi/phpdbg/phpdbg.c:1540-1553`), which logs
# nothing and displays each diagnostic; the run compiles the context again,
# fully started, so the fatal's log stands at a prompt before its display.
[[line]]
name = "under-r-a-refused-context-is-displayed-twice-and-logged-once"
args = ["-qrb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n" }
stdin = "ev 1\nc\nq\n"
streams = "merged"

# The same, the prompt inside the log quit: `quit` bails out of the log
# before `php_error_cb` displays the fatal.
[[line]]
name = "under-r-a-quit-inside-the-refused-context-s-log-displays-no-fatal"
args = ["-qrb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n" }
stdin = "q\n"
streams = "merged"

# Under `-rr` the run's compile is under `PHPDBG_PREVENT_INTERACTIVE`, so its
# log lists nothing, after the auto compile's displays.
[[line]]
name = "under-rr-a-refused-context-is-displayed-twice-and-logged-once"
args = ["-qrrb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n" }
streams = "merged"
[[line.then]]
args = ["-qrrb", "-n", "-d", "display_errors=stderr", "{dir}/t.php"]

# A refusal inside the log is logged nowhere, `php_log_err`'s guard holding,
# and displayed all the same, then bails out of the log before the fatal the
# log was for is displayed: after `clean`, the cycle's compile under
# `PHPDBG_DISCARD_OUTPUT` stands at an invisible prompt inside its log, where
# `print exec` refuses the context again. The counts `clean` writes are each
# build's, and are masked.
[[line]]
name = "a-refusal-inside-the-log-is-displayed-and-the-log-s-fatal-is-not"
args = ["-qb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\nbreak 2;\n" }
stdin = "clean\nev 1\nprint exec\nq\n"
streams = "merged"
mask = [['(?m)^(Classes|Functions|Constants)( +)\d+$', '$1${2}N']]

# The same at a prompt outside the log, the guard left set by the refusal
# that bailed out of it: displayed, logged nowhere.
[[line]]
name = "a-refusal-past-the-log-s-guard-is-displayed-and-logged-nowhere"
args = ["-qb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\nbreak 2;\n" }
stdin = "print exec\nprint exec\nc\nprint exec\nq\n"
streams = "merged"

# A context that declares functions before its refusal: php declares each as
# its compile finishes it and the fatal's jump takes none back, so they stand in
# the request (#2900). The second compile, `print exec`'s, records its own
# deprecation behind the first's record, still standing, and meets `f` as
# `Cannot redeclare`, whose fatal emits that record first: the first's
# fatal bails out ahead of it, inside the log, and its prompt's `print exec`
# compiles a third time with no record standing, its deprecation and its
# `Cannot redeclare` displayed and logged nowhere, bailing out of the log to
# the prompt outside it, where `info funcs` lists both functions and a fourth
# compile emits the record the third left standing, the same two displayed.
[[line]]
name = "a-second-compile-of-a-refused-context-meets-its-functions"
args = ["-qb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n" }
stdin = "print exec\nprint exec\nc\ninfo funcs\nprint exec\nq\n"
streams = "merged"

# The same under `-r`, `run` compiling it after the startup run's refusal
# left its log: `Cannot redeclare` logged, listed and displayed.
[[line]]
name = "under-r-a-run-after-a-refusal-meets-its-functions"
args = ["-qrb", "-n", "-d", "display_errors=1", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n" }
stdin = "ev 1\nc\nr\nq\n"
streams = "merged"

# The auto compile under `-r` comes after the init files whatever they left:
# where their code bailed out, its displays come before the startup run asks
# to restart (`n`, the session at the prompt); php is fully started after it,
# so after a restart (`y`) the next cycle's auto compile stands at an
# invisible prompt inside its log, where `q` bails out of the log before the
# fatal is displayed and the status written, and the session ends with 0.
[[line]]
name = "under-r-the-auto-compile-displays-after-init-files-that-bailed-out"
args = ["-qrb", "-n", "-d", "display_errors=1", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n", "init" = "ev ini_set(\"memory_limit\", \"2M\")\nev str_repeat(\"x\", 4 << 20)\n" }
stdin = "n\nq\n"
streams = "merged"

# The same, restarted.
[[line]]
name = "under-r-a-restart-s-auto-compile-quit-inside-its-log-leaves-the-status"
args = ["-qrb", "-n", "-d", "display_errors=1", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n", "init" = "ev ini_set(\"memory_limit\", \"2M\")\nev str_repeat(\"x\", 4 << 20)\n" }
stdin = "y\nq\n"
streams = "merged"

# The restarted cycle's startup run is not `run` but the line the cycle
# before parsed last, `first_command`, here the init file's `ev` (#2912): `c`
# leaves the auto compile's invisible log prompt, its fatal displayed, and
# the resubmitted `ev` meets the memory limit again, whose fatal emits the
# record the refusal left standing first, the refusal's fatal last with the
# trace of where the `ev` stands, which bails out of it to the prompt; `ev`'s
# `zend_catch` writes the status 0, and nothing asks to restart again.
[[line]]
name = "under-r-a-restart-resubmits-the-line-the-cycle-before-parsed-last"
args = ["-qrb", "-n", "-d", "display_errors=1", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction f(int $a = null) {}\nfunction g(int $b = null) {}\nbreak 2;\n", "init" = "ev ini_set(\"memory_limit\", \"2M\")\nev str_repeat(\"x\", 4 << 20)\n" }
stdin = "y\nev 1\nc\nq\n"
streams = "merged"

# The same over a context that compiles: the resubmitted `ev` meets the
# memory limit again, and the prompt stands where nothing executes.
[[line]]
name = "a-restart-resubmits-the-init-file-s-line-over-a-context-that-compiles"
args = ["-qrb", "-n", "-d", "display_errors=1", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\necho \"hi\\n\";\n", "init" = "ev ini_set(\"memory_limit\", \"2M\")\nev str_repeat(\"x\", 4 << 20)\n" }
stdin = "y\nev 7\nq\n"
streams = "merged"

# `run` with arguments in the init file rebuilds `argv` in the request the
# file runs in and runs the program there, as php's `run` does with
# `php_build_argv`, every cycle: the first cycles.
[[line]]
name = "run-with-arguments-in-the-init-file-runs-inline"
args = ["-qb", "-n", "-i{dir}/init", "{dir}/t.php"]
files = { "t.php" = "<?php\n$a = 1;\necho \"prog \", $argv[1] ?? \"none\", \" \", $argc, \"\\n\";\n", "init" = "ev 1\nrun foo\nev 2\n" }
stdin = "q\n"
head = 4096

