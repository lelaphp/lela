# A breakpoint on an opline of a function, a method or a file's code is
# resolved before each opline of that op array runs, where its name is the op
# array's as declared, and php says so each time
# (`phpdbg_resolve_op_array_breaks`, `Z/sapi/phpdbg/phpdbg_bp.c:536`), with
# the number and the address of the breakpoint the opline table took last: a
# function's. The address is masked.
[[line]]
name = "an-opline-breakpoint-is-resolved-before-each-opline-of-a-function"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction foo() {\n  $a = 1;\n  return $a;\n}\nfunction bar() {\n  return 2;\n}\nif (true) {\n  function baz() {\n    return 3;\n  }\n}\nfoo();\nbar();\nbaz();\n" }
stdin = "b foo#0\nr\nc\nq\n"
mask = [['\(opline #\d+\)', '(opline #N)']]

# A breakpoint on an opline of a function, a method or a file's code is
# resolved before each opline of that op array runs, where its name is the op
# array's as declared, and php says so each time
# (`phpdbg_resolve_op_array_breaks`, `Z/sapi/phpdbg/phpdbg_bp.c:536`), with
# the number and the address of the breakpoint the opline table took last: a
# function declared where the run reaches it. The address is masked.
[[line]]
name = "an-opline-breakpoint-is-resolved-before-each-opline-of-a-pending-function"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction foo() {\n  $a = 1;\n  return $a;\n}\nfunction bar() {\n  return 2;\n}\nif (true) {\n  function baz() {\n    return 3;\n  }\n}\nfoo();\nbar();\nbaz();\n" }
stdin = "b baz#0\nr\nc\nq\n"
mask = [['\(opline #\d+\)', '(opline #N)']]

# A breakpoint on an opline of a function, a method or a file's code is
# resolved before each opline of that op array runs, where its name is the op
# array's as declared, and php says so each time
# (`phpdbg_resolve_op_array_breaks`, `Z/sapi/phpdbg/phpdbg_bp.c:536`), with
# the number and the address of the breakpoint the opline table took last: an
# opline past the op array's end, refused. The address is masked.
[[line]]
name = "an-opline-breakpoint-is-resolved-before-each-opline-of-past-the-op-array-s-end"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nfunction foo() {\n  $a = 1;\n  return $a;\n}\nfunction bar() {\n  return 2;\n}\nif (true) {\n  function baz() {\n    return 3;\n  }\n}\nfoo();\nbar();\nbaz();\n" }
stdin = "b baz#8\nr\nq\n"
mask = [['\(opline #\d+\)', '(opline #N)']]

# The same for a method's opline.
[[line]]
name = "an-opline-breakpoint-is-resolved-before-each-opline-of-a-method"
args = ["-qIb", "-n", "{dir}/t.php"]
files = { "t.php" = "<?php\nclass A {\n  function b() {\n    $x = 2;\n    return $x;\n  }\n}\n(new A)->b();\n" }
stdin = "b A::b#0\nr\nc\nq\n"
mask = [['\(opline #\d+\)', '(opline #N)']]

# The notice names the breakpoint and the address the opline table took last,
# which need not be the one resolved: foo's notice names bar's breakpoint.
