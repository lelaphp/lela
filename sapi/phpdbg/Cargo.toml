# sapi/phpdbg: php-src/sapi/phpdbg, one crate under `sapi/` (ADR-0008), laid
# down by `xtask new-sapi`: the binary `phpdbg`, the debugging host, which
# binds a tier of its own (#1308). Three edges, php_bundle, php_sapi, and
# php_ext for the natives its own extension declares (ADR-0008 as amended
# by #1348); the engine and its tier face are named through the facade
# alone.
[package]
name = "php_sapi_phpdbg"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "php's phpdbg host, the binary phpdbg"

[lints]
workspace = true

[[bin]]
name = "phpdbg"
path = "src/main.rs"

[dependencies]
# The bundle's `host`, the set every host links: php's configure builds
# an extension of the `cli` class for the CLI, CGI, embed and phpdbg alike
# (`EXT_CLI_STATIC`, `Z/build/php.m4`), and links phpdbg from the CLI's
# objects (`PHP_BINARY_OBJS`, `Z/sapi/phpdbg/config.m4`), so the oracle's
# phpdbg loads every extension its CLI does (#1450, #3081).
php_bundle = { path = "../../crates/php_bundle", features = ["host"] }
php_sapi = { path = "../../crates/php_sapi" }
# The face its natives are declared with, as an extension declares its own
# (ADR-0008, #1348).
php_ext = { path = "../../crates/php_ext" }
