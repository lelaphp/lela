# sapi/phpdbg: php-src/sapi/phpdbg, one crate under `sapi/` (ADR-0008), laid
# down by `xtask new-sapi`: the binary `phpdbg`, the debugging host, which
# binds a tier of its own (#1308). Three edges, php_bundle, php_sapi, and
# php_ext for the natives its own extension declares (ADR-0008 as amended
# by #1348); the engine and its tier face are named through the facade
# alone.
[package]
name = "php_sapi_phpdbg"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "php's phpdbg host, the binary phpdbg"

[lints]
workspace = true

[[bin]]
name = "phpdbg"
path = "src/main.rs"

# The same binary with `php_engine`'s `witness-trace` on, which the witness
# lane builds and serves a fence with a `request phpdbg` through, and
# nothing else does (harness §8, revision 61).
[[bin]]
name = "phpdbg-witness"
path = "src/witness.rs"
required-features = ["witness-trace"]

[features]
# Every request appends the natives it entered to the file
# `PHP_WITNESS_TRACE` names (harness §4.5 condition 2, revision 61).
witness-trace = ["php_bundle/witness-trace", "php_sapi/witness-trace"]

[dependencies]
# The CLI's set (sapi/cli/Cargo.toml): php-src builds phpdbg beside the CLI
# with the same extensions.
php_bundle = { path = "../../crates/php_bundle", features = ["pcntl", "posix", "sockets", "bz2", "openssl", "bcmath", "calendar", "mbstring"] }
php_sapi = { path = "../../crates/php_sapi" }
# The face its natives are declared with, as an extension declares its own
# (ADR-0008, #1348).
php_ext = { path = "../../crates/php_ext" }
