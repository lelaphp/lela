# sapi/cli: php's CLI, `php-src/sapi/cli`, one crate under `sapi/` (ADR-0008),
# the binary `php`: the bundle's enabled set on one engine, the tier the
# bundle names, the command line read as php's CLI reads it. Two edges,
# php_bundle and php_sapi; the engine is named through the facade alone.
[package]
name = "php_sapi_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "php's CLI host, the binary php"

[lints]
workspace = true

[[bin]]
name = "php"
path = "src/main.rs"

# The same binary with `php_engine`'s `witness-trace` on, which the witness
# lane builds and serves a fence marked `process` through, and nothing else
# does: under a name of its own, so `target/*/php` stays the default build
# the phpt lane runs (harness §8, revision 61).
[[bin]]
name = "php-witness"
path = "src/witness.rs"
required-features = ["witness-trace"]

[features]
# Every request the binary serves appends the natives it entered to the file
# `PHP_WITNESS_TRACE` names (harness §4.5 condition 2, revision 61).
witness-trace = ["php_bundle/witness-trace", "php_sapi/witness-trace"]

[dependencies]
# The bundle's default set and nine it turns on: `pcntl` and `posix`,
# which php builds for the CLI and which no server host carries (design
# §7.2, revision 35), `sockets`, php's `--enable-sockets` (revision 36),
# `bz2`, php's `--with-bz2` (revision 39), `openssl`, php's
# `--with-openssl`, which the oracle is built with and ext/phar's
# OpenSSL signatures call into (#1108), `bcmath`, php's
# `--enable-bcmath`, which the oracle is built with (#1163, #1166),
# `calendar`, php's `--enable-calendar`, which the oracle is built with
# (#1163, #1206), `mbstring`, php's `--enable-mbstring`, which the
# oracle is built with (#1173, #1260), and `curl`, php's `--with-curl`,
# which the oracle is built with (#1238, #1324).
php_bundle = { path = "../../crates/php_bundle", features = ["pcntl", "posix", "sockets", "bz2", "openssl", "bcmath", "calendar", "mbstring", "curl"] }
php_sapi = { path = "../../crates/php_sapi" }
php_proto = { path = "../../crates/php_proto" }
# The C library in `src/ffi/` alone, for what the standard library does
# not answer: the local time the server's log writes (ADR-0008).
libc = { workspace = true }
