# sapi/cli: php's CLI, `php-src/sapi/cli`, one crate under `sapi/` (ADR-0008),
# the binary `php`: the bundle's enabled set on one engine, the tier the
# bundle names, the command line read as php's CLI reads it. Four edges,
# php_bundle, php_sapi, php_proto, and php_ext for the natives it declares
# itself (ADR-0008 as amended by #1348); the engine is named through the
# facade alone.
[package]
name = "php_sapi_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "php's CLI host, the binary php"

[lints]
workspace = true

[[bin]]
name = "php"
path = "src/main.rs"

# The engine the witness and crosscheck lanes serve a snippet through, in a
# process the harness starts and feeds snippet after snippet: the bundle's
# `linked` set beside this host's own, a fresh engine per snippet, and the
# natives each entered written beside what it printed (harness §8, revision
# 84; #2166). The harness links no engine of its own.
[[bin]]
name = "php-linked"
path = "src/linked.rs"
required-features = ["linked"]

[features]
# `php-linked`: the bundle's `linked` set, every extension but pcntl, on top
# of this host's own, which carries pcntl (harness §8, revision 84).
linked = ["php_bundle/linked", "php_bundle/test"]

[dependencies]
# The bundle's default set and twenty it turns on: `pcntl` and `posix`,
# which php builds for the CLI and which no server host carries (design
# §7.2, revision 35), `sockets`, php's `--enable-sockets` (revision 36),
# `bz2`, php's `--with-bz2` (revision 39), `openssl`, php's
# `--with-openssl`, which the oracle is built with and ext/phar's
# OpenSSL signatures call into (design §7.2, revision 97; #1108), `bcmath`, php's
# `--enable-bcmath`, which the oracle is built with (#1163, #1166),
# `calendar`, php's `--enable-calendar`, which the oracle is built with
# (#1163, #1206), `mbstring`, php's `--enable-mbstring`, which the
# oracle is built with (#1173, #1260), `curl`, php's `--with-curl`,
# which the oracle is built with (#1238, #1324), `exif`, php's
# `--enable-exif` (#1323, #1330), and `ftp`, `shmop`, `sysvsem`,
# `sysvmsg` and `sysvshm`, php's `--enable-ftp`, `--enable-shmop`,
# `--enable-sysvsem`, `--enable-sysvmsg` and `--enable-sysvshm`, which
# the oracle is built with (#1323), `pdo_mysql`, php's
# `--with-pdo-mysql`, over the `mysqlnd` it turns on (#1345, #1366), and
# `mysqli`, php's `--with-mysqli`, over the same `mysqlnd` (#1367),
# `dba`, php's `--enable-dba`, which the oracle is built with (#1451),
# `zip`, php's `--with-zip`, which the oracle is built with (#1515),
# `tidy`, php's `--with-tidy`, which the oracle is built with (#1540),
# `soap`, php's `--enable-soap`, which the oracle is built with (#1562),
# `gd`, php's `--enable-gd --with-external-gd`, which the oracle is built
# with (#1575), and
# `sodium`, php's `--with-sodium`, which the oracle is built with (#1566),
# `gettext`, php's `--with-gettext`, which the oracle is built with (#1568),
# `readline`, php's `--with-libedit`, which the oracle is built with (#1567),
# `ffi`, php's `--with-ffi`, which the oracle is built with (#1576), and
# `intl`, php's `--enable-intl`, which the oracle is built with (#1574).
php_bundle = { path = "../../crates/php_bundle", features = ["pcntl", "posix", "sockets", "bz2", "openssl", "bcmath", "calendar", "mbstring", "curl", "exif", "shmop", "sysvsem", "sysvmsg", "sysvshm", "ftp", "pdo_mysql", "mysqli", "dba", "zip", "gmp", "tidy", "soap", "gd", "sodium", "gettext", "readline", "ffi", "intl"] }
php_sapi = { path = "../../crates/php_sapi" }
# The face its `additional_functions` and the built-in server's module are
# declared with, as an extension declares its own (ADR-0008, #1348).
php_ext = { path = "../../crates/php_ext" }
php_proto = { path = "../../crates/php_proto" }
# The C library in `src/ffi/` alone, for what the standard library does
# not answer: the local time the server's log writes (ADR-0008).
libc = { workspace = true }
