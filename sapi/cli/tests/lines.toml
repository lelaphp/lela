# An archive phar's `zend_compile_file` answers as `auto_prepend_file`:
# `phar_compile_file` puts the stub's stream in the `zend_file_handle`'s
# place, and over an uncompressed tar that stream reads the archive itself,
# so the archive is held open, with no `O_CLOEXEC`, until
# `php_execute_script_ex` destroys the handle once the append file has run,
# before the shutdown functions; a gzipped archive's stub reads a
# decompressed copy, and nothing of the archive is held (#2561). The first
# run lays the two archives down.
[[line]]
name = "an-archive-phar-auto-file-is-held-while-the-program-runs"
args = ["-n", "mk.php"]
files = { "mk.php" = '''
<?php
function member($name, $data) {
    $h = pack('a100a8a8a8a12a12a8a1a100a6a2a247', $name, '0000644', '', '', sprintf('%011o', strlen($data)), '00000000000', '        ', '0', '', 'ustar', '00', '');
    $h = substr_replace($h, sprintf('%06o', array_sum(array_map('ord', str_split($h)))) . "\0 ", 148, 8);
    return $h . str_pad($data, (strlen($data) + 511) & ~511, "\0");
}
$stub = '<?php require dirname(__FILE__) . "/lib.php"; $f = __FILE__; register_shutdown_function(fn () => print("shutdown " . held($f) . "\n")); echo "prepend ", held($f), "\n"; __HALT_COMPILER();';
$tar = member('.phar/stub.php', $stub);
$tar .= member('.phar/signature.bin', pack('VV', 2, 20) . sha1($tar, true)) . str_repeat("\0", 1024);
file_put_contents(__DIR__ . '/pre.phar.tar', $tar);
file_put_contents(__DIR__ . '/gz.phar.tar.gz', gzencode($tar));
''', "lib.php" = '''<?php function held($f) { $l = shell_exec("ls -iLd /dev/fd/* 2>/dev/null"); return preg_match_all("/^ *" . fileinode($f) . " /m", $l); }''', "t.php" = '''<?php echo "program ", held(__DIR__ . "/pre.phar.tar") + held(__DIR__ . "/gz.phar.tar.gz"), "\n";''', "app.php" = '''<?php echo "append ", held(__DIR__ . "/pre.phar.tar") + held(__DIR__ . "/gz.phar.tar.gz"), "\n";''' }
[[line.then]]
args = ["-n", "-d", "auto_prepend_file={dir}/pre.phar.tar", "-d", "auto_append_file={dir}/app.php", "t.php"]
[[line.then]]
args = ["-n", "-d", "auto_prepend_file={dir}/gz.phar.tar.gz", "-d", "auto_append_file={dir}/app.php", "t.php"]
