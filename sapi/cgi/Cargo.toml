# sapi/cgi: php's CGI, `php-src/sapi/cgi`, one crate under `sapi/` (ADR-0008),
# the binary `php-cgi`: the bundle's enabled set on one engine with
# `cgi-fcgi` after it, the request the server describes in the environment.
# Four edges, php_bundle, php_sapi, php_proto for the CGI environment's
# codec, and php_ext for the natives its own extension declares (ADR-0008
# as amended by #1348); the engine is named through the facade alone.
[package]
name = "php_sapi_cgi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "php's CGI host, the binary php-cgi"

[lints]
workspace = true

[[bin]]
name = "php-cgi"
path = "src/main.rs"

[dependencies]
# The bundle's default set and `one_thread`, the set a host serving on
# one thread links, whose comment and `host`'s say why each (#1477, #3081).
php_bundle = { path = "../../crates/php_bundle", features = ["one_thread"] }
php_proto = { path = "../../crates/php_proto" }
php_sapi = { path = "../../crates/php_sapi" }
# The face `cgi_module_entry`'s natives are declared with, as an extension
# declares its own (ADR-0008, #1348).
php_ext = { path = "../../crates/php_ext" }
# `-b`'s `FastCGI` server: its socket, the children it forks and waits
# for, and the stop signals its parent ends them on, safe where `nix` wraps
# them and in `src/ffi/` where it does not (`fastcgi_cleanup`'s
# `sigaction`).
nix = { workspace = true, features = ["socket", "net", "process", "signal"] }
libc = { workspace = true }

[dev-dependencies]
# The peak resident set of the php-cgi a test ran, `getrusage(RUSAGE_CHILDREN)`
# (tests/content_length.rs, #3457).
nix = { workspace = true, features = ["resource"] }
