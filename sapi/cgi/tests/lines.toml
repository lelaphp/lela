# php-cgi's own lines, each run by `xtask witness` under the pinned php-cgi
# (oracle.toml's [sapi]) and then under this crate's, in one directory laid
# afresh, and held equal: what a fence cannot carry, an ini of the line's
# own (#1634), a file laid before the run, a startup that ends the process
# (#1975, as #2468 ruled). No byte here is the oracle's; the oracle's run is
# the expectation. The grammar is xtask/src/witness/host.rs's.

# `-i` is php-cgi's `php_print_info` in a request of its own
# (`Z/sapi/cgi/cgi_main.c`, `case 'i'`), printed before `main` would open a
# primary script or read stdin: whether the line names a file that does not
# exist or none at all, the page is phpinfo's under the head, and the status
# 0. The page past its doctype names the build, which is not the oracle's.
[[line]]
name = "info-opens-no-program"
args = ["-n", "-i"]
mask = [['(?s)<!DOCTYPE html.*?(\n== run)', '<!DOCTYPE html (the page)$1']]
[[line.then]]
args = ["-n", "-i", "{dir}/missing.php"]

# php-cgi reads its own `cgi.*` entries from the engine's ini, a php.ini's
# value included, as `INI_BOOL` and `CGIG()` read them in php: a `-c` file's
# `cgi.check_shebang_line=0` leaves a `#!` line in the output, and its
# `cgi.redirect_status_env` names the variable the redirect check asks for
# (#1693).
[[line]]
name = "ini-file-entries"
args = ["-c", "{dir}/php.ini", "sb.php", "a=1"]
env = { PHP_INI_SCAN_DIR = "{dir}/scan" }
files = { "scan/" = "", "php.ini" = "cgi.redirect_status_env=MY_STATUS\ncgi.check_shebang_line=0\n", "sb.php" = "#!/usr/bin/php\n<?php var_dump($_GET);\n" }
[[line.then]]
args = ["-c", "{dir}/php.ini"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/sb.php" }

# A php.ini's `[HOST=]` table of the request's `SERVER_NAME`, lowered, and its
# `[PATH=]` tables along the script's directory, set at `sapi_cgi_activate`
# as `PHP_INI_SYSTEM`, so `ini_set` refuses them after (#1692).
[[line]]
name = "ini-sections-host-and-directories"
args = ["-c", "{dir}/php.ini"]
env = { PHP_INI_SCAN_DIR = "{dir}/scan", REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/www/sub/t.php", SERVER_NAME = "Example.com" }
files = { "scan/" = "", "php.ini" = "precision=10\n[PATH={dir}/www]\nprecision=5\n[PATH={dir}/www/sub/]\nprecision=3\n[HOST=Example.COM]\nserialize_precision=7\n", "www/sub/t.php" = "<?php var_dump(ini_get('precision'), ini_get('serialize_precision'), ini_set('precision', '9'));\n", "www/t.php" = "<?php var_dump(ini_get('precision'), ini_get('serialize_precision'), ini_set('precision', '9'));\n" }
[[line.then]]
args = ["-c", "{dir}/php.ini"]
env = { SCRIPT_FILENAME = "{dir}/www/t.php", SERVER_NAME = "other" }

# A refusal answered after every extension started, at `zend_post_startup`
# inside `php_module_startup`: opcache's `ACCEL_LOG_FATAL` in
# `accel_post_startup` for `opcache.file_cache_only` with no
# `opcache.file_cache`. php ends the process there, before `main` reads its
# line further, so the file named on the line is never opened and no head is
# written (#1943). `zend_accel_error` writes the time `asctime` prints and the
# process's id before its message.
[[line]]
name = "post-startup-refused"
args = ["-n", "-d", "opcache.file_cache_only=1", "/nonexistent/t.php"]
mask = [['(?m)^.{24} \(\d+\): ', '<asctime> (<pid>): ']]

# The request `opcache.preload`'s file is served in sends no head:
# `accel_finish_startup_preload` sets `SG(headers_sent)` and
# `SG(request_info).no_headers` once it started, so what the file echoes
# reaches stdout bare and its `header()` reaches no one (#1633).
[[line]]
name = "preload-sends-no-head"
args = ["-n", "-q", "-d", "opcache.enable=1", "-d", "opcache.preload={dir}/preload.php", "{dir}/main.php"]
files = { "preload.php" = "<?php header('X-A: 1'); echo \"pre\\n\"; function pf() { return 1; }\n", "main.php" = "<?php echo pf(), \"\\n\";\n" }
[[line.then]]
args = ["-n", "-d", "opcache.enable=1", "-d", "opcache.preload={dir}/preload.php", "{dir}/main.php"]

# `cgi.redirect_status_env` set to the empty string, by a php.ini or by `-d`,
# names a variable no environment has, so a server's request is refused with
# the Security Alert, as `CGIG(redirect_status_env)` set to `""` refuses it;
# unset, the entry is `NULL` and `REDIRECT_STATUS` lets the request through
# (#1698).
[[line]]
name = "redirect-status-env-empty-or-unset"
args = ["-c", "{dir}/php.ini"]
env = { PHP_INI_SCAN_DIR = "{dir}/scan", REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/t.php" }
files = { "scan/" = "", "t.php" = "<?php echo \"ok\\n\";\n", "php.ini" = "cgi.redirect_status_env=\n" }
[[line.then]]
args = ["-n", "-d", "cgi.redirect_status_env="]
[[line.then]]
args = ["-n"]

# A request whose start fails: an extension's `rinit` raises, which is php's
# fatal inside `RINIT` (#1775). Session's, under `session.auto_start`, over a
# session file whose `DateTime` does not unserialize: the throwable is
# rendered as the uncaught fatal with no frame standing, session's warning
# that the data did not decode follows it, and php-cgi's `main` returns
# `FAILURE` where `php_request_startup` failed
# (`Z/sapi/cgi/cgi_main.c:2460-2467`), the program never run and no
# request-end phase served, so the session's file, destroyed as the data
# failed, is not written again (#1879).
[[line]]
name = "start-failed-ends-before-the-program"
args = ["-n", "-d", "session.auto_start=1", "-d", "session.save_path={dir}", "{dir}/t.php"]
env = { HTTP_COOKIE = "PHPSESSID=t1879" }
files = { "t.php" = "<?php echo \"ran\\n\";", "sess_t1879" = "x|O:8:\"DateTime\":1:{s:4:\"date\";i:5;}" }

# `-q` and `-l` set `no_headers` only once `php_request_startup` returned
# (`Z/sapi/cgi/cgi_main.c:2468-2471`), so the failure's output commits the
# head under them too; `-l` writes no verdict.
[[line]]
name = "start-failed-commits-the-head-under-q"
args = ["-n", "-d", "session.auto_start=1", "-d", "session.save_path={dir}", "-q", "{dir}/t.php"]
env = { HTTP_COOKIE = "PHPSESSID=t1879" }
files = { "t.php" = "<?php echo \"ran\\n\";", "sess_t1879" = "x|O:8:\"DateTime\":1:{s:4:\"date\";i:5;}" }

[[line]]
name = "start-failed-commits-the-head-under-l"
args = ["-n", "-d", "session.auto_start=1", "-d", "session.save_path={dir}", "-l", "{dir}/t.php"]
env = { HTTP_COOKIE = "PHPSESSID=t1879" }
files = { "t.php" = "<?php echo \"ran\\n\";", "sess_t1879" = "x|O:8:\"DateTime\":1:{s:4:\"date\";i:5;}" }

# What a buffer `output_buffering` started still holds is never flushed,
# since no `php_request_shutdown` ends the buffers: nothing at all is
# written, not even the head.
[[line]]
name = "start-failed-buffered-writes-nothing"
args = ["-n", "-d", "session.auto_start=1", "-d", "session.save_path={dir}", "-d", "output_buffering=4096", "{dir}/t.php"]
env = { HTTP_COOKIE = "PHPSESSID=t1879" }
files = { "t.php" = "<?php echo \"ran\\n\";", "sess_t1879" = "x|O:8:\"DateTime\":1:{s:4:\"date\";i:5;}" }

# php-cgi opens the primary script only once `php_request_startup` has
# returned (`Z/sapi/cgi/cgi_main.c:2460-2487`), so a start that fails over a
# missing script writes what the failure wrote under a head with no
# `Status:` line, and never `No input file specified.`; a server's request
# with no path translated carries the 404 `init_request_info` set before the
# start, and nothing more (#2272).
[[line]]
name = "start-failed-over-a-missing-script"
args = ["-n", "-d", "session.auto_start=1", "-d", "session.save_path={dir}", "{dir}/missing.php"]
env = { HTTP_COOKIE = "PHPSESSID=t1879" }
files = { "t.php" = "<?php echo \"ran\\n\";", "sess_t1879" = "x|O:8:\"DateTime\":1:{s:4:\"date\";i:5;}" }

[[line]]
name = "start-failed-over-a-missing-script-served"
args = ["-n", "-d", "cgi.fix_pathinfo=0", "-d", "session.auto_start=1", "-d", "session.save_path={dir}"]
env = { HTTP_COOKIE = "PHPSESSID=t1879", GATEWAY_INTERFACE = "CGI/1.1", REDIRECT_STATUS = "200", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/missing.php" }
files = { "t.php" = "<?php echo \"ran\\n\";", "sess_t1879" = "x|O:8:\"DateTime\":1:{s:4:\"date\";i:5;}" }

# An extension whose engine start refuses, php's `MINIT` returning `FAILURE`
# (ADR-0010): `ffi.preload` naming a header that is not there. php ends the
# process from `php_error_cb`, `exit(-2)` for the `E_CORE_ERROR` of a failed
# `MINIT` (`Z/main/main.c:1505-1507`), before the host does anything of its
# own: the diagnostics on stdout in php-cgi's `html_errors`, no head before
# them, the file named on the line never opened (#1802). `-h` is answered
# after php has started, so the refusal stands in its place.
[[line]]
name = "startup-refused"
args = ["-n", "-d", "ffi.preload=/nonexistent/startup-refused.h", "/nonexistent/t.php"]
[[line.then]]
args = ["-n", "-d", "ffi.preload=/nonexistent/startup-refused.h", "-h"]

# `.user.ini` read in each directory from `DOCUMENT_ROOT` down to the
# script's, or in the script's alone outside the root, and set after the
# php.ini's `[PATH=]` tables as `PHP_INI_PERDIR` at the htaccess stage: a
# deeper file's value wins, a `[PATH=]` entry is not overridden, a
# `PHP_INI_SYSTEM` entry is refused, and a `PHP_INI_ALL` one still changes at
# runtime (#1699).
[[line]]
name = "user-ini-from-the-root-down"
args = ["-c", "{dir}/php.ini"]
env = { PHP_INI_SCAN_DIR = "{dir}/scan", REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", DOCUMENT_ROOT = "{dir}/www/", SCRIPT_FILENAME = "{dir}/www/sub/t.php" }
files = { "scan/" = "", "php.ini" = "[PATH={dir}/www/sub]\nprecision=3\n", ".user.ini" = "precision=5\nserialize_precision=5\nmax_input_time=11\n", "www/.user.ini" = "serialize_precision=6\ndefault_mimetype=\"text/plain\"\nallow_url_fopen=0\n", "www/sub/.user.ini" = "serialize_precision=7\nmax_input_time=12\nprecision=8\n", "out/.user.ini" = "serialize_precision=4\n", "www/sub/t.php" = "<?php var_dump(ini_get(\"precision\"), ini_get(\"serialize_precision\"), ini_get(\"max_input_time\"), ini_get(\"allow_url_fopen\"), ini_set(\"serialize_precision\", \"9\"), ini_get(\"default_mimetype\"));\n", "www/t.php" = "<?php var_dump(ini_get(\"precision\"), ini_get(\"serialize_precision\"), ini_get(\"max_input_time\"), ini_get(\"allow_url_fopen\"), ini_set(\"serialize_precision\", \"9\"), ini_get(\"default_mimetype\"));\n", "out/t.php" = "<?php var_dump(ini_get(\"precision\"), ini_get(\"serialize_precision\"), ini_get(\"max_input_time\"), ini_get(\"allow_url_fopen\"), ini_set(\"serialize_precision\", \"9\"), ini_get(\"default_mimetype\"));\n" }
[[line.then]]
args = ["-c", "{dir}/php.ini"]
env = { SCRIPT_FILENAME = "{dir}/www/t.php" }
[[line.then]]
args = ["-c", "{dir}/php.ini"]
env = { SCRIPT_FILENAME = "{dir}/out/t.php" }

# A request starts in the process's working directory, and
# `php_execute_script` enters the program's by the name it was given,
# relative or whole, and leaves it once the program has been served, so
# shutdown functions and destructors run where the request started; `-C` is
# `SAPI_OPTION_NO_CHDIR` (`Z/sapi/cgi/cgi_main.c:2304`), and the program is
# served where the process stands (#2748).
[[line]]
name = "a-request-enters-the-program-directory-and-leaves-it-before-shutdown"
args = ["-n", "www/t.php"]
files = { "at.php" = '''
<?php
function at() {
    $cwd = getcwd();
    return match (true) { $cwd === __DIR__ . '/www' => 'program', $cwd === __DIR__ => 'start', default => basename($cwd) };
}
''', "www/t.php" = '''
<?php
require_once __DIR__ . '/../at.php';
echo 'run ', at(), "\n";
register_shutdown_function(fn () => print('shutdown ' . at() . "\n"));
$o = new class { function __destruct() { echo 'destructor ', at(), "\n"; } };
''' }
[[line.then]]
args = ["-n", "-C", "www/t.php"]
[[line.then]]
args = ["-n"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/www/t.php" }

# php-cgi's `php_fopen_primary_script` leaves the program's handle an
# `opened_path`, so `php_execute_script_ex` does not put it in
# `EG(included_files)` before `auto_prepend_file`; `zend_execute_script`
# does once the program has compiled (`Z/Zend/zend.c:1971-1974`), after the
# prepend file (#2558). The prepend file and the program each print the
# table's names.
[[line]]
name = "the-program-is-noted-as-it-compiles-after-the-prepend-file"
args = ["-n", "-d", "auto_prepend_file={dir}/pre.php"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/t.php" }
files = { "pre.php" = '''<?php echo basename(__FILE__), " ", implode(",", array_map("basename", get_included_files())), "\n";''', "t.php" = '''<?php echo basename(__FILE__), " ", implode(",", array_map("basename", get_included_files())), "\n";''' }
[[line.then]]
args = ["-n", "-d", "auto_prepend_file={dir}/pre.php", "{dir}/t.php"]

# php-cgi `-b`, its FastCGI server (`Z/sapi/cgi/cgi_main.c:1931-2140`): the
# socket bound where the switch names, each request's variables read from its
# `FCGI_PARAMS` as `init_request_info` reads them, its body from its
# `FCGI_STDIN`, and a file that does not open answered with php's page; the
# process serves until it is stopped (#2792).
[[line]]
name = "fastcgi-serves-requests-on-its-port"
args = ["-n", "-b", "127.0.0.1:{port}"]
files = { "t.php" = "<?php echo php_sapi_name(), ' ', $_GET['q'] ?? '-', ' ', $_SERVER['REQUEST_METHOD'], ' ', json_encode($_POST), ' ', file_get_contents('php://input'), \"\\n\";" }
[line.serve]
listen = "127.0.0.1:{port}"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/t.php"], ["REQUEST_METHOD", "GET"], ["QUERY_STRING", "q=1"]]
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/t.php"], ["REQUEST_METHOD", "POST"], ["CONTENT_TYPE", "application/x-www-form-urlencoded"], ["CONTENT_LENGTH", "7"]]
body = "a=1&b=2"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/missing.php"], ["REQUEST_METHOD", "GET"]]

# A FastCGI parameter holding a NUL is read up to it, as php-fpm reads one
# (#2757): `init_request_info` and the loop read each through a `char *`, and
# `$_SERVER` registers each through `strlen`.
[[line]]
name = "fastcgi-a-parameter-holding-a-nul-is-read-up-to-it"
args = ["-n", "-b", "127.0.0.1:{port}"]
files = { "a.txt" = "hello\n", "run.php" = '''
<?php
echo "ran\n";
foreach ($_SERVER as $name => $value) {
    if (is_string($value) && (str_contains($value, "\0") || str_contains($value, 'run.php') || str_starts_with($name, 'ORIG_') || $name === 'QUERY_STRING')) echo $name, ' ', json_encode($value), "\n";
}
var_dump($_GET, getallheaders()['X-A'] ?? null, getenv('QUERY_STRING'));
''' }
[line.serve]
listen = "127.0.0.1:{port}"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/run.php\u0000.txt"], ["REQUEST_METHOD", "GET"], ["SCRIPT_NAME", "/run.php\u0000.txt"], ["QUERY_STRING", "a=1\u0000&b=2"], ["HTTP_X_A", "b\u0000c"]]
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/run.php\u0000"], ["REQUEST_METHOD", "GET"]]
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/a.txt\u0000.php"], ["REQUEST_METHOD", "GET"]]

# `PHP_FCGI_CHILDREN` and `PHP_FCGI_MAX_REQUESTS` are read with `atoi` once
# the socket is bound, and a negative one is refused with php's line and
# `FAILURE`.
[[line]]
name = "fastcgi-a-negative-children-count-is-refused"
args = ["-n", "-b", "127.0.0.1:{port}"]
env = { PHP_FCGI_CHILDREN = "-1" }
[[line.then]]
args = ["-n", "-b", "127.0.0.1:{port}"]
env = { PHP_FCGI_CHILDREN = "", PHP_FCGI_MAX_REQUESTS = "-2" }

# `PHP_FCGI_MAX_REQUESTS=1`: the process serves one request and ends, with
# the request's exit status.
[[line]]
name = "fastcgi-max-requests-ends-the-process"
args = ["-n", "-b", "127.0.0.1:{port}"]
env = { PHP_FCGI_MAX_REQUESTS = "1" }
files = { "t.php" = "<?php echo \"one\\n\"; exit(3);" }
[line.serve]
listen = "127.0.0.1:{port}"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/t.php"], ["REQUEST_METHOD", "GET"]]

# `PHP_FCGI_CHILDREN=2`: the parent forks two children in a process group of
# its own, each serving, and its stop ends the group whole
# (`fastcgi_cleanup`).
[[line]]
name = "fastcgi-children-serve-and-end-with-the-parent"
args = ["-n", "-b", "127.0.0.1:{port}"]
env = { PHP_FCGI_CHILDREN = "2" }
files = { "t.php" = "<?php echo \"served\\n\";" }
[line.serve]
listen = "127.0.0.1:{port}"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/t.php"], ["REQUEST_METHOD", "GET"]]
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/t.php"], ["REQUEST_METHOD", "GET"]]

# A `-b` address `fcgi_listen` cannot bind or listen on is said twice:
# `fcgi_listen`'s `Cannot bind/listen socket - [<errno>] <strerror>.`
# (`Z/main/fastcgi.c:756`), then cgi_main's `Couldn't create FastCGI listen
# socket on port <address>`, and `FAILURE` (#3860): an address the host
# cannot assign, and a Unix socket in a directory that does not exist.
[[line]]
name = "fastcgi-an-address-that-cannot-be-bound-is-said-before-the-refusal"
args = ["-n", "-b", "192.0.2.1:{port}"]
[[line.then]]
args = ["-n", "-b", "{dir}/missing/php.sock"]

# A Unix socket path `sun_path` cannot hold with its NUL, of its length or
# more, is refused before a socket is made with `Listening socket's path
# name is too long.` (`Z/main/fastcgi.c:733`, #3860): one far past it, and
# one of exactly 104 bytes, `sun_path`'s length on macOS.
[[line]]
name = "fastcgi-a-unix-socket-path-past-sun-path-is-refused"
args = ["-n", "-b", "{dir}/a-socket-path-far-past-what-sun-path-holds-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.sock"]
[[line.then]]
args = ["-n", "-b", "/tmp/a-path-of-exactly-sun-path-s-length-yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"]

# A Unix socket's path is unlinked before the socket is made (`unlink(path)`,
# `Z/main/fastcgi.c:744`, #3866): a file left at the path, as a run that was
# killed leaves its socket, is replaced by the socket bound, which serves, and
# no regular file stands at the path after.
[[line]]
name = "fastcgi-a-file-at-the-unix-socket-path-is-replaced"
args = ["-n", "-b", "{dir}/php.sock"]
files = { "php.sock" = "stale\n", "t.php" = "<?php echo \"served\\n\";" }
[line.serve]
listen = "{dir}/php.sock"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/t.php"], ["REQUEST_METHOD", "GET"]]

# A `-b` port is read into `fcgi_listen`'s `short` (`Z/main/fastcgi.c:660`,
# #3867), and `65536`'s low 16 bits are 0, which is no port: the whole
# address names a Unix socket in the directory the process starts in, which
# serves.
[[line]]
name = "fastcgi-a-port-whose-low-16-bits-are-0-names-a-unix-socket"
args = ["-n", "-b", "127.0.0.1:65536"]
files = { "t.php" = "<?php echo \"served\\n\";" }
[line.serve]
listen = "{dir}/127.0.0.1:65536"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/t.php"], ["REQUEST_METHOD", "GET"]]

# A `-b` host is TCP's only while it is shorter than `MAXPATHLEN`, 1024
# bytes on macOS, as `fcgi_listen`'s `(s-path) < MAXPATHLEN` judges it
# (`Z/main/fastcgi.c:661`, #3882): a host of exactly 1024 bytes makes the
# whole address a Unix socket's path, which `sun_path` refuses as too long,
# and one of 1023 bytes stays a host, which no lookup resolves.
[[line]]
name = "fastcgi-a-host-of-maxpathlen-bytes-names-a-unix-socket"
args = ["-n", "-b", ":9000"]
[[line.then]]
args = ["-n", "-b", ":9000"]

# What php displays while it starts goes to C's `stdout`, an `fwrite`
# (`php_output_direct`, `php_output_stdout`), fully buffered where stdout is
# a pipe, while the head and the body go out past it with `write(2)`
# (`sapi_cgi_single_write`): so a startup warning reaches the pipe after
# them, where the request's end flushes stdout (`sapi_cgi_deactivate`), or
# where the program's `flush()` does (`sapi_cgi_flush`). The usage and a
# refused redirect's alert, written with no request started, are buffered
# behind it, and `-a`'s line is flushed with it (#2899).
[[line]]
name = "a-startup-warning-is-held-behind-the-body"
args = ["-n", "-d", "date.timezone=Foo/Bar", "b.php"]
files = { "b.php" = "<?php echo \"body\\n\";\n", "f.php" = "<?php echo \"a\\n\"; flush(); echo \"b\\n\";\n" }
[[line.then]]
args = ["-n", "-d", "date.timezone=Foo/Bar", "f.php"]
[[line.then]]
args = ["-n", "-d", "date.timezone=Foo/Bar", "-h"]
[[line.then]]
args = ["-n", "-d", "date.timezone=Foo/Bar", "-a", "b.php"]
[[line.then]]
args = ["-n", "-d", "date.timezone=Foo/Bar", "-d", "cgi.redirect_status_env="]
env = { GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/b.php" }

# php-cgi's copy of the program's path stands while the program runs, the
# one `init_request_info` `estrdup`s from a server's `SCRIPT_FILENAME` or
# the one `main` makes of the file a shell named (`-f`'s or the first
# word's, `Z/sapi/cgi/cgi_main.c:2315, 2404`), and it is freed before the
# request shuts down, with the program's handle, which php-cgi destroys
# whether or not the scanner listed it (`:2558`): the last line and the
# shutdown function read the same under both (#3059).
[[line]]
name = "the-program-s-path-copy-and-handle-are-freed-before-the-shutdown-functions"
args = ["-n", "-d", "opcache.file_update_protection=0", "end.php"]
files = { "end.php" = '<?php register_shutdown_function(function () { echo "shutdown ", memory_get_usage(), "\n"; }); $o = new class { function __destruct() { echo "destructor ", memory_get_usage(), "\n"; } }; echo "last ", memory_get_usage(), "\n";' }
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=0", "-f", "{dir}/end.php"]
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/end.php" }

# php's `zend_mm_hard_limit_error` writes its line to stderr and
# `_exit(137)`s (`Z/Zend/zend_alloc.c:519`), so nothing of
# `php_request_shutdown` runs: a head not yet sent is never sent, and what a
# buffer held is dropped. The engine ends the request there
# (`Ending::Terminated`) and a one-request host writes no head after it
# (#3435, trace:hard-limit-ends-request).
[[line]]
name = "hard-limit-sends-no-head"
args = ["-n", "-d", "memory_limit=128M", "{dir}/t.php"]
files = { "t.php" = "<?php\nob_start();\nheader('X-A: 1');\necho \"body\\n\";\nhash_pbkdf2('md5', 'p', 's', 1, PHP_INT_MAX);\n" }

# The header callback `header_register_callback` named runs where the head
# is sent, `sapi_send_headers`, which the request's output deactivation
# reaches in `php_request_shutdown`; the hard limit's `_exit(137)` comes
# before it, so the callback never runs and what it would write is never
# written (#3435).
[[line]]
name = "hard-limit-runs-no-header-callback"
args = ["-n", "-d", "memory_limit=128M", "{dir}/t.php"]
files = { "t.php" = "<?php\nheader_register_callback(function () { echo \"cb\\n\"; fwrite(STDERR, \"cb\\n\"); });\nob_start();\necho \"body\\n\";\nhash_pbkdf2('md5', 'p', 's', 1, PHP_INT_MAX);\n" }

# A negative `CONTENT_LENGTH` is read to the body's end, stdin's under CGI
# and `FCGI_STDIN`'s under FastCGI: `sapi_cgi_read_post` and
# `sapi_fcgi_read_post` take what the length leaves as a `size_t`, which
# wraps in the pinned release build, whose `assert` on it is compiled out
# (`Z/sapi/cgi/cgi_main.c:483, 509`). The readers that pull it hold it to
# `post_max_size`: the form reader stops a block past it with php's
# warning (`Z/main/SAPI.c:287`) and `php://input` reads the rest, and the
# multipart reader reads its fields as from a declared length (#3457).
# Under FastCGI php's `fcgi_read` goes on past the empty record that ends
# the body, to the next record's header, and so waits until the web server
# shuts its half of the connection, as these requests do: the engine's
# reads end at that record, and answer whether or not the server shuts it.
[[line]]
name = "a-negative-content-length-reads-the-body-to-its-end"
args = ["-n", "-d", "html_errors=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/p.php", CONTENT_TYPE = "application/x-www-form-urlencoded", CONTENT_LENGTH = "-1" }
files = { "p.php" = "<?php var_dump($_POST, file_get_contents('php://input'));\n" }
stdin = "x=hello&y=world"

[[line]]
name = "a-negative-content-length-is-held-to-post-max-size"
args = ["-n", "-d", "html_errors=0", "-d", "post_max_size=10"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/p.php", CONTENT_TYPE = "application/x-www-form-urlencoded", CONTENT_LENGTH = "-5" }
files = { "p.php" = "<?php var_dump($_POST, file_get_contents('php://input'));\n" }
stdin = "x=hello&y=world&z=12"

[[line]]
name = "a-negative-content-length-reads-a-multipart-body-to-its-end"
args = ["-n", "-d", "html_errors=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/p.php", CONTENT_TYPE = "multipart/form-data; boundary=b", CONTENT_LENGTH = "-1" }
files = { "p.php" = "<?php var_dump($_POST, file_get_contents('php://input'));\n" }
stdin = "--b\r\nContent-Disposition: form-data; name=\"x\"\r\n\r\nhello\r\n--b--\r\n"

[[line]]
name = "fastcgi-a-negative-content-length-reads-fcgi-stdin-to-its-end"
args = ["-n", "-d", "html_errors=0", "-b", "127.0.0.1:{port}"]
files = { "p.php" = "<?php var_dump($_POST, file_get_contents('php://input'));\n" }
[line.serve]
listen = "127.0.0.1:{port}"
stop = "SIGTERM"
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/p.php"], ["REQUEST_METHOD", "POST"], ["CONTENT_TYPE", "application/x-www-form-urlencoded"], ["CONTENT_LENGTH", "-1"]]
body = "x=hello&y=world"
shut = true
[[line.serve.request]]
params = [["SCRIPT_FILENAME", "{dir}/p.php"], ["REQUEST_METHOD", "POST"], ["CONTENT_TYPE", "multipart/form-data; boundary=b"], ["CONTENT_LENGTH", "-1"]]
body = "--b\r\nContent-Disposition: form-data; name=\"x\"\r\n\r\nhello\r\n--b--\r\n"
shut = true

# What a body costs the program's `memory_get_usage()` at its first line,
# as php-cgi 8.5.12 counts it (#3439): the form reader buffers the body in
# a temp stream, `php_stream_temp_create_ex(TEMP_STREAM_DEFAULT,
# SAPI_POST_BLOCK_SIZE, PG(upload_tmp_dir))` (`Z/main/SAPI.c:264`), two
# streams and two resources on the request's heap until its end, so the
# program's first `fopen()` is resource 5 where a `GET`'s is 3, and its
# memory stream's string holds the body; the content type's copy
# (`content_type_dup`) stands until a handler frees it, so a type no
# handler takes keeps it to the request's end; and a multipart body's
# field is registered as `php_register_variable_ex` registers it. Each
# runs under the witness runner's environment, which `$_SERVER` and
# `$_ENV` would register, and with the program cached however new its file
# is, the regime the engine's unit cache copies.
[[line]]
name = "an-urlencoded-field-costs-what-php-cgi-counts"
args = ["-n", "-d", "opcache.file_update_protection=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/m.php", CONTENT_TYPE = "application/x-www-form-urlencoded", CONTENT_LENGTH = "7" }
files = { "m.php" = "<?php echo memory_get_usage(), \"\\n\"; var_dump(fopen('php://memory', 'r'));\n" }
stdin = "x=hello"

[[line]]
name = "a-multipart-field-costs-what-php-cgi-counts"
args = ["-n", "-d", "opcache.file_update_protection=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/m.php", CONTENT_TYPE = "multipart/form-data; boundary=b", CONTENT_LENGTH = "63" }
files = { "m.php" = "<?php echo memory_get_usage(), \"\\n\";\n" }
stdin = "--b\r\nContent-Disposition: form-data; name=\"x\"\r\n\r\nhello\r\n--b--\r\n"

[[line]]
name = "a-multipart-closing-boundary-costs-what-php-cgi-counts"
args = ["-n", "-d", "opcache.file_update_protection=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/m.php", CONTENT_TYPE = "multipart/form-data; boundary=b", CONTENT_LENGTH = "5" }
files = { "m.php" = "<?php echo memory_get_usage(), \"\\n\";\n" }
stdin = "--b--"

[[line]]
name = "a-body-no-handler-takes-keeps-its-content-type-s-copy"
args = ["-n", "-d", "opcache.file_update_protection=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/m.php", CONTENT_TYPE = "application/json; charset=utf-8", CONTENT_LENGTH = "7" }
files = { "m.php" = "<?php echo memory_get_usage(), \"\\n\";\n" }
stdin = "x=hello"

# And what a form `POST` peaks at by the program's first line, as php-cgi
# 8.5.12 counts it (#3793): not the form's reading, whose temp stream and
# variables stand below it, but opcache's compile of the program, whose
# `zend_optimize_script` lays its arena, `zend_arena_create(64 * 1024)`
# (`Z/Zend/Optimizer/zend_optimizer.c:1606`), beside the op arrays it
# optimizes, the primary file's buffer and the compiler's stacks; a `GET`
# peaks there too.
[[line]]
name = "a-form-post-peaks-where-php-cgi-s-optimizer-does"
args = ["-n", "-d", "opcache.file_update_protection=0"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "POST", SCRIPT_FILENAME = "{dir}/m.php", CONTENT_TYPE = "application/x-www-form-urlencoded", CONTENT_LENGTH = "7" }
files = { "m.php" = "<?php echo memory_get_peak_usage(), \"\\n\";\n" }
stdin = "x=hello"
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=0"]
env = { REQUEST_METHOD = "GET", CONTENT_TYPE = "", CONTENT_LENGTH = "" }

# And what a `GET` reads at the program's first line where php-cgi 8.5.12
# compiles the program without persisting it, as it does a file written
# within `opcache.file_update_protection` (#3805): `zend_compile` lays
# `CG(ast_arena)`, the scanner's strings and stacks, the main op array, its
# oplines and literals and `FC(seen_symbols)`, and `pass_two` packs the
# oplines beside them, so the peak is that window's and the usage is the
# main op array's blocks after it, its filename the string
# `EG(included_files)` keeps. The second program declares a class and a
# function before any statement, which php compiles at their place, as the
# window lays them (#3822). The protection here is long enough that the
# file laid before the run is new to both binaries.
[[line]]
name = "a-get-of-a-program-php-cgi-compiles-without-persisting-it"
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/m.php" }
files = { "m.php" = "<?php echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n", "d.php" = "<?php class C {} function f() {} echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n" }
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { SCRIPT_FILENAME = "{dir}/d.php" }

# The declarations of such a program laid at their place among its
# statements (#3822): php compiles a function where it stands, with the
# variable and the constant the statement before it laid standing in the
# main op array, and a closure inside a method while the method's oplines
# stand, so the peak is the closure's `pass_two` beside the method's
# 2048-byte oplines and the main op array's variables. The second program
# declares a hooked property before the method, whose hook php compiles,
# and whose written name it gives back, before the method.
[[line]]
name = "an-uncached-program-lays-each-declaration-at-its-place"
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/a.php" }
files = { "a.php" = "<?php $abcdef = 1; function f() {} class D { function m() { return function () {}; } } echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n", "h.php" = "<?php class C { public $p { get => 1; } function m() { return function () {}; } } echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n" }
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { SCRIPT_FILENAME = "{dir}/h.php" }

# An arrow function of such a program that reads a variable (#3837): php's
# compile lays `find_implicit_binds`' table at the first name it adds and
# keeps it while the arrow function's variables grow to its parameters and
# binds, giving it back before the body, so the peak is that table beside
# the variables. The second program's arrow function binds a parameter of
# the function it is written in.
[[line]]
name = "an-uncached-arrow-function-lays-its-implicit-binds-table"
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/a.php" }
files = { "a.php" = "<?php $f = fn () => $b; echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n", "f.php" = "<?php function f($a) { return fn () => $a; } echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n" }
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { SCRIPT_FILENAME = "{dir}/f.php" }

# A loop or `switch` of such a program (#3823): php's compile grows
# `CG(context).brk_cont_array` an element at each, which stands through
# the op array's `pass_two` and is freed by `zend_oparray_context_end`, so
# the first program's peak is that block's 24 bytes above the window's.
# The second nests a `for` and a `switch` in a `foreach`, four elements in
# one 80-byte block; the third writes, inside a loop, a closure with two
# of its own, whose `pass_two` stands beside the main op array's element.
[[line]]
name = "an-uncached-loop-lays-its-brk-cont-element"
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { REDIRECT_STATUS = "200", GATEWAY_INTERFACE = "CGI/1.1", REQUEST_METHOD = "GET", SCRIPT_FILENAME = "{dir}/a.php" }
files = { "a.php" = "<?php for (;;) { break; } echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n", "b.php" = "<?php foreach ([1, 2] as $a) { for ($i = 0; $i < 2; $i++) { switch ($i) { case 0: break; default: continue 2; } } while (false) {} } echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n", "c.php" = "<?php for (;;) { $f = function () { while (false) {} do {} while (false); }; break; } echo memory_get_usage(), \" \", memory_get_peak_usage(), \"\\n\";\n" }
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { SCRIPT_FILENAME = "{dir}/b.php" }
[[line.then]]
args = ["-n", "-d", "opcache.file_update_protection=3600"]
env = { SCRIPT_FILENAME = "{dir}/c.php" }
