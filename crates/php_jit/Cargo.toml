# php_jit: the compiled tier (jit-design.md; design §4.1, §4.3 seam 8;
# ADR-0006), `php_bundle`'s `jit` feature on the four targets its
# `[[crate]]` row names. It reads `php_engine` through `tier.lock` alone
# (jit-design.md §5.3, §6), and binds no Cranelift crate until a trace is
# lowered.
[package]
name = "php_jit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The compiled tier: Jit, the Tier beside the interpreter"

[lints]
workspace = true

[dependencies]
php_engine = { path = "../php_engine" }
php_unit = { path = "../php_unit" }       # the ini entries the tier declares (decl::IniDecl) and the op arrays the recorder reads, through unit.lock
php_heap = { path = "../php_heap" }       # the type a sampled operand holds (ZvalType), through heap.lock
libc = { workspace = true }               # the code arena's mapping and its cache maintenance on macOS (jit-design.md §4.4), already in the lock

[dev-dependencies]
# `tier::Epoch::fixture`, an epoch over one unit, so policy's state machine
# is driven through a `Holder::Root` with no engine (jit-design.md §4.7).
php_engine = { path = "../php_engine", features = ["test"] }

[features]
# The bench bar's program and the `bench` module it runs (#2742); off in
# every build but the bar's.
bench = []

[[bin]]
name = "php_jit_bench"
path = "src/bin/php_jit_bench.rs"
required-features = ["bench"]
