# php_jit: the compiled tier (jit-design.md; design §4.1, §4.3 seam 8;
# ADR-0006), `php_bundle`'s `jit` feature on the four targets its
# `[[crate]]` row names. It reads `php_engine` through `tier.lock` alone
# (jit-design.md §5.3, §6); `lower` alone names a Cranelift type.
[package]
name = "php_jit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The compiled tier: Jit, the Tier beside the interpreter"

[lints]
workspace = true

[dependencies]
php_engine = { path = "../php_engine" }
php_unit = { path = "../php_unit" }       # the ini entries the tier declares (decl::IniDecl) and the op arrays the recorder reads, through unit.lock
php_heap = { path = "../php_heap" }       # the type a sampled operand holds (ZvalType), through heap.lock
libc = { workspace = true }               # the code arena's mapping and its cache maintenance on macOS, and the unmapping on both (jit-design.md §4.4), already in the lock
cranelift-codegen = { workspace = true }  # lower: the one module that names a Cranelift type (jit-design.md §4.3)
cranelift-frontend = { workspace = true }
cranelift-native = { workspace = true }

# The targets `build.rs` sets `php_jit_arena` on that are Linux; Cargo
# cannot gate a dependency on a build script's cfg, so the set is said
# again here, and `build.rs` names this table.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
rustix = { workspace = true }             # the code arena's memfd, its seals and its two mappings on Linux (jit-design.md §4.4, §6; #2945's ruling)

[dev-dependencies]
# `tier::Epoch::fixture`, an epoch over one unit, so policy's state machine
# is driven through a `Holder::Root` with no engine (jit-design.md §4.7).
php_engine = { path = "../php_engine", features = ["test"] }

[features]
# The bench bar's program and the `bench` module it runs (#2742); off in
# every build but the bar's.
bench = []

[[bin]]
name = "php_jit_bench"
path = "src/bin/php_jit_bench.rs"
required-features = ["bench"]
