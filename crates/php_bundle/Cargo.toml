# The compiled tier, on the four targets alone (jit-design.md §6).
[target.'cfg(all(any(target_os = "linux", target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
php_jit = { path = "../php_jit", optional = true }

# The native attributes' parity extension, their refusals and their two
# rustc fixtures (#955) are held here, where the facade and Reflection
# are already this crate's edges; `php_macros` depends on no workspace
# crate (ADR-0007).
[dev-dependencies]
php_ext = { path = "../php_ext", features = ["test"] }
# `tests/engine_end.rs` reads the extensions' sources as syntax and their
# manifests as tables, and `tests/parity.rs` reads `oracle.toml` as one
# (#3081).
syn.workspace = true
toml.workspace = true
