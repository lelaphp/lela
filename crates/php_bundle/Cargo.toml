# php_bundle: the enabled set and the tier's name (ADR-0004; design §4.1,
# §4.10, §7.1), php-src's `internal_functions.c`. One feature per extension,
# each an optional dependency. `default` is php-src's default `./configure`
# set at the tag `oracle.toml` pins, which is the sixteen below: `mbstring`,
# `pdo_mysql`, `openssl` and `curl` are each an `--enable` or `--with` whose
# `config.m4` gives no default, are four of the rows `seams.toml` marks
# `feature =`, and are named on the command line to turn on. `pcntl` and
# `posix` are two more, which the `php` binary turns on and no server
# host does, as php builds pcntl for the CLI and a `fork()` in a process
# that serves requests on threads keeps one thread (design §7.2, revision
# 35); `sockets` is an `--enable` the `php` binary turns on and a
# server host may, since sockets are sound on threads (revision 36),
# `bz2`, php's `--with-bz2`, which the `php` binary turns on (revision
# 39), `bcmath`, php's `--enable-bcmath`, which the `php` binary turns
# on as the oracle is built with it (#1163), and `calendar` the last,
# php's `--enable-calendar`, which the `php` binary turns on for the same
# reason (#1163). So this file and the manifest name one default build and neither is
# read over the other (harness §7). `xtask new-ext <name>` appends the
# dependency and the feature and lists the crate in `default`; a person
# removes a non-default extension from `default` when porting it.
# `api-check` holds `enabled()` to the crate graph.
[package]
name = "php_bundle"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The enabled set of extensions and the tier's name"

[lints]
workspace = true

[features]
default = ["standard", "spl", "date", "reflection", "pcre", "session", "pdo", "dom", "random", "filter", "tokenizer", "json", "iconv", "pdo_sqlite", "ctype", "hash", "libxml", "lexbor", "zlib", "phar", "uri", "opcache", "simplexml"]
# The compiled tier (design §4.1, §11): a name that enables nothing until
# php_jit exists, when it enables the crate on the four targets.
jit = []
# The in-process host (design §4.3 seam 4, §8): the `Capture` sink and a fresh
# engine of `enabled()`, which an extension's own tests and the harness's
# witness lane serve a snippet through. Off by default.
test = ["php_ext/test"]
# The witness runner's trace (harness §4.5 condition 2, revision 58); xtask
# alone enables it.
witness-trace = ["test", "php_ext/witness-trace"]
# The engine the harness links, which serves the witness and crosscheck lanes
# (harness §7, revision 43): every extension feature but pcntl, whose fences
# the `php` binary serves so that nothing forks the harness (revision 61).
# xtask enables it; `new-ext` lists each crate it lays down here as it does in
# `default`, so an extension added is linked in the same commit (#1252).
linked = [
    "standard", "spl", "date", "reflection", "pcre", "mbstring", "session",
    "pdo", "dom", "random", "pdo_mysql", "filter", "tokenizer", "json",
    "openssl", "curl", "iconv", "pdo_sqlite", "ctype", "hash", "libxml",
    "lexbor", "zlib", "posix", "sockets", "phar", "bz2", "uri", "opcache", "bcmath", "simplexml",
    "calendar",
    "exif",
    "shmop",
    "sysvsem",
    "sysvmsg",
    "sysvshm",
    "ftp",
    "mysqlnd",
]
standard = ["dep:php_ext_standard", "random", "date", "uri"] # array.c and string.c include ext/random/php_random.h, microtime.c ext/date/php_date.h, the url wrappers ext/uri/php_uri.h
spl = ["dep:php_ext_spl", "pcre"] # php_spl.c: ZEND_MOD_REQUIRED("pcre")
date = ["dep:php_ext_date"]
reflection = ["dep:php_ext_reflection"]
pcre = ["dep:php_ext_pcre"]
mbstring = ["dep:php_ext_mbstring"]
session = ["dep:php_ext_session"]
pdo = ["dep:php_ext_pdo"]
dom = ["dep:php_ext_dom"]
random = ["dep:php_ext_random"]
pdo_mysql = ["dep:php_ext_pdo_mysql", "pdo", "mysqlnd"] # the `php` binary and the phpt lane, as php builds it with --with-pdo-mysql; php_pdo_mysql_int.h includes ext/mysqlnd/mysqlnd.h, and pdo_mysql.c ZEND_MOD_REQUIRED("pdo") (#1366)
filter = ["dep:php_ext_filter", "pcre"] # config.m4: PHP_ADD_EXTENSION_DEP(filter, pcre)
tokenizer = ["dep:php_ext_tokenizer"]
json = ["dep:php_ext_json"]
openssl = ["dep:php_ext_openssl"]
curl = ["dep:php_ext_curl"]
iconv = ["dep:php_ext_iconv"]
pdo_sqlite = ["dep:php_ext_pdo_sqlite"]
ctype = ["dep:php_ext_ctype"]
hash = ["dep:php_ext_hash"]
libxml = ["dep:php_ext_libxml"]
lexbor = ["dep:php_ext_lexbor"]
zlib = ["dep:php_ext_zlib"]
pcntl = ["dep:php_ext_pcntl"] # the `php` binary and the phpt lane alone (design §7.2, revision 35)
posix = ["dep:php_ext_posix"] # the `php` binary and the phpt lane alone (design §7.2, revision 35)
sockets = ["dep:php_ext_sockets"] # the `php` binary and the phpt lane, as php builds it with --enable-sockets (design §7.2, revision 36)
phar = ["dep:php_ext_phar"]
bz2 = ["dep:php_ext_bz2"] # the `php` binary and the phpt lane, as php builds it with --with-bz2 (design §7.2, revision 39)
uri = ["dep:php_ext_uri", "lexbor"] # php_uri.c: ZEND_MOD_REQUIRED("lexbor")
opcache = ["dep:php_ext_opcache"]
bcmath = ["dep:php_ext_bcmath"] # the `php` binary and the phpt lane, as php builds it with --enable-bcmath (#1163)
simplexml = ["dep:php_ext_simplexml"]
calendar = ["dep:php_ext_calendar"] # the `php` binary and the phpt lane, as php builds it with --enable-calendar (#1163)
exif = ["dep:php_ext_exif", "mbstring"] # the `php` binary and the phpt lane, as php builds it with --enable-exif; exif.c decodes its multibyte tags through the functions mbstring hands zend_multibyte (#1323)
shmop = ["dep:php_ext_shmop"] # the `php` binary and the phpt lane, as php builds it with --enable-shmop (#1323)
sysvsem = ["dep:php_ext_sysvsem"] # the `php` binary and the phpt lane, as php builds it with --enable-sysvsem (#1323)
sysvmsg = ["dep:php_ext_sysvmsg"] # the `php` binary and the phpt lane, as php builds it with --enable-sysvmsg (#1323)
sysvshm = ["dep:php_ext_sysvshm"] # the `php` binary and the phpt lane, as php builds it with --enable-sysvshm (#1323)
ftp = ["dep:php_ext_ftp", "openssl"] # the `php` binary and the phpt lane, as php builds it with --enable-ftp; ftp_ssl_connect secures its connections through the crypto layer openssl registers (#1323)
mysqlnd = ["dep:php_ext_mysqlnd"] # turned on by pdo_mysql and mysqli, as php builds mysqlnd only for them; its config9.m4 gives no default (#1345, #1366)

# The facade for `Extension` and `Nop`; the extensions as `new-ext` adds them.
[dependencies]
php_ext = { path = "../php_ext" }
php_ext_standard = { path = "../../ext/standard", optional = true }
php_ext_spl = { path = "../../ext/spl", optional = true }
php_ext_date = { path = "../../ext/date", optional = true }
php_ext_reflection = { path = "../../ext/reflection", optional = true }
php_ext_pcre = { path = "../../ext/pcre", optional = true }
php_ext_mbstring = { path = "../../ext/mbstring", optional = true }
php_ext_session = { path = "../../ext/session", optional = true }
php_ext_pdo = { path = "../../ext/pdo", optional = true }
php_ext_dom = { path = "../../ext/dom", optional = true }
php_ext_random = { path = "../../ext/random", optional = true }
php_ext_pdo_mysql = { path = "../../ext/pdo_mysql", optional = true }
php_ext_filter = { path = "../../ext/filter", optional = true }
php_ext_tokenizer = { path = "../../ext/tokenizer", optional = true }
php_ext_json = { path = "../../ext/json", optional = true }
php_ext_openssl = { path = "../../ext/openssl", optional = true }
php_ext_curl = { path = "../../ext/curl", optional = true }
php_ext_iconv = { path = "../../ext/iconv", optional = true }
php_ext_pdo_sqlite = { path = "../../ext/pdo_sqlite", optional = true }
php_ext_ctype = { path = "../../ext/ctype", optional = true }
php_ext_hash = { path = "../../ext/hash", optional = true }
php_ext_libxml = { path = "../../ext/libxml", optional = true }
php_ext_lexbor = { path = "../../ext/lexbor", optional = true }
php_ext_zlib = { path = "../../ext/zlib", optional = true }
php_ext_pcntl = { path = "../../ext/pcntl", optional = true }
php_ext_posix = { path = "../../ext/posix", optional = true }
php_ext_sockets = { path = "../../ext/sockets", optional = true }
php_ext_phar = { path = "../../ext/phar", optional = true }
php_ext_bz2 = { path = "../../ext/bz2", optional = true }
php_ext_uri = { path = "../../ext/uri", optional = true }
php_ext_opcache = { path = "../../ext/opcache", optional = true }
php_ext_bcmath = { path = "../../ext/bcmath", optional = true }
php_ext_simplexml = { path = "../../ext/simplexml", optional = true }
php_ext_calendar = { path = "../../ext/calendar", optional = true }
php_ext_exif = { path = "../../ext/exif", optional = true }
php_ext_shmop = { path = "../../ext/shmop", optional = true }
php_ext_sysvsem = { path = "../../ext/sysvsem", optional = true }
php_ext_sysvmsg = { path = "../../ext/sysvmsg", optional = true }
php_ext_sysvshm = { path = "../../ext/sysvshm", optional = true }
php_ext_ftp = { path = "../../ext/ftp", optional = true }
php_ext_mysqlnd = { path = "../../ext/mysqlnd", optional = true }

# The native attributes' parity extension, their refusals and their two
# rustc fixtures (#955) are held here, where the facade and Reflection
# are already this crate's edges; `php_macros` depends on no workspace
# crate (ADR-0007).
[dev-dependencies]
php_ext = { path = "../php_ext", features = ["test", "witness-trace"] }
