# php_syntax: lexer, lossless token stream, typed tree, parser (design §4.9,
# ADR-0003). The schema and the kind enum stand, emitted by build.rs from
# php.ungram; `Parsed` and `parse()` are a stub so php_compile's edge and
# signature exist, and the rest of the Mahout port is its own tickets.
[package]
name = "php_syntax"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The syntax: the schema and its kind enum, lossless tokens and a typed tree in a safe arena; a stub until the port lands"

[lints]
workspace = true

