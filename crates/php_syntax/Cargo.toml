# php_syntax: lexer, lossless token stream, typed tree, parser (design §4.9,
# ADR-0003). The schema and the kind enum stand, emitted by build.rs from
# php.ungram, the lexer with the source model under it, the arena, the
# tree builder and the dump, the parser and the grammar written against
# it; `parse()` hands back the tree with the diagnostics in the inherited
# wording until php's parse-error text and the parse entry are settled.
[package]
name = "php_syntax"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The syntax: the schema and its kind enum, the lexer, lossless tokens, a typed tree in a safe arena, its builder, the parser and the grammar"

[lints]
workspace = true

[dependencies]
# The parse arena's chunks and the stacks' mappings, which stay php_heap's,
# an `unsafe` home, so this crate keeps none.
php_heap = { path = "../php_heap" }

[dev-dependencies]
expect-test.workspace = true
# The calling thread's CPU clock, so the linear-time test measures the
# parse and not the load beside it.
nix = { workspace = true, features = ["time"] }
