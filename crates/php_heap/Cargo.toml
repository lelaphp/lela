# php_heap: the memory model and the stacks, an `unsafe` home (design §4.1,
# §5; seams.toml crate row and unsafe.homes). Depends on nothing in the
# workspace; `libc` is the platform's own headers, which
# `zend_call_stack.c`'s probe of the thread's bounds names, and
# `corosensei` is a fiber's machine stack and the switch onto it, which
# `zend_fibers.c`'s boost.context is (design §4.1, §5.11).
[package]
name = "php_heap"
version = "0.0.0"
edition.workspace = true
# The workspace's, but for numeric/dtoa.rs, a port of David M. Gay's dtoa
# under its own notice, and sort.rs, a port of libc++'s std::sort under
# NCSA OR MIT (THIRD-PARTY.md).
license = "MIT AND BSD-3-Clause AND dtoa AND (MIT OR NCSA)"
rust-version.workspace = true
publish = false
description = "The memory model: zval, refcounted header, VM stack, map table, the heap port"

[lints]
workspace = true

[dependencies]
libc = { workspace = true }
corosensei = { workspace = true }

# The main thread's bounds are read only by a test that is the process's
# own `main`, which the libtest harness never runs a test on.
[[test]]
name = "main_thread_stack"
harness = false
