# tier.lock: what php_jit imports from php_engine, and the face php_sapi re-exports for the debugging host (design §4.5, §5.8 revision 51; jit-design.md §2, §2.4 revisions 8 and 15; ADR-0006), in two sections, face and kernels. The face is the mechanism and the writes and nothing that reads: a host reads frames, op arrays and the linked tables through the native face (#1911). Diffed per section by api-check once it measures sectioned locks; php_jit records under its lanes and imports from the face alone, which holds the items month one has laid down, the debugging host drives and the recorder reads between its steps (an operand's sample, a heap frame, the call being built), with the test face's serve_kept, through which a tier's test reads back the request state it kept, and its in_a_process_apart, through which a test that forks runs in a process of its own (#3542), and the observer types of api::abi and api::values::Value that php_jit's #[cfg(test)] mod observed declares an observing extension with, the one test that serves seam 9 under the linked tier: php_bundle's tests build without its jit feature and ext/* reaches no php_jit, so no other test links the tier beside an observer (#2962); the kernels section is generated by api-check from php_jit's kernels! list, each engine item a line serves through that the face does not list (jit-design.md §5.3, #2957).
