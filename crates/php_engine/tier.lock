# tier.lock: what php_jit imports from php_engine, and the face php_sapi re-exports for the debugging host (design §4.5, §5.8 revision 51; jit-design.md §2, §2.4 revisions 8 and 15; ADR-0006), in two sections, face and kernels. The face is the mechanism and the writes and nothing that reads: a host reads frames, op arrays and the linked tables through the native face (#1911). Diffed per section by api-check once it measures sectioned locks; php_jit runs Mode::Off and imports from the face alone, which holds the items month one has laid down and the debugging host drives, and the kernels section is empty until the kernels! list names its first ops kernel.
