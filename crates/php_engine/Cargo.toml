# php_engine: kernels, dispatch, the tier seam, the linker, serve and api
# (design §4.1, §5). Five edges: php_compile, php_unit, php_heap,
# php_macros, whose attributes declare Core's natives (ADR-0007), and
# php_process, the process-wide mechanisms it decides over (#1779).
[package]
name = "php_engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The engine: one executor over php_unit, the native face `api`, the tier seam, serve"

[lints]
workspace = true

[features]
# The test face (design §4.3 seam 4, ADR-0002): the `Capture` sink and
# `Engine::serve_capture`, enabled by an extension's dev-dependency on
# php_ext with its `test` feature.
test = []
# The witness runner's trace (harness §4.5 condition 2, revision 58): the
# natives a request enters, recorded by the entry a php_macros expansion
# builds and handed back through the test face. Enabled by xtask alone, so
# the host's binary and the bench carry none of it.
witness-trace = ["test"]

[dependencies]
php_compile = { path = "../php_compile" }
php_heap = { path = "../php_heap" }
php_unit = { path = "../php_unit" }
php_macros = { path = "../php_macros" }
php_process = { path = "../php_process" }

# The dispatch is generated from ops.toml (design §4.3 seam 7).
[build-dependencies]
toml.workspace = true

