# php_engine: kernels, dispatch, the tier seam, the linker, serve and api
# (design §4.1, §5). Three edges: php_compile, php_unit, php_heap.
[package]
name = "php_engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The engine: one executor over php_unit, the native face `api`, the tier seam, serve"

[lints]
workspace = true

[features]
# The test face (design §4.3 seam 4, ADR-0002): the `Capture` sink and
# `Engine::serve_capture`, enabled by an extension's dev-dependency on
# php_ext with its `test` feature.
test = []

[dependencies]
php_compile = { path = "../php_compile" }
php_heap = { path = "../php_heap" }
php_unit = { path = "../php_unit" }

# The dispatch is generated from ops.toml (design §4.3 seam 7).
[build-dependencies]
toml.workspace = true

