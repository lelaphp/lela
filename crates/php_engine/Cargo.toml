# php_engine: kernels, dispatch, the tier seam, the linker, serve and api
# (design §4.1, §5). Five edges: php_compile, php_unit, php_heap,
# php_macros, whose attributes declare Core's natives (ADR-0007), and
# php_process, the process-wide mechanisms it decides over. Its version is
# the workspace's, the one the hosts inherit, so the engine's `BuildDefs`
# says which Lela it is.
[package]
name = "php_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The engine: one executor over php_unit, the native face `api`, the tier seam, serve"

[lints]
workspace = true

[features]
# The test face (design §4.3 seam 4, ADR-0002): the `Capture` sink and
# `Engine::serve_capture`, enabled by an extension's dev-dependency on
# php_ext with its `test` feature.
test = []
# The counting build of the loop (design §5.8): each opline the
# loop dispatches counted by its `php_unit::Handler`, and the counts written
# to the host's error stream where the request ends, which `xtask
# dispatch-census` reads. Off by default, and in no host's default build.
dispatch-census = []

[dependencies]
php_compile = { path = "../php_compile" }
php_heap = { path = "../php_heap" }
php_unit = { path = "../php_unit" }
php_link = { path = "../php_link" }
php_macros = { path = "../php_macros" }
php_process = { path = "../php_process" }
# `api::abi::PoolKey`: the SHA-256 digest a pool keys a credential's
# connection by; the lock holds it already, for ext/hash.
sha2 = { workspace = true }

# The dispatch is generated from ops.toml (design §4.3 seam 7).
[build-dependencies]
toml.workspace = true

