# php_unit: the unit format (design §4.7, ADR-0001), a leaf below both the
# compiler and the engine. Depends on php_heap for literal values, and on
# php_macros for #[derive(EngineState)] alone, which links nothing.
[package]
name = "php_unit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The unit format: declaration model, op arrays, the opcode enum generated from ops.toml"

[lints]
workspace = true

[dependencies]
php_heap = { path = "../php_heap" }
php_macros = { path = "../php_macros" }

[dev-dependencies]
expect-test.workspace = true

[build-dependencies]
toml.workspace = true
