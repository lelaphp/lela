# php: the binary (design §4.1). The bundle's enabled set on one engine, the
# tier the bundle names, served by php_sapi's CLI host. Two edges, php_bundle
# and php_sapi; the engine is named through the host face alone.
[package]
name = "php"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The binary: the bundle's enabled set on one engine, behind the CLI host"

[lints]
workspace = true

[[bin]]
name = "php"
path = "src/main.rs"

# The same binary with `php_engine`'s `witness-trace` on, which the witness
# lane builds and serves a fence marked `process` through, and nothing else
# does: under a name of its own, so `target/*/php` stays the default build
# the phpt lane runs (harness §8, revision 61).
[[bin]]
name = "php-witness"
path = "src/witness.rs"
required-features = ["witness-trace"]

[features]
# Every request the binary serves appends the natives it entered to the file
# `PHP_WITNESS_TRACE` names (harness §4.5 condition 2, revision 61).
witness-trace = ["php_bundle/witness-trace"]

[dependencies]
# The bundle's default set and five it turns on: `pcntl` and `posix`,
# which php builds for the CLI and which no server host carries (design
# §7.2, revision 35), `sockets`, php's `--enable-sockets` (revision 36),
# `bz2`, php's `--with-bz2` (revision 39), and `openssl`, php's
# `--with-openssl`, which the oracle is built with and ext/phar's
# OpenSSL signatures call into (#1108).
php_bundle = { path = "../php_bundle", features = ["pcntl", "posix", "sockets", "bz2", "openssl"] }
php_sapi = { path = "../php_sapi" }
