# php: the binary (design §4.1). The bundle's enabled set on one engine, the
# tier the bundle names, served by php_sapi's CLI host. Two edges, php_bundle
# and php_sapi; the engine is named through the host face alone.
[package]
name = "php"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The binary: the bundle's enabled set on one engine, behind the CLI host"

[lints]
workspace = true

[[bin]]
name = "php"
path = "src/main.rs"

[dependencies]
# The bundle's default set and the two extensions the binary alone turns
# on: `pcntl` and `posix`, which php builds for the CLI and which no server
# host carries (design §7.2, revision 35).
php_bundle = { path = "../php_bundle", features = ["pcntl", "posix"] }
php_sapi = { path = "../php_sapi" }
