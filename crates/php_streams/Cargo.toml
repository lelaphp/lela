# php_streams: php's main/streams/ and main/network.c (design §4.1, §4.3
# seam 5): wrappers, transports, filters, the user wrapper
# and the stream context, above php_engine over its api. The engine
# reaches it only through the open hook ext/standard hands it, php's
# `zend_stream_open_function`, and through request state; extensions reach
# its items through php_ext, counted in api.lock. Two edges: php_engine
# and php_macros, of which it uses php_engine alone.
[package]
name = "php_streams"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Streams: wrappers, transports, filters and the user wrapper, over php_engine's api"

[lints]
workspace = true

[dependencies]
php_engine = { path = "../php_engine" }
