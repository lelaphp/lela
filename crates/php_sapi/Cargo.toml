# php_sapi: the hosts' facade (ADR-0008; design §4.1, §4.3 seam 4, §5.14), as
# php_ext is the extensions'. Every host under `sapi/` reaches the engine
# through it: php_engine's host face, `sapi.lock`, re-exported, and what
# php-src shares between its SAPIs. Two edges: php_engine through the host
# face, and php_proto for the codecs; never `api`.
[package]
name = "php_sapi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The hosts' facade: the engine's host face and what php-src shares between its SAPIs"

[lints]
workspace = true

[dependencies]
php_engine = { path = "../php_engine" }
php_proto = { path = "../php_proto" }
# The platform's errno values, which php-src's hosts compare `errno`
# against (`cgi::unopened`'s `EACCES`); no call is made through it.
libc = { workspace = true }
